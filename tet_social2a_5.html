<!doctype html>
<html lang="te">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TET 2A Social Quiz 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&family=Noto+Sans:wght@400;600&family=Noto+Sans+Telugu:wght@400;600;700&family=Ramabhadra&display=swap">
<style>
/* Layout: a single atlas-sheet column — teacher header, quiz card, question map grid, credit footer */
:root{
  --paper:#f4f6f1; --sheet:#ffffff; --ink:#1d3442; --muted:#5b6d72; --line:#d7dfd8;
  --accent:#b8742a; --accent-soft:#f6ead9; --sea:#2c6e7f; --sea-soft:#e2eff1;
  --ok:#2f7d4a; --ok-soft:#e3f2e7; --bad:#b23b33; --bad-soft:#f8e3e1;
  --c1:#f26b00; --c2:#00897b; --c3:#7b3fe4; --c4:#e0245e; --on-hero:#ffffff;
  --hero:linear-gradient(120deg,#ff8a1f 0%,#e8405f 50%,#8a3ee0 100%);
  --f-display:"Bitter","Ramabhadra",Georgia,serif;
  --f-te:"Noto Sans Telugu","Noto Sans",system-ui,sans-serif;
  --f-body:"Noto Sans","Noto Sans Telugu",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#111a1f; --sheet:#18242b; --ink:#e5ece8; --muted:#9db0b2; --line:#2c3b42;
  --accent:#e0a35a; --accent-soft:#3a2c1b; --sea:#7fc0cf; --sea-soft:#1c3239;
  --ok:#6fcf8e; --ok-soft:#173326; --bad:#f08b80; --bad-soft:#3b1e1c; --c1:#ffa04d; --c2:#4fd3c3; --c3:#b590ff; --c4:#ff6f9a; --hero:linear-gradient(120deg,#c25a0c 0%,#a82a4a 50%,#5b2aa3 100%); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111a1f; --sheet:#18242b; --ink:#e5ece8; --muted:#9db0b2; --line:#2c3b42;
  --accent:#e0a35a; --accent-soft:#3a2c1b; --sea:#7fc0cf; --sea-soft:#1c3239;
  --ok:#6fcf8e; --ok-soft:#173326; --bad:#f08b80; --bad-soft:#3b1e1c; --c1:#ffa04d; --c2:#4fd3c3; --c3:#b590ff; --c4:#ff6f9a; --hero:linear-gradient(120deg,#c25a0c 0%,#a82a4a 50%,#5b2aa3 100%); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:18px 28px;display:flex;flex-direction:column;gap:16px}
header.top{display:flex;align-items:center;gap:16px;background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
header.top img{width:84px;height:88px;object-fit:cover;border-radius:12px;border:3px solid var(--accent);flex:none}
.ht{min-width:0;display:flex;flex-direction:column;gap:2px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}
h1{font-family:var(--f-display);font-size:clamp(20px,4.6vw,26px);line-height:1.2;margin:0;text-wrap:balance}
.sub{font-family:var(--f-te);color:var(--muted);font-size:14px}
.langs{display:flex;flex-wrap:wrap;gap:8px}
.langs button{font:600 14px var(--f-te);padding:8px 14px;border-radius:999px;border:1.5px solid var(--sea);background:transparent;color:var(--sea);cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--sea);color:var(--sheet)}
.status{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.status b{color:var(--ink)}
.bar{flex:1 1 160px;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:18px 16px;display:flex;flex-direction:column;gap:14px}
.qno{font-family:var(--f-display);color:var(--accent);font-size:15px}
.qtext{display:flex;flex-direction:column;gap:4px;white-space:pre-line}
.qtext .en{font-size:17px;font-weight:600}
.qtext .te{font-family:var(--f-te);font-size:17px;font-weight:600}
.qtext .en+.te{font-weight:400;color:var(--muted);font-size:16px}
.mtab{overflow-x:auto}
.mtab table{border-collapse:collapse;width:100%;font-size:15px}
.mtab th,.mtab td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.mtab th{background:var(--sea-soft);color:var(--sea);font-weight:600}
.mtab small{display:block;font-family:var(--f-te);color:var(--muted)}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--sheet);color:var(--ink);font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--sea);background:var(--sea-soft)}
.opt:focus-visible,.langs button:focus-visible,.nav button:focus-visible,.grid button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--sea-soft);color:var(--sea);font-weight:700;font-size:14px}
.opt .t{min-width:0;display:flex;flex-direction:column}
.opt .t .te{font-family:var(--f-te)}
.opt .t .en+.te{color:var(--muted);font-size:15px}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);color:var(--sheet)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:var(--sheet)}
.exp{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.exp .verdict{font-weight:700}
.exp .verdict.ok{color:var(--ok)} .exp .verdict.no{color:var(--bad)}
.exp .te{font-family:var(--f-te)}
.nav{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.nav button{font:600 15px var(--f-te);padding:10px 18px;border-radius:10px;border:none;background:var(--ink);color:var(--sheet);cursor:pointer}
.nav button.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.nav button:disabled{opacity:.4;cursor:default}
.mapcard{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.mapcard h2{font-family:var(--f-display);font-size:16px;margin:0}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.grid button{aspect-ratio:1;max-width:100%;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:600 13px var(--f-body);cursor:pointer;font-variant-numeric:tabular-nums;padding:0}
.grid button.r{background:var(--ok);color:var(--sheet);border-color:var(--ok)}
.grid button.w{background:var(--bad);color:var(--sheet);border-color:var(--bad)}
.grid button.cur{outline:2px solid var(--accent);outline-offset:1px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.result{text-align:center;align-items:center}
.result .big{font-family:var(--f-display);font-size:44px;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1}

/* ---- colourful layer ---- */
body{background:
  radial-gradient(600px 400px at 0% 0%,color-mix(in srgb,var(--c1) 16%,transparent),transparent 70%),
  radial-gradient(600px 420px at 100% 30%,color-mix(in srgb,var(--c3) 14%,transparent),transparent 70%),
  radial-gradient(700px 500px at 20% 100%,color-mix(in srgb,var(--c2) 14%,transparent),transparent 70%),
  var(--paper);background-attachment:fixed}
header.top{background:var(--hero);border:none;color:var(--on-hero);box-shadow:0 10px 26px -12px color-mix(in srgb,var(--c4) 60%,transparent)}
header.top img{border:3px solid var(--on-hero);box-shadow:0 0 0 4px color-mix(in srgb,var(--on-hero) 35%,transparent)}
header.top .eyebrow{color:var(--on-hero);opacity:.9}
header.top .sub{color:var(--on-hero);opacity:.92}
.langs button:nth-child(1){--lc:var(--c1)} .langs button:nth-child(2){--lc:var(--c4)} .langs button:nth-child(3){--lc:var(--c2)}
.langs button{border-color:var(--lc);color:var(--lc);background:color-mix(in srgb,var(--lc) 8%,var(--sheet))}
.langs button[aria-pressed="true"]{background:var(--lc);color:var(--sheet)}
.bar{height:10px}
.bar i{background:linear-gradient(90deg,var(--c1),var(--c4),var(--c3))}
.status b{color:var(--c3)}
.card{border:none;border-top:6px solid transparent;background:linear-gradient(var(--sheet),var(--sheet)) padding-box,linear-gradient(90deg,var(--c1),var(--c4),var(--c3),var(--c2)) border-box;box-shadow:0 8px 24px -14px color-mix(in srgb,var(--c3) 50%,transparent)}
.qno{display:inline-block;align-self:flex-start;background:color-mix(in srgb,var(--c1) 14%,var(--sheet));color:var(--c1);padding:3px 12px;border-radius:999px}
.opts .opt:nth-child(1){--oc:var(--c1)} .opts .opt:nth-child(2){--oc:var(--c2)} .opts .opt:nth-child(3){--oc:var(--c3)} .opts .opt:nth-child(4){--oc:var(--c4)}
.opt{border-color:color-mix(in srgb,var(--oc) 35%,var(--line));background:color-mix(in srgb,var(--oc) 5%,var(--sheet))}
.opt .k{background:var(--oc);color:var(--sheet)}
.opt:hover:not(:disabled){border-color:var(--oc);background:color-mix(in srgb,var(--oc) 13%,var(--sheet))}
.opt.right{border-color:var(--ok);background:var(--ok-soft)} .opt.right .k{background:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)} .opt.wrong .k{background:var(--bad)}
.exp{border-left-color:var(--c3);background:color-mix(in srgb,var(--c3) 10%,var(--sheet))}
.mtab th{background:color-mix(in srgb,var(--c2) 16%,var(--sheet));color:var(--c2)}
.nav button{background:linear-gradient(120deg,var(--c4),var(--c3));color:var(--on-hero)}
.nav button.ghost{background:color-mix(in srgb,var(--c2) 8%,var(--sheet));color:var(--c2);border-color:var(--c2)}
.mapcard{border:none;box-shadow:0 8px 24px -16px color-mix(in srgb,var(--c2) 60%,transparent)}
.mapcard h2{color:var(--c2)}
.grid button:nth-child(4n+1){--gc:var(--c1)} .grid button:nth-child(4n+2){--gc:var(--c2)} .grid button:nth-child(4n+3){--gc:var(--c3)} .grid button:nth-child(4n){--gc:var(--c4)}
.grid button{border-color:color-mix(in srgb,var(--gc) 45%,var(--line));background:color-mix(in srgb,var(--gc) 9%,var(--sheet));color:var(--gc)}
.grid button.r{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.grid button.w{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.grid button.cur{outline:3px solid var(--c4)}
.result .big{background:linear-gradient(90deg,var(--c1),var(--c4),var(--c3));-webkit-background-clip:text;background-clip:text;color:transparent}
footer{border-top:none;background:var(--hero);color:var(--on-hero);border-radius:14px;padding:14px 16px}
footer b{color:var(--on-hero)}
footer{text-align:center;font-family:var(--f-te);font-size:15px;color:var(--muted);border-top:1px dashed var(--line);padding-top:14px}
footer b{color:var(--ink)}
footer{color:var(--on-hero);border-top:none;background:var(--hero);border-radius:14px;padding:14px 16px} footer b{color:var(--on-hero)}
@media (max-width:480px){.grid{grid-template-columns:repeat(8,1fr)} header.top img{width:70px;height:74px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---- larger text ---- */
body{font-size:18px;line-height:1.6}
.wrap{max-width:820px;gap:18px}
.eyebrow{font-size:13.5px}
h1{font-size:clamp(23px,5.4vw,30px)}
.sub{font-size:16.5px}
header.top img{width:96px;height:100px}
.langs button{font-size:16.5px;padding:10px 18px}
.status{font-size:16.5px}
.qno{font-size:17px}
.qtext .en,.qtext .te{font-size:21px;line-height:1.55}
.qtext .en+.te{font-size:20px}
.opt{padding:14px 16px;gap:14px;font-size:19px}
.opt .k{width:36px;height:36px;font-size:17px}
.opt .t .en+.te{font-size:18px}
.mtab table{font-size:18px}
.exp{font-size:18.5px;padding:14px 16px}
.nav button{font-size:17.5px;padding:12px 22px}
.mapcard h2{font-size:19px}
.grid button{font-size:15.5px}
.legend{font-size:15px}
footer{font-size:18px!important}
footer span{font-size:15px!important}
.result .big{font-size:56px}
@media (max-width:480px){.qtext .en,.qtext .te{font-size:20px}.opt{font-size:18px}.grid{grid-template-columns:repeat(7,1fr)}header.top img{width:80px;height:84px}}
</style>

const Q=[
{q:["PENCIL became functional in this year","PENCIL అమల్లోకి వచ్చిన సంవత్సరం"],o:[["2020","2020"],["2008","2008"],["2012","2012"],["2017","2017"]],a:3,
e:["PENCIL (Platform for Effective Enforcement for No Child Labour) is an online portal launched by the Ministry of Labour in September 2017 to enforce child labour laws.","PENCIL (బాల కార్మికత నిర్మూలన అమలు వేదిక) అనేది బాల కార్మిక చట్టాల అమలు కోసం కార్మిక మంత్రిత్వ శాఖ 2017 సెప్టెంబర్‌లో ప్రారంభించిన ఆన్‌లైన్ పోర్టల్."]},
{q:["The 'National Human Rights Commission' in India is appointed by","భారతదేశంలో 'జాతీయ మానవ హక్కుల కమిషన్'ను నియమించేవారు"],o:[["President","రాష్ట్రపతి"],["Parliament","పార్లమెంటు"],["Prime Minister","ప్రధానమంత్రి"],["Supreme Court","సుప్రీంకోర్టు"]],a:0,
e:["The Chairperson and members of the NHRC are appointed by the President on the recommendation of a committee headed by the Prime Minister. It was set up in 1993.","NHRC అధ్యక్షుడు, సభ్యులను ప్రధానమంత్రి నేతృత్వంలోని కమిటీ సిఫార్సుపై రాష్ట్రపతి నియమిస్తారు. ఇది 1993లో ఏర్పడింది."]},
{q:["The ZANU-PF party belongs to this country","ZANU-PF పార్టీ ఈ దేశానికి చెందినది"],o:[["Zimbabwe","జింబాబ్వే"],["France","ఫ్రాన్స్"],["Germany","జర్మనీ"],["Italy","ఇటలీ"]],a:0,
e:["ZANU-PF (Zimbabwe African National Union – Patriotic Front) has ruled Zimbabwe since independence in 1980; Robert Mugabe led it for decades.","ZANU-PF (జింబాబ్వే ఆఫ్రికన్ నేషనల్ యూనియన్ – పేట్రియాటిక్ ఫ్రంట్) 1980 స్వాతంత్ర్యం నుండి జింబాబ్వేను పాలిస్తోంది; రాబర్ట్ ముగాబే దశాబ్దాల పాటు దీనిని నడిపించారు."]},
{q:["The Greek word 'Demos' means","గ్రీకు పదమైన 'డెమోస్' అంటే అర్థం"],o:[["Dictators","నియంతలు"],["Kings","రాజులు"],["People","ప్రజలు"],["Rulers","పరిపాలకులు"]],a:2,
e:["'Demos' means people and 'kratia' means rule. So democracy means rule by the people.","'డెమోస్' అంటే ప్రజలు, 'క్రటియా' అంటే పాలన. కాబట్టి డెమోక్రసీ అంటే ప్రజల పాలన."]},
{q:["The capital city of Belgium is","బెల్జియం రాజధాని నగరం"],o:[["Brussels","బ్రస్సెల్స్"],["Berlin","బెర్లిన్"],["Moscow","మాస్కో"],["The Hague","ది హేగ్"]],a:0,
e:["Brussels is the capital of Belgium and also the headquarters of the European Union. Berlin is Germany's capital and Moscow is Russia's.","బ్రస్సెల్స్ బెల్జియం రాజధాని, యూరోపియన్ యూనియన్ ప్రధాన కేంద్రం కూడా. బెర్లిన్ జర్మనీ రాజధాని, మాస్కో రష్యా రాజధాని."]},
{q:["The official language of Sri Lanka","శ్రీలంక అధికారిక భాష"],o:[["French","ఫ్రెంచ్"],["Urdu","ఉర్దూ"],["Dutch","డచ్"],["Sinhala","సింహళం"]],a:3,
e:["The Official Language Act of 1956 made Sinhala the only official language of Sri Lanka, ignoring Tamil — an example of majoritarianism. Tamil was later also made official.","1956 అధికార భాషా చట్టం తమిళాన్ని విస్మరించి సింహళాన్ని మాత్రమే శ్రీలంక అధికార భాషగా చేసింది — ఇది మెజారిటీవాదానికి ఉదాహరణ. తర్వాత తమిళాన్ని కూడా అధికార భాషగా చేశారు."]},
{q:["The National Human Rights Commission headquarters is located in","జాతీయ మానవ హక్కుల కమిషన్ ప్రధాన కార్యాలయం ఇక్కడ ఉంది"],o:[["Mumbai","ముంబై"],["Hyderabad","హైదరాబాద్"],["Chennai","చెన్నై"],["Delhi","ఢిల్లీ"]],a:3,
e:["The NHRC headquarters is in New Delhi.","NHRC ప్రధాన కార్యాలయం న్యూఢిల్లీలో ఉంది."]},
{q:["22 official languages are included in this Schedule of the Indian Constitution","భారత రాజ్యాంగంలోని ఈ షెడ్యూల్‌లో 22 అధికార భాషలను చేర్చారు"],o:[["Schedule 8","8వ షెడ్యూల్"],["Schedule 10","10వ షెడ్యూల్"],["Schedule 9","9వ షెడ్యూల్"],["Schedule 7","7వ షెడ్యూల్"]],a:0,
e:["The Eighth Schedule lists 22 languages. The 7th Schedule divides subjects into Union, State and Concurrent lists; the 10th deals with anti-defection.","8వ షెడ్యూల్‌లో 22 భాషలు ఉన్నాయి. 7వ షెడ్యూల్ కేంద్ర, రాష్ట్ర, ఉమ్మడి జాబితాలను; 10వ షెడ్యూల్ పార్టీ ఫిరాయింపుల నిరోధాన్ని తెలుపుతాయి."]},
{q:["Belgium is located in this continent","బెల్జియం ఈ ఖండంలో ఉంది"],o:[["Africa","ఆఫ్రికా"],["Europe","యూరప్"],["Asia","ఆసియా"],["South America","దక్షిణ అమెరికా"]],a:1,
e:["Belgium is a small country in western Europe, bordering France, the Netherlands, Germany and Luxembourg.","బెల్జియం పశ్చిమ యూరప్‌లోని చిన్న దేశం. దీనికి ఫ్రాన్స్, నెదర్లాండ్స్, జర్మనీ, లక్సెంబర్గ్ సరిహద్దులుగా ఉన్నాయి."]},
{q:["The European Parliament is located in","యూరోపియన్ పార్లమెంటు ఇక్కడ ఉంది"],o:[["Rome","రోమ్"],["Berlin","బెర్లిన్"],["Moscow","మాస్కో"],["Brussels","బ్రస్సెల్స్"]],a:3,
e:["As per the textbook, Brussels — the headquarters of the European Union. (The European Parliament meets in both Brussels and Strasbourg.)","పాఠ్యపుస్తకం ప్రకారం యూరోపియన్ యూనియన్ ప్రధాన కేంద్రమైన బ్రస్సెల్స్. (యూరోపియన్ పార్లమెంటు బ్రస్సెల్స్, స్ట్రాస్‌బర్గ్ రెండు చోట్లా సమావేశమవుతుంది.)"]},
{q:["The symbol of the Bahujan Samaj Party","బహుజన్ సమాజ్ పార్టీ ఎన్నికల గుర్తు"],o:[["Lion","సింహం"],["Elephant","ఏనుగు"],["Kite","గాలిపటం"],["Mango","మామిడికాయ"]],a:1,
e:["The election symbol of the BSP is the elephant.","బీఎస్పీ ఎన్నికల గుర్తు ఏనుగు."]},
{q:["The mismatched pair of regional party and state","ప్రాంతీయ పార్టీ – రాష్ట్రం జతలలో సరికానిది"],o:[["Shiromani Akali Dal – Punjab","శిరోమణి అకాలీదళ్ – పంజాబ్"],["Dravida Munnetra Kazhagam – Kerala","ద్రావిడ మున్నేట్ర కజగం – కేరళ"],["Mizoram People's Conference – Mizoram","మిజోరం పీపుల్స్ కాన్ఫరెన్స్ – మిజోరం"],["Asom Gana Parishad – Assam","అసోం గణ పరిషత్ – అస్సాం"]],a:1,

{q:["This country does not border Belgium","బెల్జియంకు సరిహద్దుగా లేని దేశం"],o:[["Netherlands","నెదర్లాండ్స్"],["Germany","జర్మనీ"],["France","ఫ్రాన్స్"],["China","చైనా"]],a:3,
e:["Belgium borders the Netherlands, Germany, France and Luxembourg. China is in Asia.","బెల్జియంకు నెదర్లాండ్స్, జర్మనీ, ఫ్రాన్స్, లక్సెంబర్గ్ సరిహద్దులు. చైనా ఆసియాలో ఉంది."]},
{q:["This country is an example of a multi-party system","బహుళ పార్టీ వ్యవస్థకు ఈ దేశం ఒక ఉదాహరణ"],o:[["India","భారతదేశం"],["China","చైనా"],["America","అమెరికా"],["Britain","బ్రిటన్"]],a:0,
e:["India has many national and regional parties — a multi-party system. China has a one-party system; the USA and Britain are mainly two-party systems.","భారతదేశంలో అనేక జాతీయ, ప్రాంతీయ పార్టీలు ఉన్నాయి — ఇది బహుళ పార్టీ వ్యవస్థ. చైనాలో ఏక పార్టీ వ్యవస్థ; అమెరికా, బ్రిటన్‌లలో ప్రధానంగా ద్విపార్టీ వ్యవస్థ."]},
{q:["The political party Dravida Munnetra Kazhagam belongs to this state","ద్రావిడ మున్నేట్ర కజగం రాజకీయ పార్టీ ఈ రాష్ట్రానికి చెందినది"],o:[["Kerala","కేరళ"],["Tamil Nadu","తమిళనాడు"],["Karnataka","కర్ణాటక"],["Maharashtra","మహారాష్ట్ర"]],a:1,
e:["The DMK was founded by C.N. Annadurai in Tamil Nadu in 1949.","డీఎంకేను సి.ఎన్. అన్నాదురై 1949లో తమిళనాడులో స్థాపించారు."]},
{q:["The founder of the Bahujan Samaj Party","బహుజన్ సమాజ్ పార్టీ స్థాపకుడు"],o:[["Dr. B.R. Ambedkar","డా. బి.ఆర్. అంబేద్కర్"],["Jyotiba Phule","జ్యోతిబా ఫూలే"],["Kanshi Ram","కాన్షీరామ్"],["Shahu Maharaj","షాహు మహారాజ్"]],a:2,
e:["Kanshi Ram founded the BSP in 1984 to represent Dalits and other marginalised groups. Mayawati later led it.","దళితులు, ఇతర అణగారిన వర్గాల ప్రాతినిధ్యం కోసం కాన్షీరామ్ 1984లో బీఎస్పీని స్థాపించారు. తర్వాత మాయావతి దీనిని నడిపించారు."]},
{q:["Trading of goods and services among different countries is known as","వివిధ దేశాల మధ్య జరిగే వస్తువులు, సేవల వ్యాపారాన్ని ఇలా అంటారు"],o:[["Regional markets","ప్రాంతీయ మార్కెట్లు"],["International markets","అంతర్జాతీయ మార్కెట్లు"],["National markets","జాతీయ మార్కెట్లు"],["Local markets","స్థానిక మార్కెట్లు"]],a:1,
e:["Trade between countries happens in international markets (imports and exports).","దేశాల మధ్య వ్యాపారం (దిగుమతులు, ఎగుమతులు) అంతర్జాతీయ మార్కెట్లలో జరుగుతుంది."]},
{q:["Under COPRA, a ____-tier quasi-judicial machinery was set up for redressal of consumer disputes","వినియోగదారుల వివాదాల పరిష్కారానికి COPRA కింద ____ అంచెల న్యాయ వ్యవస్థను ఏర్పాటు చేశారు"],o:[["Two","రెండు"],["Four","నాలుగు"],["Three","మూడు"],["Five","ఐదు"]],a:2,
e:["Consumer courts work at three levels: District Commission, State Commission and National Commission.","వినియోగదారుల కోర్టులు మూడు స్థాయిల్లో పనిచేస్తాయి: జిల్లా కమిషన్, రాష్ట్ర కమిషన్, జాతీయ కమిషన్."]},
{q:["This is not a road marking sign","రహదారి మార్కింగ్ సంకేతం కానిది"],o:[["Footpath","ఫుట్‌పాత్"],["Road divider","రహదారి డివైడర్"],["Zebra crossing","జీబ్రా క్రాసింగ్"],["First aid centre","ప్రథమ చికిత్స కేంద్రం"]],a:3,
e:["Road markings are lines painted on the road (zebra crossing, dividers, footpath edges). A first aid centre is shown by an informatory sign board, not a road marking.","రహదారి మార్కింగ్‌లు రోడ్డుపై వేసే గీతలు (జీబ్రా క్రాసింగ్, డివైడర్లు, ఫుట్‌పాత్ అంచులు). ప్రథమ చికిత్స కేంద్రాన్ని సమాచార సూచిక బోర్డు ద్వారా తెలుపుతారు, రోడ్డు మార్కింగ్ ద్వారా కాదు."]},
{q:["In this market, trade in goods and services takes place across the nation as a whole","దేశం మొత్తం మీద వివిధ రకాల వస్తువులు, సేవల వ్యాపారం జరిగే మార్కెట్"],o:[["Local market","స్థానిక మార్కెట్"],["International market","అంతర్జాతీయ మార్కెట్"],["Regional market","ప్రాంతీయ మార్కెట్"],["National market","జాతీయ మార్కెట్"]],a:3,
e:["When goods and services are traded across the whole country, it is a national market.","వస్తువులు, సేవల వ్యాపారం దేశమంతటా జరిగితే అది జాతీయ మార్కెట్."]},
{q:["In this year the Consumer Protection Act was approved","వినియోగదారుల రక్షణ చట్టాన్ని ఆమోదించిన సంవత్సరం"],o:[["2019","2019"],["2005","2005"],["2010","2010"],["2015","2015"]],a:0,
e:["The Consumer Protection Act, 2019 replaced the original 1986 Act (COPRA). It set up the Central Consumer Protection Authority and allows e-filing of complaints.","వినియోగదారుల రక్షణ చట్టం 2019 పాత 1986 చట్టం (COPRA) స్థానంలో వచ్చింది. ఇది కేంద్ర వినియోగదారుల రక్షణ అథారిటీని ఏర్పాటు చేసి, ఆన్‌లైన్ ఫిర్యాదులకు వీలు కల్పించింది."]},
{q:["The head office of the National Consumer Disputes Redressal Commission is located here","జాతీయ వినియోగదారుల వివాదాల పరిష్కార కమిషన్ ప్రధాన కార్యాలయం ఇక్కడ ఉంది"],o:[["Chennai","చెన్నై"],["Delhi","ఢిల్లీ"],["Hyderabad","హైదరాబాద్"],["Rajahmundry","రాజమండ్రి"]],a:1,
e:["The National Consumer Disputes Redressal Commission is in New Delhi.","జాతీయ వినియోగదారుల వివాదాల పరిష్కార కమిషన్ న్యూఢిల్లీలో ఉంది."]},
{q:["This is not an 'energy mineral'","శక్తి ఖనిజం కానిది"],o:[["Sulphur","సల్ఫర్"],["Coal","బొగ్గు"],["Petroleum","పెట్రోలియం"],["Natural gas","సహజ వాయువు"]],a:0,
e:["Coal, petroleum and natural gas are energy (fuel) minerals. Sulphur is a non-metallic mineral used in industry, not as fuel.","బొగ్గు, పెట్రోలియం, సహజ వాయువు శక్తి (ఇంధన) ఖనిజాలు. సల్ఫర్ పరిశ్రమల్లో వాడే అలోహ ఖనిజం, ఇంధనం కాదు."]},
{q:["This mineral is contained in monazite sand","మోనజైట్ ఇసుకలో లభించే ఖనిజం"],o:[["Oil","చమురు"],["Bauxite","బాక్సైట్"],["Thorium","థోరియం"],["Coal","బొగ్గు"]],a:2,
e:["Monazite sands of the Kerala coast are rich in thorium, used as atomic fuel.","కేరళ తీరంలోని మోనజైట్ ఇసుకలో అణు ఇంధనంగా ఉపయోగపడే థోరియం సమృద్ధిగా ఉంటుంది."]},
{q:["Koderma in Jharkhand is famous for this mineral","జార్ఖండ్‌లోని కోడెర్మా ఈ ఖనిజానికి ప్రసిద్ధి"],o:[["Bauxite","బాక్సైట్"],["Mica","మైకా (అభ్రకం)"],["Iron ore","ఇనుప ఖనిజం"],["Copper","రాగి"]],a:1,
e:["The Koderma–Gaya–Hazaribagh belt in Jharkhand is the leading mica-producing area. Mica is used in electrical and electronic industries.","జార్ఖండ్‌లోని కోడెర్మా–గయా–హజారీబాగ్ ప్రాంతం మైకా ఉత్పత్తిలో అగ్రగామి. మైకాను విద్యుత్, ఎలక్ట్రానిక్ పరిశ్రమల్లో వాడతారు."]},
{q:["This is the highest quality hard coal","ఇది అత్యంత నాణ్యమైన గట్టి బొగ్గు"],o:[["Lignite","లిగ్నైట్"],["Bituminous","బిట్యుమినస్"],["Anthracite","ఆంత్రసైట్"],["Magnetite","మాగ్నటైట్"]],a:2,
e:["Anthracite is the highest quality hard coal with the most carbon. Lignite is low-grade brown coal; magnetite is an iron ore, not coal.","ఆంత్రసైట్ అత్యధిక కార్బన్ ఉన్న అత్యుత్తమ గట్టి బొగ్గు. లిగ్నైట్ తక్కువ నాణ్యత గల గోధుమ బొగ్గు; మాగ్నటైట్ ఇనుప ఖనిజం, బొగ్గు కాదు."]},
{q:["This country is the leading producer of copper","రాగి ఉత్పత్తిలో అగ్రగామి దేశం"],o:[["Chile","చిలీ"],["India","భారతదేశం"],["America","అమెరికా"],["Italy","ఇటలీ"]],a:0,
e:["Chile is the world's largest producer of copper.","ప్రపంచంలో రాగిని అత్యధికంగా ఉత్పత్తి చేసే దేశం చిలీ."]},

e:["Working capital is used up in production — raw materials and money in hand. Fixed capital (tools, machines, buildings) is used for many years.","ఉత్పత్తిలో వినియోగమయ్యే ముడిసరుకులు, చేతిలోని డబ్బు నిర్వహణ మూలధనం. పనిముట్లు, యంత్రాలు, భవనాలు అనేక సంవత్సరాలు వాడే స్థిర మూలధనం."]},

e:["Lake Superior is the largest of the Great Lakes of North America and the largest freshwater lake by area in the world.","ఉత్తర అమెరికా మహా సరస్సులలో సుపీరియర్ పెద్దది. విస్తీర్ణంలో ఇది ప్రపంచంలో అతి పెద్ద మంచినీటి సరస్సు."]},
{q:["The correct pair of state and iron & steel factory","రాష్ట్రం – ఇనుము, ఉక్కు కర్మాగారానికి సంబంధించిన సరైన జత"],o:[["Karnataka – Rourkela","కర్ణాటక – రూర్కెలా"],["West Bengal – Durgapur","పశ్చిమ బెంగాల్ – దుర్గాపూర్"],["Tamil Nadu – Vijayanagar","తమిళనాడు – విజయనగర్"],["Andhra Pradesh – Bhadravati","ఆంధ్రప్రదేశ్ – భద్రావతి"]],a:1,

e:["The electronics industry makes TVs, telephones, computers and other devices. Bengaluru is called the electronic capital of India.","ఎలక్ట్రానిక్ పరిశ్రమ టీవీలు, టెలిఫోన్లు, కంప్యూటర్లు వంటివి తయారుచేస్తుంది. బెంగళూరును భారతదేశ ఎలక్ట్రానిక్ రాజధాని అంటారు."]},

{q:["The Tata Iron and Steel plant is located in","టాటా ఐరన్ అండ్ స్టీల్ ప్లాంట్ ఇక్కడ ఉంది"],o:[["Chennai","చెన్నై"],["Bhopal","భోపాల్"],["Delhi","ఢిల్లీ"],["Jamshedpur","జంషెడ్‌పూర్"]],a:3,

{q:["It is also known as the 'Manchester of India'","దీనిని 'మాంచెస్టర్ ఆఫ్ ఇండియా' అని కూడా అంటారు"],o:[["Chennai","చెన్నై"],["Ahmedabad","అహ్మదాబాద్"],["Bhopal","భోపాల్"],["Hyderabad","హైదరాబాద్"]],a:1,

e:["In disguised unemployment more people work on a farm than needed; removing some would not reduce output. It is common in agriculture.","ప్రచ్ఛన్న నిరుద్యోగంలో అవసరమైన దానికంటే ఎక్కువ మంది ఒకే పొలంలో పనిచేస్తారు; కొందరిని తొలగించినా ఉత్పత్తి తగ్గదు. ఇది వ్యవసాయంలో ఎక్కువగా ఉంటుంది."]},
{q:["\"Places with religious or cultural significance attract people.\" Based on this, identify the place which is different","\"మత సంబంధ లేదా సాంస్కృతిక ప్రాముఖ్యత గల ప్రదేశాలు ప్రజలను ఆకర్షిస్తాయి.\" దీని ఆధారంగా భిన్నమైన ప్రదేశాన్ని గుర్తించండి"],o:[["Varanasi","వారణాసి"],["Ruhr","రూర్"],["Jerusalem","జెరూసలేం"],["Vatican","వాటికన్"]],a:1,
e:["Varanasi, Jerusalem and Vatican City attract people for religious reasons. The Ruhr in Germany attracts people because it is an industrial (coal and steel) region.","వారణాసి, జెరూసలేం, వాటికన్ మతపరమైన కారణాలతో ప్రజలను ఆకర్షిస్తాయి. జర్మనీలోని రూర్ పారిశ్రామిక (బొగ్గు, ఉక్కు) ప్రాంతం కాబట్టి ప్రజలను ఆకర్షిస్తుంది."]},
{q:["This factor says that areas with better housing, education and health facilities are more densely populated","మెరుగైన గృహ, విద్య, ఆరోగ్య సౌకర్యాలు ఉన్న ప్రాంతాలలో జనసాంద్రత ఎక్కువగా ఉంటుందని తెలిపే కారకం"],o:[["Social factors","సామాజిక కారకాలు"],["Geographical factors","భౌగోళిక కారకాలు"],["Cultural factors","సాంస్కృతిక కారకాలు"],["Economic factors","ఆర్థిక కారకాలు"]],a:0,
e:["Housing, education and health facilities are social factors affecting where people live. Landforms and climate are geographical; jobs and industries are economic.","గృహ, విద్య, ఆరోగ్య సౌకర్యాలు ప్రజల నివాసాన్ని ప్రభావితం చేసే సామాజిక కారకాలు. భూస్వరూపం, శీతోష్ణస్థితి భౌగోళిక కారకాలు; ఉద్యోగాలు, పరిశ్రమలు ఆర్థిక కారకాలు."]},
{q:["From the following, these are among the most densely populated areas of the world","కింది వాటిలో ప్రపంచంలో అత్యధిక జనసాంద్రత గల ప్రాంతాలు"],o:[["Sahara desert regions","సహారా ఎడారి ప్రాంతాలు"],["The Gangetic plains","గంగా మైదానాలు"],["Amazon forests","అమెజాన్ అడవులు"],["Andes mountains","ఆండీస్ పర్వతాలు"]],a:1,
e:["The fertile, flat Gangetic plains with plenty of water support dense population. Deserts, dense forests and high mountains are thinly populated.","సారవంతమైన, చదునైన, నీరు సమృద్ధిగా ఉన్న గంగా మైదానాలలో జనసాంద్రత అధికం. ఎడారులు, దట్టమైన అడవులు, ఎత్తైన పర్వతాలలో జనాభా తక్కువ."]},
{q:["It is a human made resource","ఇది మానవ నిర్మిత వనరు"],o:[["Technology","సాంకేతికత"],["Air","గాలి"],["Minerals","ఖనిజాలు"],["Soils","నేలలు"]],a:0,

{q:["The first International Earth Summit was held in","మొదటి అంతర్జాతీయ ధరిత్రీ శిఖరాగ్ర సమావేశం ఇక్కడ జరిగింది"],o:[["Osaka","ఒసాకా"],["Delhi","ఢిల్లీ"],["London","లండన్"],["Rio de Janeiro","రియో డి జనీరో"]],a:3,
e:["The Earth Summit was held at Rio de Janeiro, Brazil, in June 1992.","ధరిత్రీ సదస్సు 1992 జూన్‌లో బ్రెజిల్‌లోని రియో డి జనీరోలో జరిగింది."]},
{q:["As per 2019, India's HDI rank","2019 ప్రకారం భారతదేశ మానవ అభివృద్ధి సూచిక ర్యాంకు"],o:[["73","73"],["148","148"],["130","130"],["150","150"]],a:2,
e:["As per the textbook and answer key, India's HDI rank is 130. (Different editions of the UNDP report give 129–131, so follow the textbook figure for the exam.)","పాఠ్యపుస్తకం, జవాబు కీ ప్రకారం భారత్ HDI ర్యాంకు 130. (UNDP నివేదిక వేర్వేరు సంచికల్లో 129–131 ఉంది; పరీక్ష కోసం పాఠ్యపుస్తకంలోని సంఖ్యను గుర్తుంచుకోండి.)"]},
{q:["Expand B.M.I.","BMI ని విస్తరించండి"],o:[["Body Mass Index","బాడీ మాస్ ఇండెక్స్"],["Blood Measurement Index","బ్లడ్ మెజర్‌మెంట్ ఇండెక్స్"],["Blood Movement Indicator","బ్లడ్ మూవ్‌మెంట్ ఇండికేటర్"],["Body Movement Intensity","బాడీ మూవ్‌మెంట్ ఇంటెన్సిటీ"]],a:0,
e:["BMI = Body Mass Index = weight (kg) ÷ height² (m²). It is used to judge whether a person is undernourished.","BMI = బాడీ మాస్ ఇండెక్స్ = బరువు (కి.గ్రా.) ÷ ఎత్తు² (మీ²). వ్యక్తి పోషకాహార లోపంతో ఉన్నాడో లేదో తెలుసుకోవడానికి దీనిని వాడతారు."]},
{q:["Which of the following neighbouring countries has better performance than India in human development (as per 2019)?","కింది పొరుగు దేశాలలో మానవాభివృద్ధిలో భారతదేశం కంటే మెరుగైన స్థాయిలో ఉన్న దేశం (2019 ప్రకారం)"],o:[["Bangladesh","బంగ్లాదేశ్"],["Sri Lanka","శ్రీలంక"],["Nepal","నేపాల్"],["Pakistan","పాకిస్తాన్"]],a:1,
e:["Sri Lanka ranks far above India in HDI (around 71st) because of better health and education. Bangladesh, Nepal and Pakistan rank below India.","మెరుగైన ఆరోగ్యం, విద్య వల్ల శ్రీలంక HDIలో భారత్ కంటే చాలా ముందుంది (సుమారు 71వ స్థానం). బంగ్లాదేశ్, నేపాల్, పాకిస్తాన్ భారత్ కంటే వెనుక ఉన్నాయి."]},
{q:["The state with the lowest infant mortality rate in India","భారతదేశంలో శిశు మరణాల రేటు తక్కువగా గల రాష్ట్రం"],o:[["Bihar","బీహార్"],["Sikkim","సిక్కిం"],["Kerala","కేరళ"],["Karnataka","కర్ణాటక"]],a:2,
e:["Kerala has the lowest infant mortality rate due to good health care, education and nutrition.","మంచి ఆరోగ్య సేవలు, విద్య, పోషణ వల్ల కేరళలో శిశు మరణాల రేటు అతి తక్కువ."]}
];
const BASE=200;

const UI={
 en:{q:"Question",of:"of",score:"Score",prev:"◀ Previous",next:"Next ▶",finish:"See result",right:"Correct!",wrong:"Wrong. Correct answer:",map:"Question map",lr:"Correct",lw:"Wrong",lu:"Not answered",done:"Quiz complete",again:"Start again",att:"Answered"},
 te:{q:"ప్రశ్న",of:"/",score:"స్కోరు",prev:"◀ వెనుకకు",next:"తర్వాత ▶",finish:"ఫలితం చూడండి",right:"సరైన సమాధానం!",wrong:"తప్పు. సరైన సమాధానం:",map:"ప్రశ్నల పటం",lr:"సరైనవి",lw:"తప్పులు",lu:"జవాబు ఇవ్వనివి",done:"క్విజ్ పూర్తయింది",again:"మళ్ళీ ప్రారంభించండి",att:"జవాబిచ్చినవి"}
};
let lang="both",cur=0,ans=Array(Q.length).fill(null),showResult=false;
try{const s=JSON.parse(localStorage.getItem("tet2a-soc5")||"null");if(s){lang=s.lang||lang;cur=s.cur||0;if(Array.isArray(s.ans)&&s.ans.length===Q.length)ans=s.ans;}}catch(e){}
const save=()=>{try{localStorage.setItem("tet2a-soc5",JSON.stringify({lang,cur,ans}))}catch(e){}};
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function bi(p){ // p=[en,te]
  if(lang==="en")return `<span class="en">${esc(p[0])}</span>`;
  if(lang==="te")return `<span class="te">${esc(p[1])}</span>`;
  return p[0]===p[1]?`<span class="en">${esc(p[0])}</span>`:`<span class="en">${esc(p[0])}</span><span class="te">${esc(p[1])}</span>`;
}
function lbl(k){ if(lang==="en")return UI.en[k]; if(lang==="te")return UI.te[k]; return UI.te[k]+" / "+UI.en[k]; }
const K=["A","B","C","D"];
function render(){
  document.querySelectorAll(".langs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===lang));
  const done=ans.filter(x=>x!==null).length, right=ans.filter((x,i)=>x===Q[i].a).length;
  document.getElementById("s-pos").innerHTML=`${lbl("att")}: <b>${done}/${Q.length}</b>`;
  document.getElementById("s-score").innerHTML=`${lbl("score")}: <b>${right}</b>`;
  document.getElementById("s-bar").style.width=(done/Q.length*100)+"%";
  const card=document.getElementById("card");
  if(showResult){
    const wrong=done-right;
    card.className="card result";
    card.innerHTML=`<div class="qno">${lbl("done")}</div><div class="big">${right} / ${Q.length}</div>
      <div>${lbl("lr")}: <b>${right}</b> · ${lbl("lw")}: <b>${wrong}</b> · ${lbl("lu")}: <b>${Q.length-done}</b></div>
      <div class="nav" style="justify-content:center"><button id="again">${lbl("again")}</button></div>`;
    document.getElementById("again").onclick=()=>{ans=Array(Q.length).fill(null);cur=0;showResult=false;save();render();};
  } else {
    card.className="card";
    const q=Q[cur],picked=ans[cur];
    let h=`<div class="qno">${lbl("q")} ${BASE+cur+1} / ${BASE+Q.length}</div><div class="qtext">${bi(q.q)}</div>`;
    if(q.m){
      const mh=q.mh||[["Colour","రంగు"],["Feature","స్వరూపం"]];const hd=k=>lang==="en"?mh[k][0]:lang==="te"?mh[k][1]:mh[k][0]+" / "+mh[k][1];
      const cell=p=>lang==="en"?esc(p[0]):lang==="te"?`<span style="font-family:var(--f-te)">${esc(p[1])}</span>`:`${esc(p[0])}<small>${esc(p[1])}</small>`;
      h+=`<div class="mtab"><table><thead><tr><th>${hd(0)}</th><th>${hd(1)}</th></tr></thead><tbody>`+
         q.m.map(r=>`<tr><td>${cell(r[0])}</td><td>${cell(r[1])}</td></tr>`).join("")+`</tbody></table></div>`;
    }
    h+=`<div class="opts">`+q.o.map((o,i)=>{
      let c="";if(picked!==null){if(i===q.a)c="right";else if(i===picked)c="wrong";}
      return `<button class="opt ${c}" id="opt${i}" data-i="${i}" ${picked!==null?"disabled":""}><span class="k">${K[i]}</span><span class="t">${bi(o)}</span></button>`;
    }).join("")+`</div>`;
    if(picked!==null){
      const ok=picked===q.a;
      const v=ok?`<span class="verdict ok">✔ ${lbl("right")}</span>`:`<span class="verdict no">✘ ${lbl("wrong")} ${K[q.a]}</span>`;
      h+=`<div class="exp">${v}${bi(q.e)}</div>`;
    }
    const last=cur===Q.length-1;
    h+=`<div class="nav"><button class="ghost" id="prev" ${cur===0?"disabled":""}>${lbl("prev")}</button><button id="next">${last?lbl("finish"):lbl("next")}</button></div>`;
    card.innerHTML=h;
    card.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ans[cur]=+b.dataset.i;save();render();});
    document.getElementById("prev").onclick=()=>{cur--;save();render();};
    document.getElementById("next").onclick=()=>{if(last){showResult=true;}else cur++;save();render();window.scrollTo({top:0,behavior:"smooth"});};
  }
  document.getElementById("map-h").textContent=lbl("map");
  document.getElementById("legend").innerHTML=`<span style="--c:var(--ok)">${lbl("lr")}</span><span style="--c:var(--bad)">${lbl("lw")}</span><span style="--c:var(--line)">${lbl("lu")}</span>`;
  const g=document.getElementById("grid");
  g.innerHTML=Q.map((q,i)=>{let c=ans[i]===null?"":ans[i]===q.a?"r":"w";if(i===cur&&!showResult)c+=" cur";return `<button class="${c}" data-i="${i}" aria-label="Q ${BASE+i+1}">${BASE+i+1}</button>`}).join("");
  g.querySelectorAll("button").forEach(b=>b.onclick=()=>{cur=+b.dataset.i;showResult=false;save();render();document.getElementById("card").scrollIntoView({behavior:"smooth",block:"start"});});
}
document.querySelectorAll(".langs button").forEach(b=>b.onclick=()=>{lang=b.dataset.l;save();render();});
render();
</script>
