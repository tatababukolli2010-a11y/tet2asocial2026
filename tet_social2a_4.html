<!doctype html>
<html lang="te">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TET 2A Social Quiz 4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&family=Noto+Sans:wght@400;600&family=Noto+Sans+Telugu:wght@400;600;700&family=Ramabhadra&display=swap">
<style>
/* Layout: a single atlas-sheet column — teacher header, quiz card, question map grid, credit footer */
:root{
  --paper:#f4f6f1; --sheet:#ffffff; --ink:#1d3442; --muted:#5b6d72; --line:#d7dfd8;
  --accent:#b8742a; --accent-soft:#f6ead9; --sea:#2c6e7f; --sea-soft:#e2eff1;
  --ok:#2f7d4a; --ok-soft:#e3f2e7; --bad:#b23b33; --bad-soft:#f8e3e1;
  --c1:#f26b00; --c2:#00897b; --c3:#7b3fe4; --c4:#e0245e; --on-hero:#ffffff;
  --hero:linear-gradient(120deg,#ff8a1f 0%,#e8405f 50%,#8a3ee0 100%);
  --f-display:"Bitter","Ramabhadra",Georgia,serif;
  --f-te:"Noto Sans Telugu","Noto Sans",system-ui,sans-serif;
  --f-body:"Noto Sans","Noto Sans Telugu",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#111a1f; --sheet:#18242b; --ink:#e5ece8; --muted:#9db0b2; --line:#2c3b42;
  --accent:#e0a35a; --accent-soft:#3a2c1b; --sea:#7fc0cf; --sea-soft:#1c3239;
  --ok:#6fcf8e; --ok-soft:#173326; --bad:#f08b80; --bad-soft:#3b1e1c; --c1:#ffa04d; --c2:#4fd3c3; --c3:#b590ff; --c4:#ff6f9a; --hero:linear-gradient(120deg,#c25a0c 0%,#a82a4a 50%,#5b2aa3 100%); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111a1f; --sheet:#18242b; --ink:#e5ece8; --muted:#9db0b2; --line:#2c3b42;
  --accent:#e0a35a; --accent-soft:#3a2c1b; --sea:#7fc0cf; --sea-soft:#1c3239;
  --ok:#6fcf8e; --ok-soft:#173326; --bad:#f08b80; --bad-soft:#3b1e1c; --c1:#ffa04d; --c2:#4fd3c3; --c3:#b590ff; --c4:#ff6f9a; --hero:linear-gradient(120deg,#c25a0c 0%,#a82a4a 50%,#5b2aa3 100%); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:18px 28px;display:flex;flex-direction:column;gap:16px}
header.top{display:flex;align-items:center;gap:16px;background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
header.top img{width:84px;height:88px;object-fit:cover;border-radius:12px;border:3px solid var(--accent);flex:none}
.ht{min-width:0;display:flex;flex-direction:column;gap:2px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}
h1{font-family:var(--f-display);font-size:clamp(20px,4.6vw,26px);line-height:1.2;margin:0;text-wrap:balance}
.sub{font-family:var(--f-te);color:var(--muted);font-size:14px}
.langs{display:flex;flex-wrap:wrap;gap:8px}
.langs button{font:600 14px var(--f-te);padding:8px 14px;border-radius:999px;border:1.5px solid var(--sea);background:transparent;color:var(--sea);cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--sea);color:var(--sheet)}
.status{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.status b{color:var(--ink)}
.bar{flex:1 1 160px;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:18px 16px;display:flex;flex-direction:column;gap:14px}
.qno{font-family:var(--f-display);color:var(--accent);font-size:15px}
.qtext{display:flex;flex-direction:column;gap:4px;white-space:pre-line}
.qtext .en{font-size:17px;font-weight:600}
.qtext .te{font-family:var(--f-te);font-size:17px;font-weight:600}
.qtext .en+.te{font-weight:400;color:var(--muted);font-size:16px}
.mtab{overflow-x:auto}
.mtab table{border-collapse:collapse;width:100%;font-size:15px}
.mtab th,.mtab td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.mtab th{background:var(--sea-soft);color:var(--sea);font-weight:600}
.mtab small{display:block;font-family:var(--f-te);color:var(--muted)}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--sheet);color:var(--ink);font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--sea);background:var(--sea-soft)}
.opt:focus-visible,.langs button:focus-visible,.nav button:focus-visible,.grid button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--sea-soft);color:var(--sea);font-weight:700;font-size:14px}
.opt .t{min-width:0;display:flex;flex-direction:column}
.opt .t .te{font-family:var(--f-te)}
.opt .t .en+.te{color:var(--muted);font-size:15px}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);color:var(--sheet)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:var(--sheet)}
.exp{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.exp .verdict{font-weight:700}
.exp .verdict.ok{color:var(--ok)} .exp .verdict.no{color:var(--bad)}
.exp .te{font-family:var(--f-te)}
.nav{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.nav button{font:600 15px var(--f-te);padding:10px 18px;border-radius:10px;border:none;background:var(--ink);color:var(--sheet);cursor:pointer}
.nav button.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.nav button:disabled{opacity:.4;cursor:default}
.mapcard{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.mapcard h2{font-family:var(--f-display);font-size:16px;margin:0}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.grid button{aspect-ratio:1;max-width:100%;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:600 13px var(--f-body);cursor:pointer;font-variant-numeric:tabular-nums;padding:0}
.grid button.r{background:var(--ok);color:var(--sheet);border-color:var(--ok)}
.grid button.w{background:var(--bad);color:var(--sheet);border-color:var(--bad)}
.grid button.cur{outline:2px solid var(--accent);outline-offset:1px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.result{text-align:center;align-items:center}
.result .big{font-family:var(--f-display);font-size:44px;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1}

/* ---- colourful layer ---- */
body{background:
  radial-gradient(600px 400px at 0% 0%,color-mix(in srgb,var(--c1) 16%,transparent),transparent 70%),
  radial-gradient(600px 420px at 100% 30%,color-mix(in srgb,var(--c3) 14%,transparent),transparent 70%),
  radial-gradient(700px 500px at 20% 100%,color-mix(in srgb,var(--c2) 14%,transparent),transparent 70%),
  var(--paper);background-attachment:fixed}
header.top{background:var(--hero);border:none;color:var(--on-hero);box-shadow:0 10px 26px -12px color-mix(in srgb,var(--c4) 60%,transparent)}
header.top img{border:3px solid var(--on-hero);box-shadow:0 0 0 4px color-mix(in srgb,var(--on-hero) 35%,transparent)}
header.top .eyebrow{color:var(--on-hero);opacity:.9}
header.top .sub{color:var(--on-hero);opacity:.92}
.langs button:nth-child(1){--lc:var(--c1)} .langs button:nth-child(2){--lc:var(--c4)} .langs button:nth-child(3){--lc:var(--c2)}
.langs button{border-color:var(--lc);color:var(--lc);background:color-mix(in srgb,var(--lc) 8%,var(--sheet))}
.langs button[aria-pressed="true"]{background:var(--lc);color:var(--sheet)}
.bar{height:10px}
.bar i{background:linear-gradient(90deg,var(--c1),var(--c4),var(--c3))}
.status b{color:var(--c3)}
.card{border:none;border-top:6px solid transparent;background:linear-gradient(var(--sheet),var(--sheet)) padding-box,linear-gradient(90deg,var(--c1),var(--c4),var(--c3),var(--c2)) border-box;box-shadow:0 8px 24px -14px color-mix(in srgb,var(--c3) 50%,transparent)}
.qno{display:inline-block;align-self:flex-start;background:color-mix(in srgb,var(--c1) 14%,var(--sheet));color:var(--c1);padding:3px 12px;border-radius:999px}
.opts .opt:nth-child(1){--oc:var(--c1)} .opts .opt:nth-child(2){--oc:var(--c2)} .opts .opt:nth-child(3){--oc:var(--c3)} .opts .opt:nth-child(4){--oc:var(--c4)}
.opt{border-color:color-mix(in srgb,var(--oc) 35%,var(--line));background:color-mix(in srgb,var(--oc) 5%,var(--sheet))}
.opt .k{background:var(--oc);color:var(--sheet)}
.opt:hover:not(:disabled){border-color:var(--oc);background:color-mix(in srgb,var(--oc) 13%,var(--sheet))}
.opt.right{border-color:var(--ok);background:var(--ok-soft)} .opt.right .k{background:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)} .opt.wrong .k{background:var(--bad)}
.exp{border-left-color:var(--c3);background:color-mix(in srgb,var(--c3) 10%,var(--sheet))}
.mtab th{background:color-mix(in srgb,var(--c2) 16%,var(--sheet));color:var(--c2)}
.nav button{background:linear-gradient(120deg,var(--c4),var(--c3));color:var(--on-hero)}
.nav button.ghost{background:color-mix(in srgb,var(--c2) 8%,var(--sheet));color:var(--c2);border-color:var(--c2)}
.mapcard{border:none;box-shadow:0 8px 24px -16px color-mix(in srgb,var(--c2) 60%,transparent)}
.mapcard h2{color:var(--c2)}
.grid button:nth-child(4n+1){--gc:var(--c1)} .grid button:nth-child(4n+2){--gc:var(--c2)} .grid button:nth-child(4n+3){--gc:var(--c3)} .grid button:nth-child(4n){--gc:var(--c4)}
.grid button{border-color:color-mix(in srgb,var(--gc) 45%,var(--line));background:color-mix(in srgb,var(--gc) 9%,var(--sheet));color:var(--gc)}
.grid button.r{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.grid button.w{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.grid button.cur{outline:3px solid var(--c4)}
.result .big{background:linear-gradient(90deg,var(--c1),var(--c4),var(--c3));-webkit-background-clip:text;background-clip:text;color:transparent}
footer{border-top:none;background:var(--hero);color:var(--on-hero);border-radius:14px;padding:14px 16px}
footer b{color:var(--on-hero)}
footer{text-align:center;font-family:var(--f-te);font-size:15px;color:var(--muted);border-top:1px dashed var(--line);padding-top:14px}
footer b{color:var(--ink)}
footer{color:var(--on-hero);border-top:none;background:var(--hero);border-radius:14px;padding:14px 16px} footer b{color:var(--on-hero)}
@media (max-width:480px){.grid{grid-template-columns:repeat(8,1fr)} header.top img{width:70px;height:74px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---- larger text ---- */
body{font-size:18px;line-height:1.6}
.wrap{max-width:820px;gap:18px}
.eyebrow{font-size:13.5px}
h1{font-size:clamp(23px,5.4vw,30px)}
.sub{font-size:16.5px}
header.top img{width:96px;height:100px}
.langs button{font-size:16.5px;padding:10px 18px}
.status{font-size:16.5px}
.qno{font-size:17px}
.qtext .en,.qtext .te{font-size:21px;line-height:1.55}
.qtext .en+.te{font-size:20px}
.opt{padding:14px 16px;gap:14px;font-size:19px}
.opt .k{width:36px;height:36px;font-size:17px}
.opt .t .en+.te{font-size:18px}
.mtab table{font-size:18px}
.exp{font-size:18.5px;padding:14px 16px}
.nav button{font-size:17.5px;padding:12px 22px}
.mapcard h2{font-size:19px}
.grid button{font-size:15.5px}
.legend{font-size:15px}
footer{font-size:18px!important}
footer span{font-size:15px!important}
.result .big{font-size:56px}
@media (max-width:480px){.qtext .en,.qtext .te{font-size:20px}.opt{font-size:18px}.grid{grid-template-columns:repeat(7,1fr)}header.top img{width:80px;height:84px}}
</style>

<script>
const Q=[
{q:["This female cricketer was known as 'Lady Sachin'","'లేడీ సచిన్'గా పేరు పొందిన మహిళా క్రికెటర్"],o:[["Mithali Raj","మిథాలీ రాజ్"],["Shree Charani","శ్రీ చరణి"],["Shafali Verma","షఫాలీ వర్మ"],["Anurag Bhargavi","అనురాగ్ భార్గవి"]],a:0,
e:["Mithali Raj, former captain of the Indian women's cricket team, is called 'Lady Sachin'. She is the highest run-scorer in women's international cricket.","భారత మహిళా క్రికెట్ జట్టు మాజీ కెప్టెన్ మిథాలీ రాజ్‌ను 'లేడీ సచిన్' అంటారు. మహిళల అంతర్జాతీయ క్రికెట్‌లో అత్యధిక పరుగులు చేసింది ఆమే."]},
{q:["She is the first visually challenged woman IAS officer of India","భారతదేశపు మొదటి దృష్టిలోపం గల మహిళా ఐఏఎస్ అధికారిణి"],o:[["Seema Rao","సీమా రావు"],["Lakshmi Agarwal","లక్ష్మీ అగర్వాల్"],["Pranjal Patil","ప్రాంజల్ పాటిల్"],["Vandana Shiva","వందనా శివ"]],a:2,
e:["Pranjal Patil of Maharashtra became the first visually challenged woman IAS officer, taking charge as Sub-Collector in Thiruvananthapuram in 2019.","మహారాష్ట్రకు చెందిన ప్రాంజల్ పాటిల్ మొదటి దృష్టిలోపం గల మహిళా ఐఏఎస్ అధికారిణి. 2019లో తిరువనంతపురం సబ్ కలెక్టర్‌గా బాధ్యతలు చేపట్టారు."]},
{q:["The 'Beti Bachao Beti Padhao' campaign was launched in this year","'బేటీ బచావో బేటీ పఢావో' కార్యక్రమం ప్రారంభమైన సంవత్సరం"],o:[["2000","2000"],["2005","2005"],["2010","2010"],["2015","2015"]],a:3,
e:["Beti Bachao Beti Padhao was launched on 22 January 2015 at Panipat to improve the child sex ratio and girls' education.","బాలికల లింగ నిష్పత్తి, విద్య మెరుగుదల కోసం 2015 జనవరి 22న పానిపట్‌లో బేటీ బచావో బేటీ పఢావో ప్రారంభించారు."]},
{q:["The state that banned arrack as a result of the women's movement in 1993","1993లో మహిళల ఉద్యమ ఫలితంగా సారాను నిషేధించిన రాష్ట్రం"],o:[["Tamil Nadu","తమిళనాడు"],["Andhra Pradesh","ఆంధ్రప్రదేశ్"],["Gujarat","గుజరాత్"],["Kerala","కేరళ"]],a:1,
e:["The anti-arrack movement started by rural women in Dubagunta village, Nellore district, spread across Andhra Pradesh and led to a ban on arrack in 1993.","నెల్లూరు జిల్లా దూబగుంట గ్రామ మహిళలు ప్రారంభించిన సారా వ్యతిరేక ఉద్యమం ఆంధ్రప్రదేశ్ అంతటా వ్యాపించి 1993లో సారా నిషేధానికి దారితీసింది."]},
{q:["International Women's Day","అంతర్జాతీయ మహిళా దినోత్సవం"],o:[["June 8","జూన్ 8"],["May 8","మే 8"],["April 8","ఏప్రిల్ 8"],["March 8","మార్చి 8"]],a:3,
e:["International Women's Day is celebrated every year on 8 March.","అంతర్జాతీయ మహిళా దినోత్సవాన్ని ప్రతి సంవత్సరం మార్చి 8న జరుపుకుంటారు."]},
{q:["ISRO is located in this city","ఇస్రో (ISRO) ఈ నగరంలో ఉంది"],o:[["Delhi","ఢిల్లీ"],["Calcutta","కలకత్తా"],["Bangalore","బెంగళూరు"],["Mumbai","ముంబై"]],a:2,
e:["ISRO (founded 1969) has its headquarters in Bengaluru. Its main launch centre is at Sriharikota in Andhra Pradesh.","ఇస్రో (1969) ప్రధాన కార్యాలయం బెంగళూరులో ఉంది. దీని ప్రధాన ప్రయోగ కేంద్రం ఆంధ్రప్రదేశ్‌లోని శ్రీహరికోటలో ఉంది."]},
{q:["The Indian who spoke at the World Parliament of Religions in Chicago in 1893","1893లో చికాగోలో జరిగిన విశ్వ మత మహాసభలో ప్రసంగించిన భారతీయుడు"],o:[["Keshab Chandra Sen","కేశవ చంద్రసేన్"],["Ramakrishna Paramahamsa","రామకృష్ణ పరమహంస"],["Raja Ram Mohan Roy","రాజా రామ్మోహన్ రాయ్"],["Swami Vivekananda","స్వామి వివేకానంద"]],a:3,
e:["Swami Vivekananda spoke at the Chicago Parliament of Religions on 11 September 1893, beginning with 'Sisters and Brothers of America'.","స్వామి వివేకానంద 1893 సెప్టెంబర్ 11న చికాగో సర్వమత సభలో 'అమెరికా సోదరసోదరీమణులారా' అంటూ ప్రసంగించారు."]},
{q:["His birthday is celebrated as 'National Youth Day'","ఈయన జన్మదినాన్ని 'జాతీయ యువజన దినోత్సవం'గా జరుపుకుంటారు"],o:[["Dr. B.R. Ambedkar","డా. బి.ఆర్. అంబేద్కర్"],["Swami Vivekananda","స్వామి వివేకానంద"],["Jawaharlal Nehru","జవహర్‌లాల్ నెహ్రూ"],["Subhash Chandra Bose","సుభాష్ చంద్రబోస్"]],a:1,
e:["Swami Vivekananda's birthday, 12 January, is National Youth Day. Nehru's birthday (14 November) is Children's Day.","స్వామి వివేకానంద జన్మదినం జనవరి 12 జాతీయ యువజన దినోత్సవం. నెహ్రూ జన్మదినం (నవంబర్ 14) బాలల దినోత్సవం."]},
{q:["He was the founder of the Brahmo Sabha","బ్రహ్మ సభ స్థాపకుడు"],o:[["Raja Ram Mohan Roy","రాజా రామ్మోహన్ రాయ్"],["Swami Dayananda Saraswati","స్వామి దయానంద సరస్వతి"],["Ishwar Chandra Vidyasagar","ఈశ్వర చంద్ర విద్యాసాగర్"],["Atmaram Pandurang","ఆత్మారాం పాండురంగ్"]],a:0,
e:["Raja Ram Mohan Roy founded the Brahmo Sabha in 1828 (later Brahmo Samaj). He fought against Sati. Atmaram Pandurang founded the Prarthana Samaj.","రాజా రామ్మోహన్ రాయ్ 1828లో బ్రహ్మ సభను (తర్వాత బ్రహ్మ సమాజం) స్థాపించారు. సతీ సహగమనాన్ని వ్యతిరేకించారు. ఆత్మారాం పాండురంగ్ ప్రార్థనా సమాజం స్థాపించారు."]},
{q:["The book written by Jyotirao Phule","జ్యోతిరావు ఫూలే రచించిన పుస్తకం"],o:[["Gulamgiri","గులాంగిరి"],["Democracy","డెమోక్రసీ"],["Untouchability","అన్‌టచబిలిటీ"],["Young India","యంగ్ ఇండియా"]],a:0,
e:["Jyotirao Phule wrote 'Gulamgiri' (Slavery) in 1873 against caste discrimination. 'Young India' was Gandhiji's weekly.","జ్యోతిరావు ఫూలే కుల వివక్షకు వ్యతిరేకంగా 1873లో 'గులాంగిరి' (బానిసత్వం) రాశారు. 'యంగ్ ఇండియా' గాంధీజీ వార పత్రిక."]},
{q:["He founded the Arya Samaj in 1875","1875లో ఆర్య సమాజాన్ని స్థాపించినవారు"],o:[["Ishwar Chandra Vidyasagar","ఈశ్వర చంద్ర విద్యాసాగర్"],["Dayananda Saraswati","దయానంద సరస్వతి"],["Raja Ram Mohan Roy","రాజా రామ్మోహన్ రాయ్"],["Keshab Chandra Sen","కేశవ చంద్రసేన్"]],a:1,
e:["Swami Dayananda Saraswati founded the Arya Samaj in Bombay in 1875. He wrote 'Satyartha Prakash'.","స్వామి దయానంద సరస్వతి 1875లో బొంబాయిలో ఆర్య సమాజాన్ని స్థాపించారు. 'సత్యార్థ ప్రకాష్' రచించారు."]},
{q:["The author of 'Stripurushatulana' was","'స్త్రీపురుషతులన' పుస్తక రచయిత"],o:[["Tarabai Shinde","తారాబాయి షిండే"],["Pandita Ramabai","పండిత రమాబాయి"],["Savitribai Phule","సావిత్రిబాయి ఫూలే"],["Begum Rokeya Sakhawat","బేగం రోకెయా సఖావత్"]],a:0,
e:["Tarabai Shinde wrote 'Stripurushatulana' (A Comparison between Women and Men) in 1882, criticising the unequal treatment of women.","తారాబాయి షిండే 1882లో 'స్త్రీపురుషతులన' రాశారు. స్త్రీల పట్ల అసమాన వ్యవహారాన్ని ఇందులో విమర్శించారు."]},
{q:["A 13-year-old child is working in a carpet factory. Which Fundamental Right is being violated?","13 ఏళ్ళ బాలుడు తివాచీల కర్మాగారంలో పనిచేస్తున్నాడు. ఇక్కడ ఏ ప్రాథమిక హక్కు ఉల్లంఘించబడుతోంది?"],o:[["Right to Equality","సమానత్వపు హక్కు"],["Right to Freedom","స్వాతంత్ర్యపు హక్కు"],["Right against Exploitation","పీడనాన్ని నిరోధించే హక్కు"],["Right to Constitutional Remedies","రాజ్యాంగ పరిహారపు హక్కు"]],a:2,
e:["Article 24, under the Right against Exploitation, bans employing children below 14 in factories, mines and hazardous work.","పీడనాన్ని నిరోధించే హక్కులోని ఆర్టికల్ 24 ప్రకారం 14 ఏళ్ళ లోపు పిల్లలను కర్మాగారాలు, గనులు, ప్రమాదకర పనుల్లో నియమించడం నిషేధం."]},
{q:["The first President of independent India","స్వతంత్ర భారతదేశపు మొట్టమొదటి రాష్ట్రపతి"],o:[["Dr. B.R. Ambedkar","డా. బి.ఆర్. అంబేద్కర్"],["Dr. Babu Rajendra Prasad","డా. బాబు రాజేంద్ర ప్రసాద్"],["Jawaharlal Nehru","జవహర్‌లాల్ నెహ్రూ"],["Sardar Vallabhbhai Patel","సర్దార్ వల్లభ్‌భాయ్ పటేల్"]],a:1,
e:["Dr Rajendra Prasad was the first President (1950–1962). He was also President of the Constituent Assembly.","డా. రాజేంద్ర ప్రసాద్ మొదటి రాష్ట్రపతి (1950–1962). ఆయన రాజ్యాంగ పరిషత్ అధ్యక్షుడు కూడా."]},
{q:["He was not a member of the Cabinet Mission","కేబినెట్ మిషన్‌లో సభ్యుడు కానివారు"],o:[["Lord Pethick-Lawrence","లార్డ్ పెథిక్ లారెన్స్"],["Sir Stafford Cripps","సర్ స్టాఫర్డ్ క్రిప్స్"],["A.V. Alexander","ఏ.వి. అలెగ్జాండర్"],["A.O. Hume","ఏ.ఓ. హ్యూమ్"]],a:3,
e:["The Cabinet Mission (1946) had Pethick-Lawrence, Stafford Cripps and A.V. Alexander. A.O. Hume founded the Indian National Congress in 1885.","కేబినెట్ మిషన్ (1946)లో పెథిక్ లారెన్స్, స్టాఫర్డ్ క్రిప్స్, ఏ.వి. అలెగ్జాండర్ ఉన్నారు. ఏ.ఓ. హ్యూమ్ 1885లో భారత జాతీయ కాంగ్రెస్ స్థాపించారు."]},
{q:["The words 'Socialist' and 'Secular' were added to the Preamble through this constitutional amendment","ఈ రాజ్యాంగ సవరణ ద్వారా ప్రవేశికలో 'సామ్యవాద', 'లౌకిక' పదాలు చేర్చబడ్డాయి"],o:[["46th","46వ"],["44th","44వ"],["42nd","42వ"],["43rd","43వ"]],a:2,
e:["The 42nd Amendment (1976) added 'Socialist', 'Secular' and 'Integrity' to the Preamble. It is called the 'mini-Constitution'.","42వ సవరణ (1976) ప్రవేశికలో 'సామ్యవాద', 'లౌకిక', 'సమగ్రత' పదాలను చేర్చింది. దీనిని 'చిన్న రాజ్యాంగం' అంటారు."]},
{q:["He is the Father of the Indian Constitution","భారత రాజ్యాంగ పిత"],o:[["Dr. B.R. Ambedkar","డా. బి.ఆర్. అంబేద్కర్"],["Dr. Babu Rajendra Prasad","డా. బాబు రాజేంద్ర ప్రసాద్"],["Jawaharlal Nehru","జవహర్‌లాల్ నెహ్రూ"],["Mahatma Gandhi","మహాత్మా గాంధీ"]],a:0,
e:["Dr B.R. Ambedkar was Chairman of the Drafting Committee and is called the Father of the Indian Constitution.","డా. బి.ఆర్. అంబేద్కర్ ముసాయిదా కమిటీ అధ్యక్షుడు. ఆయనను భారత రాజ్యాంగ పిత అంటారు."]},
{q:["This refers to the existence of more than one level of government in the country","దేశంలో ఒకటి కంటే ఎక్కువ స్థాయిల ప్రభుత్వాలు ఉండటాన్ని ఇది సూచిస్తుంది"],o:[["Parliamentary form of government","పార్లమెంటరీ తరహా ప్రభుత్వం"],["Secularism","లౌకికవాదం"],["Federation","సమాఖ్యవాదం"],["Republic","గణతంత్రం"]],a:2,
e:["In a federation, power is shared between the Union and the states (and local bodies), so there is more than one level of government.","సమాఖ్యలో అధికారం కేంద్రం, రాష్ట్రాలు (స్థానిక సంస్థలు) మధ్య పంచబడుతుంది; అందువల్ల ఒకటి కంటే ఎక్కువ స్థాయిల ప్రభుత్వాలు ఉంటాయి."]},
{q:["The place of origin of democracy","ప్రజాస్వామ్యం పుట్టిన చోటు"],o:[["China","చైనా"],["India","భారతదేశం"],["Rome","రోమ్"],["Greece","గ్రీస్"]],a:3,
e:["Democracy began in the city-state of Athens in ancient Greece. The word comes from Greek 'demos' (people) and 'kratos' (rule).","ప్రజాస్వామ్యం ప్రాచీన గ్రీస్‌లోని ఏథెన్స్ నగర రాజ్యంలో మొదలైంది. ఈ పదం గ్రీకు 'డెమోస్' (ప్రజలు), 'క్రాటోస్' (పాలన) నుండి వచ్చింది."]},
{q:["This country is not an example of indirect democracy","పరోక్ష ప్రజాస్వామ్యానికి ఉదాహరణ కాని దేశం"],o:[["India","భారతదేశం"],["America","అమెరికా"],["England","ఇంగ్లాండ్"],["Switzerland","స్విట్జర్లాండ్"]],a:3,
e:["Switzerland is the best example of direct democracy: citizens vote directly on laws through referendums. India, USA and England elect representatives (indirect democracy).","స్విట్జర్లాండ్ ప్రత్యక్ష ప్రజాస్వామ్యానికి ఉత్తమ ఉదాహరణ: పౌరులు ప్రజాభిప్రాయ సేకరణ ద్వారా చట్టాలపై నేరుగా ఓటు వేస్తారు. భారత్, అమెరికా, ఇంగ్లాండ్‌లలో ప్రతినిధులను ఎన్నుకుంటారు (పరోక్ష ప్రజాస్వామ్యం)."]},
{q:["In a direct democracy, these people have the right to make decisions","ప్రత్యక్ష ప్రజాస్వామ్యంలో నిర్ణయాలు తీసుకునే హక్కు వీరికి ఉంటుంది"],o:[["Revenue officers","రెవెన్యూ అధికారులు"],["All eligible voters","అర్హత గల ఓటర్లందరూ"],["Courts","కోర్టులు"],["Collectorate offices","కలెక్టరేట్ కార్యాలయాలు"]],a:1,
e:["In direct democracy all eligible citizens take part in decisions themselves, as in the Gram Sabha in India.","ప్రత్యక్ష ప్రజాస్వామ్యంలో అర్హత గల పౌరులందరూ స్వయంగా నిర్ణయాల్లో పాల్గొంటారు; భారత్‌లో గ్రామసభ దీనికి ఉదాహరణ."]},
{q:["The first state to implement local self-government (Panchayati Raj) in 1959","1959లో స్థానిక స్వపరిపాలనను (పంచాయతీరాజ్) అమలు చేసిన మొదటి రాష్ట్రం"],o:[["Tamil Nadu","తమిళనాడు"],["Kerala","కేరళ"],["Andhra Pradesh","ఆంధ్రప్రదేశ్"],["Rajasthan","రాజస్థాన్"]],a:3,
e:["Nehru inaugurated Panchayati Raj at Nagaur, Rajasthan, on 2 October 1959. Andhra Pradesh followed in November 1959.","నెహ్రూ 1959 అక్టోబర్ 2న రాజస్థాన్‌లోని నాగౌర్‌లో పంచాయతీరాజ్‌ను ప్రారంభించారు. ఆంధ్రప్రదేశ్ 1959 నవంబర్‌లో అమలు చేసింది."]},
{q:["This is the decision / law implementing body","నిర్ణయాలను / చట్టాలను అమలుపరిచే విభాగం"],o:[["Legislature","శాసన శాఖ"],["Judiciary","న్యాయ శాఖ"],["Military wing","మిలటరీ విభాగం"],["Executive","కార్యనిర్వాహక శాఖ"]],a:3,
e:["The legislature makes laws, the executive implements them and the judiciary interprets them and settles disputes.","శాసన శాఖ చట్టాలు చేస్తుంది, కార్యనిర్వాహక శాఖ అమలు చేస్తుంది, న్యాయ శాఖ వాటిని వ్యాఖ్యానించి వివాదాలు పరిష్కరిస్తుంది."]},
{q:["This is the decision / law making body","నిర్ణయాలను / చట్టాలను చేసే విభాగం"],o:[["Legislature","శాసన శాఖ"],["Judiciary","న్యాయ శాఖ"],["Military wing","మిలటరీ విభాగం"],["Executive","కార్యనిర్వాహక శాఖ"]],a:0,
e:["The legislature (Parliament at the Centre, Legislative Assemblies in the states) makes laws.","శాసన శాఖ (కేంద్రంలో పార్లమెంటు, రాష్ట్రాల్లో శాసనసభలు) చట్టాలు చేస్తుంది."]},
{q:["This institution can make changes to an existing law of the country","దేశంలో అమల్లో ఉన్న చట్టాన్ని ఈ సంస్థ మార్చగలదు"],o:[["The Parliament","పార్లమెంటు"],["Election Commission","ఎన్నికల సంఘం"],["Prime Minister's Office","ప్రధానమంత్రి కార్యాలయం"],["The Supreme Court","సుప్రీంకోర్టు"]],a:0,
e:["Only Parliament can make, change or repeal central laws. The Supreme Court can strike down a law that violates the Constitution but does not rewrite it.","కేంద్ర చట్టాలను చేయడం, మార్చడం, రద్దు చేయడం పార్లమెంటు మాత్రమే చేయగలదు. రాజ్యాంగ విరుద్ధమైన చట్టాన్ని సుప్రీంకోర్టు కొట్టివేయగలదు కానీ తిరగరాయదు."]},
{q:["The Supreme Commander of the Defence Forces of India","భారత రక్షణ దళాల సర్వ సైన్యాధ్యక్షుడు"],o:[["Prime Minister","ప్రధానమంత్రి"],["President","రాష్ట్రపతి"],["Governor","గవర్నర్"],["Chief Justice of the Supreme Court","సుప్రీంకోర్టు ప్రధాన న్యాయమూర్తి"]],a:1,
e:["Under Article 53, the President is the Supreme Commander of the Army, Navy and Air Force.","ఆర్టికల్ 53 ప్రకారం రాష్ట్రపతి సైన్యం, నౌకాదళం, వైమానిక దళాల సర్వ సైన్యాధ్యక్షుడు."]},
{q:["The Mandal Commission recommended how much reservation for socially and educationally backward classes in civil posts/services?","సాంఘికంగా, విద్యాపరంగా వెనుకబడిన తరగతులకు ప్రభుత్వ ఉద్యోగాల్లో ఎంత శాతం రిజర్వేషన్ ఇవ్వాలని మండల్ కమిషన్ సిఫార్సు చేసింది?"],o:[["23%","23%"],["25%","25%"],["27%","27%"],["24%","24%"]],a:2,
e:["The Mandal Commission (1980) recommended 27% reservation for backward classes. The government implemented it in 1990.","మండల్ కమిషన్ (1980) వెనుకబడిన తరగతులకు 27% రిజర్వేషన్ సిఫార్సు చేసింది. ప్రభుత్వం 1990లో దీనిని అమలు చేసింది."]},
{q:["This commission recommended 27% reservation for socially and educationally backward classes in civil posts/services","ప్రభుత్వ ఉద్యోగాల్లో వెనుకబడిన తరగతులకు 27% రిజర్వేషన్ సిఫార్సు చేసిన కమిషన్"],o:[["Kothari Commission","కొఠారి కమిషన్"],["Mandal Commission","మండల్ కమిషన్"],["Narasimhan Commission","నరసింహన్ కమిషన్"],["Rakesh Mohan Commission","రాకేశ్ మోహన్ కమిషన్"]],a:1,
e:["The Second Backward Classes Commission, chaired by B.P. Mandal, is known as the Mandal Commission. The Kothari Commission was on education.","బి.పి. మండల్ అధ్యక్షతన ఏర్పడిన రెండవ వెనుకబడిన తరగతుల కమిషన్‌ను మండల్ కమిషన్ అంటారు. కొఠారి కమిషన్ విద్యకు సంబంధించినది."]},
{q:["Article 40 of the Indian Constitution addresses this","భారత రాజ్యాంగంలోని ఆర్టికల్ 40 దీనిని సూచిస్తుంది"],o:[["State","రాష్ట్రం"],["Local self-governance","స్థానిక స్వపరిపాలన"],["Capital","రాజధాని"],["Collector office","కలెక్టర్ ఆఫీసు"]],a:1,
e:["Article 40, a Directive Principle, asks the State to organise village panchayats as units of self-government.","ఆదేశిక సూత్రమైన ఆర్టికల్ 40 గ్రామ పంచాయతీలను స్వపరిపాలన విభాగాలుగా ఏర్పాటు చేయాలని రాజ్యాన్ని నిర్దేశిస్తుంది."]},
{q:["In our country, the final authority for making laws","మన దేశంలో చట్టాలను రూపొందించే అంతిమ అధికారం కలది"],o:[["Supreme Court","సుప్రీంకోర్టు"],["Parliament","పార్లమెంటు"],["President","రాష్ట్రపతి"],["Prime Minister","ప్రధానమంత్రి"]],a:1,
e:["Parliament (Lok Sabha, Rajya Sabha and the President) is the supreme law-making body of India.","పార్లమెంటు (లోక్‌సభ, రాజ్యసభ, రాష్ట్రపతి) భారతదేశ అత్యున్నత శాసన సంస్థ."]},
{q:["The Chairman of the Rajya Sabha","రాజ్యసభ చైర్మన్"],o:[["President","రాష్ట్రపతి"],["Prime Minister","ప్రధానమంత్రి"],["Vice President","ఉపరాష్ట్రపతి"],["Minister of External Affairs","విదేశీ వ్యవహారాల మంత్రి"]],a:2,
e:["The Vice President is the ex-officio Chairman of the Rajya Sabha. The Lok Sabha is presided over by the Speaker.","ఉపరాష్ట్రపతి రాజ్యసభకు పదవిరీత్యా చైర్మన్. లోక్‌సభకు స్పీకర్ అధ్యక్షత వహిస్తారు."]},
{q:["The other name of the Lok Sabha","లోక్‌సభకు గల మరొక పేరు"],o:[["Council of States","కౌన్సిల్ ఆఫ్ స్టేట్స్"],["Upper House","ఎగువ సభ"],["House of the People","ప్రజల సభ"],["Elders' House","పెద్దల సభ"]],a:2,
e:["The Lok Sabha is the House of the People (lower house). The Rajya Sabha is the Council of States, also called the upper house or house of elders.","లోక్‌సభ ప్రజల సభ (దిగువ సభ). రాజ్యసభ రాష్ట్రాల మండలి; దీనిని ఎగువ సభ, పెద్దల సభ అని కూడా అంటారు."]},
{q:["Expand EVM","EVM ను విస్తరించండి"],o:[["Electronic Voting Machine","ఎలక్ట్రానిక్ ఓటింగ్ మెషిన్"],["Electronic Voltage Method","ఎలక్ట్రానిక్ వోల్టేజ్ మెథడ్"],["Economic Value Monitoring","ఎకనామిక్ వాల్యూ మానిటరింగ్"],["Employee Voting Method","ఎంప్లాయీ ఓటింగ్ మెథడ్"]],a:0,
e:["EVM stands for Electronic Voting Machine, used in Indian elections instead of paper ballots.","EVM అంటే ఎలక్ట్రానిక్ ఓటింగ్ మెషిన్. భారత ఎన్నికల్లో బ్యాలెట్ పత్రాలకు బదులుగా వీటిని వాడతారు."]},
{q:["The number of members nominated by the President to the Rajya Sabha","రాజ్యసభకు రాష్ట్రపతి నామినేట్ చేసే సభ్యుల సంఖ్య"],o:[["10","10"],["8","8"],["12","12"],["15","15"]],a:2,
e:["The President nominates 12 members to the Rajya Sabha for their knowledge of art, literature, science and social service.","కళలు, సాహిత్యం, శాస్త్రం, సమాజ సేవలో విశేష జ్ఞానం ఉన్న 12 మందిని రాష్ట్రపతి రాజ్యసభకు నామినేట్ చేస్తారు."]},
{q:["This is an expression of the faith that the people of India have in the principles of democracy","భారత ప్రజలకు ప్రజాస్వామ్య సూత్రాలపై గల విశ్వాసానికి ఇది ప్రతీక"],o:[["Lok Sabha","లోక్‌సభ"],["P.M.O.","పి.ఎం.ఓ."],["Ministry of Home","హోం మంత్రిత్వ శాఖ"],["Parliament","పార్లమెంటు"]],a:3,
e:["Parliament, made up of elected representatives, expresses the people's faith in democracy.","ఎన్నికైన ప్రజాప్రతినిధులతో కూడిన పార్లమెంటు ప్రజలకు ప్రజాస్వామ్యంపై గల విశ్వాసానికి ప్రతీక."]},
{q:["Electronic voting machines were used throughout the country for the first time in these general elections","దేశవ్యాప్తంగా మొదటిసారి ఎలక్ట్రానిక్ ఓటింగ్ మెషిన్లను ఉపయోగించిన సాధారణ ఎన్నికలు"],o:[["2019","2019"],["2009","2009"],["2014","2014"],["2004","2004"]],a:3,
e:["EVMs were used in all constituencies for the first time in the 2004 Lok Sabha elections.","2004 లోక్‌సభ ఎన్నికల్లో మొదటిసారిగా అన్ని నియోజకవర్గాల్లో EVMలు ఉపయోగించారు."]},
{q:["This state alone is home to more than 60 different tribal groups","ఈ ఒక్క రాష్ట్రమే 60కి పైగా వేర్వేరు గిరిజన తెగలకు నిలయం"],o:[["Punjab","పంజాబ్"],["Haryana","హర్యానా"],["Odisha","ఒడిశా"],["Kerala","కేరళ"]],a:2,
e:["Odisha has 62 Scheduled Tribe communities, the largest number of tribal groups of any state.","ఒడిశాలో 62 షెడ్యూల్డ్ తెగల సమూహాలు ఉన్నాయి. ఇది ఏ రాష్ట్రంలోనైనా అత్యధికం."]},
{q:["The Scheduled Castes and Scheduled Tribes (Prevention of Atrocities) Act was framed in this year","షెడ్యూల్డ్ కులాలు, షెడ్యూల్డ్ తెగల (అత్యాచారాల నిరోధక) చట్టం రూపొందించిన సంవత్సరం"],o:[["1989","1989"],["1969","1969"],["1979","1979"],["1999","1999"]],a:0,
e:["The SC/ST (Prevention of Atrocities) Act was passed in 1989 to protect Dalits and Adivasis from discrimination and violence.","దళితులు, ఆదివాసీలను వివక్ష, హింస నుండి రక్షించేందుకు 1989లో ఎస్సీ/ఎస్టీ (అత్యాచారాల నిరోధక) చట్టం ఆమోదించారు."]},
{q:["These people are called 'original inhabitants'","వీరిని మూలవాసులు అని పిలుస్తారు"],o:[["Invaders","ఆక్రమణదారులు"],["Adivasis","ఆదివాసీలు"],["Outlanders","విదేశీయులు"],["Migrated people","వలసదారులు"]],a:1,
e:["'Adivasi' literally means original inhabitants — communities that have lived in and closely with forests for a very long time.","'ఆదివాసీ' అంటే మూలవాసులు — చాలా కాలంగా అడవులలో, అడవులతో సన్నిహితంగా జీవిస్తున్న సమూహాలు."]},
{q:["He stated that 'religion can never be separated from politics'","'రాజకీయాల నుండి మతాన్ని ఎన్నటికీ వేరు చేయలేము' అని పేర్కొన్నవారు"],o:[["Jawaharlal Nehru","జవహర్‌లాల్ నెహ్రూ"],["Mahatma Gandhi","మహాత్మా గాంధీ"],["Pherozeshah Mehta","ఫిరోజ్ షా మెహతా"],["B.R. Ambedkar","బి.ఆర్. అంబేద్కర్"]],a:1,
e:["Gandhiji said religion cannot be separated from politics. By religion he meant moral values common to all faiths, not any one religion.","మతాన్ని రాజకీయాల నుండి వేరు చేయలేమని గాంధీజీ అన్నారు. ఆయన దృష్టిలో మతం అంటే ఏదో ఒక మతం కాదు, అన్ని మతాలకు ఉమ్మడిగా ఉన్న నైతిక విలువలు."]},
{q:["The term used for Adivasis by the Indian government in official documents","ప్రభుత్వ అధికారిక పత్రాలలో ఆదివాసీలను సూచించడానికి వాడే పదం"],o:[["Exotic","పరాయివాళ్ళు"],["Backward","వెనుకబడినవాళ్ళు"],["Scheduled Tribes","షెడ్యూల్డ్ తెగలు"],["Migrated people","వలసదారులు"]],a:2,
e:["Government documents use the term 'Scheduled Tribes' for Adivasis, as they are listed in a schedule under Article 342.","ప్రభుత్వ పత్రాలలో ఆదివాసీలను 'షెడ్యూల్డ్ తెగలు' అంటారు. ఆర్టికల్ 342 కింద వీరిని ఒక జాబితా (షెడ్యూల్)లో చేర్చారు."]},
{q:["He fought against the apartheid system in South Africa","దక్షిణాఫ్రికాలో వర్ణవివక్షకు వ్యతిరేకంగా పోరాడినవారు"],o:[["Nelson Mandela","నెల్సన్ మండేలా"],["Nelson Pinochet","నెల్సన్ పినోచెట్"],["Arthur Colin","ఆర్థర్ కొలిన్"],["Major Ferdinand","మేజర్ ఫెర్డినాండ్"]],a:0,
e:["Nelson Mandela spent 27 years in prison for opposing apartheid and became President of South Africa in 1994.","వర్ణవివక్షను వ్యతిరేకించినందుకు నెల్సన్ మండేలా 27 సంవత్సరాలు జైలులో గడిపి, 1994లో దక్షిణాఫ్రికా అధ్యక్షుడయ్యారు."]},
{q:["The 'Bhopal Gas Tragedy' took place in this state","'భోపాల్ గ్యాస్ దుర్ఘటన' జరిగిన రాష్ట్రం"],o:[["Uttar Pradesh","ఉత్తరప్రదేశ్"],["Rajasthan","రాజస్థాన్"],["Maharashtra","మహారాష్ట్ర"],["Madhya Pradesh","మధ్యప్రదేశ్"]],a:3,
e:["On the night of 2–3 December 1984, poisonous methyl isocyanate gas leaked from the Union Carbide plant in Bhopal, Madhya Pradesh.","1984 డిసెంబర్ 2–3 రాత్రి మధ్యప్రదేశ్‌లోని భోపాల్ యూనియన్ కార్బైడ్ కర్మాగారం నుండి విషపూరిత మిథైల్ ఐసోసైనేట్ వాయువు లీకైంది."]},
{q:["The Child Labour Amendment Act 2016 bans employment in hazardous occupations and processes for children of this age group","బాల కార్మిక సవరణ చట్టం 2016 ఈ వయస్సు వారిని ప్రమాదకర పనులలో నియమించడాన్ని నిషేధించింది"],o:[["18–20 years","18–20 సంవత్సరాలు"],["14–18 years","14–18 సంవత్సరాలు"],["19–21 years","19–21 సంవత్సరాలు"],["20–24 years","20–24 సంవత్సరాలు"]],a:1,
e:["The 2016 amendment fully bans employing children below 14 and bans adolescents aged 14–18 from hazardous occupations and processes.","2016 సవరణ 14 ఏళ్ళ లోపు పిల్లలను పనిలో పెట్టుకోవడాన్ని పూర్తిగా నిషేధించింది; 14–18 ఏళ్ళ కౌమారులను ప్రమాదకర పనులలో నియమించడాన్ని నిషేధించింది."]},
{q:["The Adivasi population in India is","భారతదేశంలో ఆదివాసీల జనాభా శాతం"],o:[["8%","8%"],["18%","18%"],["28%","28%"],["38%","38%"]],a:0,

{q:["According to the 2011 census, this number of children in India aged 5–14 work in various occupations, including hazardous ones","2011 జనగణన ప్రకారం భారతదేశంలో 5–14 ఏళ్ళ వయస్సు గల పిల్లలలో ప్రమాదకర వృత్తులతో సహా వివిధ పనులు చేస్తున్నవారి సంఖ్య"],o:[["8 million","8 మిలియన్లు"],["12 million","12 మిలియన్లు"],["4 million","4 మిలియన్లు"],["16 million","16 మిలియన్లు"]],a:2,
e:["As per the answer key and the textbook, over 4 million (about 4.35 million) children aged 5–14 work in various occupations, including hazardous ones.","జవాబు కీ, పాఠ్యపుస్తకం ప్రకారం 5–14 ఏళ్ళ వయస్సు గల 4 మిలియన్లకు పైగా (సుమారు 43.5 లక్షల) పిల్లలు ప్రమాదకర పనులతో సహా వివిధ వృత్తుల్లో పనిచేస్తున్నారు."]},
{q:["Author of 'Wings of Fire'","'వింగ్స్ ఆఫ్ ఫైర్' గ్రంథకర్త"],o:[["A.P.J. Abdul Kalam","ఏ.పి.జె. అబ్దుల్ కలాం"],["R.K. Narayanan","ఆర్.కె. నారాయణన్"],["Bhagat Singh","భగత్ సింగ్"],["Netaji","నేతాజీ"]],a:0,
e:["'Wings of Fire' is the autobiography of Dr A.P.J. Abdul Kalam, written with Arun Tiwari (1999).","'వింగ్స్ ఆఫ్ ఫైర్' డా. ఏ.పి.జె. అబ్దుల్ కలాం ఆత్మకథ; అరుణ్ తివారీతో కలిసి రాశారు (1999)."]},
{q:["Under this Article of the Constitution, the Supreme Court stated that the 'Right to Life' is a Fundamental Right","రాజ్యాంగంలోని ఈ నిబంధన ప్రకారం 'జీవించే హక్కు' ప్రాథమిక హక్కు అని సుప్రీంకోర్టు పేర్కొంది"],o:[["21","21"],["19","19"],["18","18"],["17","17"]],a:0,
e:["Article 21 protects life and personal liberty. The Supreme Court has read it to include the right to livelihood, shelter, a clean environment and more.","ఆర్టికల్ 21 జీవితాన్ని, వ్యక్తిగత స్వేచ్ఛను రక్షిస్తుంది. జీవనోపాధి, నివాసం, పరిశుభ్ర పర్యావరణం వంటివి కూడా దీనిలో భాగమని సుప్రీంకోర్టు చెప్పింది."]},
{q:["He said that the Right to Constitutional Remedies is the heart and soul of our Constitution","రాజ్యాంగ పరిహారపు హక్కు మన రాజ్యాంగానికి హృదయం, ఆత్మ అని అన్నవారు"],o:[["Jawaharlal Nehru","జవహర్‌లాల్ నెహ్రూ"],["B.R. Ambedkar","బి.ఆర్. అంబేద్కర్"],["Babu Rajendra Prasad","బాబు రాజేంద్ర ప్రసాద్"],["Smt. Indira Gandhi","శ్రీమతి ఇందిరా గాంధీ"]],a:1,
e:["Dr Ambedkar called Article 32 (Right to Constitutional Remedies) the heart and soul of the Constitution, because it lets citizens go to the Supreme Court to protect their rights.","పౌరులు తమ హక్కుల రక్షణ కోసం సుప్రీంకోర్టును నేరుగా ఆశ్రయించే వీలు కల్పించే ఆర్టికల్ 32 (రాజ్యాంగ పరిహారపు హక్కు)ను డా. అంబేద్కర్ రాజ్యాంగానికి హృదయం, ఆత్మ అన్నారు."]},
{q:["Economic development depends on these factors:\n(a) Country's population size\n(b) Global situation\n(c) Cooperation from other countries\n(d) Economic priorities","ఆర్థికాభివృద్ధి ఈ అంశాలపై ఆధారపడి ఉంటుంది:\n(a) దేశ జనాభా పరిమాణం\n(b) ప్రపంచ పరిస్థితి\n(c) ఇతర దేశాల సహకారం\n(d) ఆర్థిక ప్రాధాన్యతలు"],o:[["a, b, c, d","a, b, c, d"],["a, b only","a, b మాత్రమే"],["c, d only","c, d మాత్రమే"],["b, c, d only","b, c, d మాత్రమే"]],a:0,
e:["All four factors affect a country's economic development: its population, the world situation, help from other countries and the priorities it sets.","నాలుగు అంశాలూ దేశ ఆర్థికాభివృద్ధిని ప్రభావితం చేస్తాయి: జనాభా, ప్రపంచ పరిస్థితి, ఇతర దేశాల సహకారం, దేశం నిర్ణయించుకునే ప్రాధాన్యతలు."]}
];
const BASE=150;

const UI={
 en:{q:"Question",of:"of",score:"Score",prev:"◀ Previous",next:"Next ▶",finish:"See result",right:"Correct!",wrong:"Wrong. Correct answer:",map:"Question map",lr:"Correct",lw:"Wrong",lu:"Not answered",done:"Quiz complete",again:"Start again",att:"Answered"},
 te:{q:"ప్రశ్న",of:"/",score:"స్కోరు",prev:"◀ వెనుకకు",next:"తర్వాత ▶",finish:"ఫలితం చూడండి",right:"సరైన సమాధానం!",wrong:"తప్పు. సరైన సమాధానం:",map:"ప్రశ్నల పటం",lr:"సరైనవి",lw:"తప్పులు",lu:"జవాబు ఇవ్వనివి",done:"క్విజ్ పూర్తయింది",again:"మళ్ళీ ప్రారంభించండి",att:"జవాబిచ్చినవి"}
};
let lang="both",cur=0,ans=Array(Q.length).fill(null),showResult=false;
try{const s=JSON.parse(localStorage.getItem("tet2a-soc4")||"null");if(s){lang=s.lang||lang;cur=s.cur||0;if(Array.isArray(s.ans)&&s.ans.length===Q.length)ans=s.ans;}}catch(e){}
const save=()=>{try{localStorage.setItem("tet2a-soc4",JSON.stringify({lang,cur,ans}))}catch(e){}};
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function bi(p){ // p=[en,te]
  if(lang==="en")return `<span class="en">${esc(p[0])}</span>`;
  if(lang==="te")return `<span class="te">${esc(p[1])}</span>`;
  return p[0]===p[1]?`<span class="en">${esc(p[0])}</span>`:`<span class="en">${esc(p[0])}</span><span class="te">${esc(p[1])}</span>`;
}
function lbl(k){ if(lang==="en")return UI.en[k]; if(lang==="te")return UI.te[k]; return UI.te[k]+" / "+UI.en[k]; }
const K=["A","B","C","D"];
function render(){
  document.querySelectorAll(".langs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===lang));
  const done=ans.filter(x=>x!==null).length, right=ans.filter((x,i)=>x===Q[i].a).length;
  document.getElementById("s-pos").innerHTML=`${lbl("att")}: <b>${done}/${Q.length}</b>`;
  document.getElementById("s-score").innerHTML=`${lbl("score")}: <b>${right}</b>`;
  document.getElementById("s-bar").style.width=(done/Q.length*100)+"%";
  const card=document.getElementById("card");
  if(showResult){
    const wrong=done-right;
    card.className="card result";
    card.innerHTML=`<div class="qno">${lbl("done")}</div><div class="big">${right} / ${Q.length}</div>
      <div>${lbl("lr")}: <b>${right}</b> · ${lbl("lw")}: <b>${wrong}</b> · ${lbl("lu")}: <b>${Q.length-done}</b></div>
      <div class="nav" style="justify-content:center"><button id="again">${lbl("again")}</button></div>`;
    document.getElementById("again").onclick=()=>{ans=Array(Q.length).fill(null);cur=0;showResult=false;save();render();};
  } else {
    card.className="card";
    const q=Q[cur],picked=ans[cur];
    let h=`<div class="qno">${lbl("q")} ${BASE+cur+1} / ${BASE+Q.length}</div><div class="qtext">${bi(q.q)}</div>`;
    if(q.m){
      const mh=q.mh||[["Colour","రంగు"],["Feature","స్వరూపం"]];const hd=k=>lang==="en"?mh[k][0]:lang==="te"?mh[k][1]:mh[k][0]+" / "+mh[k][1];
      const cell=p=>lang==="en"?esc(p[0]):lang==="te"?`<span style="font-family:var(--f-te)">${esc(p[1])}</span>`:`${esc(p[0])}<small>${esc(p[1])}</small>`;
      h+=`<div class="mtab"><table><thead><tr><th>${hd(0)}</th><th>${hd(1)}</th></tr></thead><tbody>`+
         q.m.map(r=>`<tr><td>${cell(r[0])}</td><td>${cell(r[1])}</td></tr>`).join("")+`</tbody></table></div>`;
    }
    h+=`<div class="opts">`+q.o.map((o,i)=>{
      let c="";if(picked!==null){if(i===q.a)c="right";else if(i===picked)c="wrong";}
      return `<button class="opt ${c}" id="opt${i}" data-i="${i}" ${picked!==null?"disabled":""}><span class="k">${K[i]}</span><span class="t">${bi(o)}</span></button>`;
    }).join("")+`</div>`;
    if(picked!==null){
      const ok=picked===q.a;
      const v=ok?`<span class="verdict ok">✔ ${lbl("right")}</span>`:`<span class="verdict no">✘ ${lbl("wrong")} ${K[q.a]}</span>`;
      h+=`<div class="exp">${v}${bi(q.e)}</div>`;
    }
    const last=cur===Q.length-1;
    h+=`<div class="nav"><button class="ghost" id="prev" ${cur===0?"disabled":""}>${lbl("prev")}</button><button id="next">${last?lbl("finish"):lbl("next")}</button></div>`;
    card.innerHTML=h;
    card.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ans[cur]=+b.dataset.i;save();render();});
    document.getElementById("prev").onclick=()=>{cur--;save();render();};
    document.getElementById("next").onclick=()=>{if(last){showResult=true;}else cur++;save();render();window.scrollTo({top:0,behavior:"smooth"});};
  }
  document.getElementById("map-h").textContent=lbl("map");
  document.getElementById("legend").innerHTML=`<span style="--c:var(--ok)">${lbl("lr")}</span><span style="--c:var(--bad)">${lbl("lw")}</span><span style="--c:var(--line)">${lbl("lu")}</span>`;
  const g=document.getElementById("grid");
  g.innerHTML=Q.map((q,i)=>{let c=ans[i]===null?"":ans[i]===q.a?"r":"w";if(i===cur&&!showResult)c+=" cur";return `<button class="${c}" data-i="${i}" aria-label="Q ${BASE+i+1}">${BASE+i+1}</button>`}).join("");
  g.querySelectorAll("button").forEach(b=>b.onclick=()=>{cur=+b.dataset.i;showResult=false;save();render();document.getElementById("card").scrollIntoView({behavior:"smooth",block:"start"});});
}
document.querySelectorAll(".langs button").forEach(b=>b.onclick=()=>{lang=b.dataset.l;save();render();});
render();
</script>
