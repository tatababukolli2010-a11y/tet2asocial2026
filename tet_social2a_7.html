<!doctype html>
<html lang="te">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TET 2A Social Quiz 7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&family=Noto+Sans:wght@400;600&family=Noto+Sans+Telugu:wght@400;600;700&family=Ramabhadra&display=swap">
<style>
/* Layout: a single atlas-sheet column — teacher header, quiz card, question map grid, credit footer */
:root{
  --paper:#f4f6f1; --sheet:#ffffff; --ink:#1d3442; --muted:#5b6d72; --line:#d7dfd8;
  --accent:#b8742a; --accent-soft:#f6ead9; --sea:#2c6e7f; --sea-soft:#e2eff1;
  --ok:#2f7d4a; --ok-soft:#e3f2e7; --bad:#b23b33; --bad-soft:#f8e3e1;
  --c1:#f26b00; --c2:#00897b; --c3:#7b3fe4; --c4:#e0245e; --on-hero:#ffffff;
  --hero:linear-gradient(120deg,#ff8a1f 0%,#e8405f 50%,#8a3ee0 100%);
  --f-display:"Bitter","Ramabhadra",Georgia,serif;
  --f-te:"Noto Sans Telugu","Noto Sans",system-ui,sans-serif;
  --f-body:"Noto Sans","Noto Sans Telugu",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#111a1f; --sheet:#18242b; --ink:#e5ece8; --muted:#9db0b2; --line:#2c3b42;
  --accent:#e0a35a; --accent-soft:#3a2c1b; --sea:#7fc0cf; --sea-soft:#1c3239;
  --ok:#6fcf8e; --ok-soft:#173326; --bad:#f08b80; --bad-soft:#3b1e1c; --c1:#ffa04d; --c2:#4fd3c3; --c3:#b590ff; --c4:#ff6f9a; --hero:linear-gradient(120deg,#c25a0c 0%,#a82a4a 50%,#5b2aa3 100%); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111a1f; --sheet:#18242b; --ink:#e5ece8; --muted:#9db0b2; --line:#2c3b42;
  --accent:#e0a35a; --accent-soft:#3a2c1b; --sea:#7fc0cf; --sea-soft:#1c3239;
  --ok:#6fcf8e; --ok-soft:#173326; --bad:#f08b80; --bad-soft:#3b1e1c; --c1:#ffa04d; --c2:#4fd3c3; --c3:#b590ff; --c4:#ff6f9a; --hero:linear-gradient(120deg,#c25a0c 0%,#a82a4a 50%,#5b2aa3 100%); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:18px 28px;display:flex;flex-direction:column;gap:16px}
header.top{display:flex;align-items:center;gap:16px;background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
header.top img{width:84px;height:88px;object-fit:cover;border-radius:12px;border:3px solid var(--accent);flex:none}
.ht{min-width:0;display:flex;flex-direction:column;gap:2px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}
h1{font-family:var(--f-display);font-size:clamp(20px,4.6vw,26px);line-height:1.2;margin:0;text-wrap:balance}
.sub{font-family:var(--f-te);color:var(--muted);font-size:14px}
.langs{display:flex;flex-wrap:wrap;gap:8px}
.langs button{font:600 14px var(--f-te);padding:8px 14px;border-radius:999px;border:1.5px solid var(--sea);background:transparent;color:var(--sea);cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--sea);color:var(--sheet)}
.status{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.status b{color:var(--ink)}
.bar{flex:1 1 160px;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:18px 16px;display:flex;flex-direction:column;gap:14px}
.qno{font-family:var(--f-display);color:var(--accent);font-size:15px}
.qtext{display:flex;flex-direction:column;gap:4px;white-space:pre-line}
.qtext .en{font-size:17px;font-weight:600}
.qtext .te{font-family:var(--f-te);font-size:17px;font-weight:600}
.qtext .en+.te{font-weight:400;color:var(--muted);font-size:16px}
.mtab{overflow-x:auto}
.mtab table{border-collapse:collapse;width:100%;font-size:15px}
.mtab th,.mtab td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.mtab th{background:var(--sea-soft);color:var(--sea);font-weight:600}
.mtab small{display:block;font-family:var(--f-te);color:var(--muted)}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--sheet);color:var(--ink);font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--sea);background:var(--sea-soft)}
.opt:focus-visible,.langs button:focus-visible,.nav button:focus-visible,.grid button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--sea-soft);color:var(--sea);font-weight:700;font-size:14px}
.opt .t{min-width:0;display:flex;flex-direction:column}
.opt .t .te{font-family:var(--f-te)}
.opt .t .en+.te{color:var(--muted);font-size:15px}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);color:var(--sheet)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:var(--sheet)}
.exp{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.exp .verdict{font-weight:700}
.exp .verdict.ok{color:var(--ok)} .exp .verdict.no{color:var(--bad)}
.exp .te{font-family:var(--f-te)}
.nav{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.nav button{font:600 15px var(--f-te);padding:10px 18px;border-radius:10px;border:none;background:var(--ink);color:var(--sheet);cursor:pointer}
.nav button.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.nav button:disabled{opacity:.4;cursor:default}
.mapcard{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.mapcard h2{font-family:var(--f-display);font-size:16px;margin:0}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.grid button{aspect-ratio:1;max-width:100%;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:600 13px var(--f-body);cursor:pointer;font-variant-numeric:tabular-nums;padding:0}
.grid button.r{background:var(--ok);color:var(--sheet);border-color:var(--ok)}
.grid button.w{background:var(--bad);color:var(--sheet);border-color:var(--bad)}
.grid button.cur{outline:2px solid var(--accent);outline-offset:1px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.result{text-align:center;align-items:center}
.result .big{font-family:var(--f-display);font-size:44px;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1}

/* ---- colourful layer ---- */
body{background:
  radial-gradient(600px 400px at 0% 0%,color-mix(in srgb,var(--c1) 16%,transparent),transparent 70%),
  radial-gradient(600px 420px at 100% 30%,color-mix(in srgb,var(--c3) 14%,transparent),transparent 70%),
  radial-gradient(700px 500px at 20% 100%,color-mix(in srgb,var(--c2) 14%,transparent),transparent 70%),
  var(--paper);background-attachment:fixed}
header.top{background:var(--hero);border:none;color:var(--on-hero);box-shadow:0 10px 26px -12px color-mix(in srgb,var(--c4) 60%,transparent)}
header.top img{border:3px solid var(--on-hero);box-shadow:0 0 0 4px color-mix(in srgb,var(--on-hero) 35%,transparent)}
header.top .eyebrow{color:var(--on-hero);opacity:.9}
header.top .sub{color:var(--on-hero);opacity:.92}
.langs button:nth-child(1){--lc:var(--c1)} .langs button:nth-child(2){--lc:var(--c4)} .langs button:nth-child(3){--lc:var(--c2)}
.langs button{border-color:var(--lc);color:var(--lc);background:color-mix(in srgb,var(--lc) 8%,var(--sheet))}
.langs button[aria-pressed="true"]{background:var(--lc);color:var(--sheet)}
.bar{height:10px}
.bar i{background:linear-gradient(90deg,var(--c1),var(--c4),var(--c3))}
.status b{color:var(--c3)}
.card{border:none;border-top:6px solid transparent;background:linear-gradient(var(--sheet),var(--sheet)) padding-box,linear-gradient(90deg,var(--c1),var(--c4),var(--c3),var(--c2)) border-box;box-shadow:0 8px 24px -14px color-mix(in srgb,var(--c3) 50%,transparent)}
.qno{display:inline-block;align-self:flex-start;background:color-mix(in srgb,var(--c1) 14%,var(--sheet));color:var(--c1);padding:3px 12px;border-radius:999px}
.opts .opt:nth-child(1){--oc:var(--c1)} .opts .opt:nth-child(2){--oc:var(--c2)} .opts .opt:nth-child(3){--oc:var(--c3)} .opts .opt:nth-child(4){--oc:var(--c4)}
.opt{border-color:color-mix(in srgb,var(--oc) 35%,var(--line));background:color-mix(in srgb,var(--oc) 5%,var(--sheet))}
.opt .k{background:var(--oc);color:var(--sheet)}
.opt:hover:not(:disabled){border-color:var(--oc);background:color-mix(in srgb,var(--oc) 13%,var(--sheet))}
.opt.right{border-color:var(--ok);background:var(--ok-soft)} .opt.right .k{background:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)} .opt.wrong .k{background:var(--bad)}
.exp{border-left-color:var(--c3);background:color-mix(in srgb,var(--c3) 10%,var(--sheet))}
.mtab th{background:color-mix(in srgb,var(--c2) 16%,var(--sheet));color:var(--c2)}
.nav button{background:linear-gradient(120deg,var(--c4),var(--c3));color:var(--on-hero)}
.nav button.ghost{background:color-mix(in srgb,var(--c2) 8%,var(--sheet));color:var(--c2);border-color:var(--c2)}
.mapcard{border:none;box-shadow:0 8px 24px -16px color-mix(in srgb,var(--c2) 60%,transparent)}
.mapcard h2{color:var(--c2)}
.grid button:nth-child(4n+1){--gc:var(--c1)} .grid button:nth-child(4n+2){--gc:var(--c2)} .grid button:nth-child(4n+3){--gc:var(--c3)} .grid button:nth-child(4n){--gc:var(--c4)}
.grid button{border-color:color-mix(in srgb,var(--gc) 45%,var(--line));background:color-mix(in srgb,var(--gc) 9%,var(--sheet));color:var(--gc)}
.grid button.r{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.grid button.w{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.grid button.cur{outline:3px solid var(--c4)}
.result .big{background:linear-gradient(90deg,var(--c1),var(--c4),var(--c3));-webkit-background-clip:text;background-clip:text;color:transparent}
footer{border-top:none;background:var(--hero);color:var(--on-hero);border-radius:14px;padding:14px 16px}
footer b{color:var(--on-hero)}
footer{text-align:center;font-family:var(--f-te);font-size:15px;color:var(--muted);border-top:1px dashed var(--line);padding-top:14px}
footer b{color:var(--ink)}
footer{color:var(--on-hero);border-top:none;background:var(--hero);border-radius:14px;padding:14px 16px} footer b{color:var(--on-hero)}
@media (max-width:480px){.grid{grid-template-columns:repeat(8,1fr)} header.top img{width:70px;height:74px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---- larger text ---- */
body{font-size:18px;line-height:1.6}
.wrap{max-width:820px;gap:18px}
.eyebrow{font-size:13.5px}
h1{font-size:clamp(23px,5.4vw,30px)}
.sub{font-size:16.5px}
header.top img{width:96px;height:100px}
.langs button{font-size:16.5px;padding:10px 18px}
.status{font-size:16.5px}
.qno{font-size:17px}
.qtext .en,.qtext .te{font-size:21px;line-height:1.55}
.qtext .en+.te{font-size:20px}
.opt{padding:14px 16px;gap:14px;font-size:19px}
.opt .k{width:36px;height:36px;font-size:17px}
.opt .t .en+.te{font-size:18px}
.mtab table{font-size:18px}
.exp{font-size:18.5px;padding:14px 16px}
.nav button{font-size:17.5px;padding:12px 22px}
.mapcard h2{font-size:19px}
.grid button{font-size:15.5px}
.legend{font-size:15px}
footer{font-size:18px!important}
footer span{font-size:15px!important}
.result .big{font-size:56px}
@media (max-width:480px){.qtext .en,.qtext .te{font-size:20px}.opt{font-size:18px}.grid{grid-template-columns:repeat(7,1fr)}header.top img{width:80px;height:84px}}
</style>

<script>
const Q=[
{q:["These values develop in students by teaching social studies:\n(A) Utilitarian values\n(B) Cultural values\n(C) Vocational values","సాంఘిక శాస్త్ర బోధన వల్ల విద్యార్థులలో ఈ విలువలు అభివృద్ధి చెందుతాయి:\n(A) ఉపయోగిత విలువలు\n(B) సాంస్కృతిక విలువలు\n(C) వృత్తి విలువలు"],o:[["A, B only","A, B మాత్రమే"],["B, C only","B, C మాత్రమే"],["A, C only","A, C మాత్రమే"],["A, B and C","A, B మరియు C"]],a:3,
e:["Social studies develops utilitarian (useful in daily life), cultural (appreciating heritage) and vocational (awareness of occupations) values — all three.","సాంఘిక శాస్త్రం ఉపయోగిత (నిత్యజీవితంలో ఉపయోగపడే), సాంస్కృతిక (వారసత్వాన్ని గౌరవించే), వృత్తి (వృత్తులపై అవగాహన) విలువలను — మూడింటినీ — పెంపొందిస్తుంది."]},
{q:["This suggested that social studies education should be relevant to real life","సాంఘిక శాస్త్ర విద్య నిజ జీవితానికి సంబంధించినదిగా ఉండాలని సూచించినది"],o:[["Ishwarbhai Patel Committee","ఈశ్వర్‌భాయ్ పటేల్ కమిటీ"],["Kothari Commission","కొఠారి కమిషన్"],["Secondary Education Commission","మాధ్యమిక విద్యా కమిషన్"],["Sargent Committee","సార్జెంట్ కమిటీ"]],a:0,
e:["As per the answer key, the Ishwarbhai Patel Committee (1977) recommended that school subjects, including social studies, be linked to real life and socially useful work.","జవాబు కీ ప్రకారం ఈశ్వర్‌భాయ్ పటేల్ కమిటీ (1977) సాంఘిక శాస్త్రంతో సహా పాఠ్య విషయాలను నిజ జీవితంతో, సామాజికంగా ఉపయోగకరమైన పనితో అనుసంధానించాలని సిఫార్సు చేసింది."]},
{q:["It highlights the basic knowledge students must acquire to be acquainted with a subject or to solve problems in it","ఒక విషయంతో పరిచయం పొందడానికి లేదా దానిలోని సమస్యలను పరిష్కరించడానికి విద్యార్థులు తప్పక తెలుసుకోవలసిన ప్రాథమిక జ్ఞానం"],o:[["Factual knowledge","వాస్తవాలకు సంబంధించిన జ్ఞానం"],["Conceptual knowledge","భావనా సంబంధిత జ్ఞానం"],["Procedural knowledge","విధానాత్మక జ్ఞానం"],["Metacognitive knowledge","మెటా కాగ్నిటివ్ జ్ఞానం"]],a:0,
e:["In the revised Bloom's taxonomy, factual knowledge is the basic elements (terms, facts, details) a student must know to work with a subject or solve problems in it.","సవరించిన బ్లూమ్ వర్గీకరణలో, ఒక విషయంలో పని చేయడానికి, సమస్యలు పరిష్కరించడానికి తప్పక తెలియాల్సిన ప్రాథమిక అంశాలు (పదాలు, వాస్తవాలు, వివరాలు) వాస్తవిక జ్ఞానం."]},
{q:["\"Behavioural objectives are the specific behaviours expected from students after completion of a unit of teaching, expressed in observable terms\" — stated by","\"ఒక యూనిట్ బోధన పూర్తయిన తర్వాత విద్యార్థి నుండి ఆశించే, పరిశీలించదగిన పదాలలో వ్యక్తం చేసిన నిర్దిష్ట ప్రవర్తనలే ప్రవర్తనా లక్ష్యాలు\" అని పేర్కొన్నవారు"],o:[["M.C. Moffat","ఎం.సి. మోఫాట్"],["W.H. Wesley","డబ్ల్యు.హెచ్. వెస్లీ"],["W.D. Rome","డబ్ల్యు.డి. రోమ్"],["Alexander Duff","అలెగ్జాండర్ డఫ్"]],a:2,
e:["As per the answer key, this definition of behavioural (instructional) objectives is by W.D. Rome.","జవాబు కీ ప్రకారం ప్రవర్తనా (బోధనా) లక్ష్యాల ఈ నిర్వచనం డబ్ల్యు.డి. రోమ్‌ది."]},
{q:["'Truth is beauty, beauty is truth' — opined by","'సత్యమే సౌందర్యం, సౌందర్యమే సత్యం' అని అభిప్రాయపడినవారు"],o:[["Kilpatrick","కిల్‌పాట్రిక్"],["John Adams","జాన్ ఆడమ్స్"],["John Keats","జాన్ కీట్స్"],["Aurobindo Ghosh","అరబిందో ఘోష్"]],a:2,
e:["This line is from John Keats's poem 'Ode on a Grecian Urn' (1819). It is used to explain aesthetic values.","ఈ వాక్యం జాన్ కీట్స్ కవిత 'ఓడ్ ఆన్ ఎ గ్రీషియన్ అర్న్' (1819) నుండి. సౌందర్యాత్మక విలువలను వివరించడానికి దీనిని ఉపయోగిస్తారు."]},
{q:["A student is able to divide the given information into sections and explain the relationships among them. The objective achieved is","ఇచ్చిన సమాచారాన్ని విభాగాలుగా చేసి వాటి మధ్య సంబంధాలను విద్యార్థి వివరించగలిగాడు. అతడు సాధించిన లక్ష్యం"],o:[["Understanding","అవగాహన"],["Application","అనువర్తనం"],["Analysing","విశ్లేషణ"],["Creating","సృష్టించడం"]],a:2,
e:["Analysing means breaking information into parts and finding how the parts relate to each other.","సమాచారాన్ని భాగాలుగా విడదీసి, ఆ భాగాల మధ్య సంబంధాలను గుర్తించడమే విశ్లేషణ."]},
{q:["He worked in the psychomotor domain","మానసిక చలనాత్మక రంగంపై కృషి చేసినవారు"],o:[["Simpson","సింప్సన్"],["Benjamin Bloom","బెంజమిన్ బ్లూమ్"],["Krathwohl","క్రాత్‌వోల్"],["W.H. Wesley","డబ్ల్యు.హెచ్. వెస్లీ"]],a:0,
e:["E.J. Simpson (1966), along with R.H. Dave and Harrow, classified the psychomotor domain. Bloom worked on the cognitive and Krathwohl on the affective domain.","ఇ.జె. సింప్సన్ (1966), ఆర్.హెచ్. దవే, హారోతో పాటు మానసిక చలనాత్మక రంగాన్ని వర్గీకరించారు. బ్లూమ్ జ్ఞానాత్మక రంగంపై, క్రాత్‌వోల్ భావావేశ రంగంపై కృషి చేశారు."]},
{q:["A student uses his knowledge of traffic rules, learnt in a lesson, while travelling. This learning objective is","పాఠంలో నేర్చుకున్న ట్రాఫిక్ నియమాల జ్ఞానాన్ని విద్యార్థి తన ప్రయాణంలో వినియోగించుకున్నాడు. ఇది ఈ అభ్యసన లక్ష్యాన్ని సూచిస్తుంది"],o:[["Analysing","విశ్లేషించడం"],["Applying","అనువర్తించడం"],["Evaluating","మూల్యాంకనం చేయడం"],["Understanding","అవగాహన చేసుకోవడం"]],a:1,
e:["Using learnt knowledge in a new, real situation is application.","నేర్చుకున్న జ్ఞానాన్ని కొత్త, నిజ పరిస్థితిలో వినియోగించడం అనువర్తనం."]},
{q:["Identify the academic standards of social sciences:\n(A) Conceptual understanding\n(B) Information skills\n(C) Responding to contemporary issues\n(D) Mapping skill","సాంఘిక శాస్త్ర విద్యా ప్రమాణాలను గుర్తించండి:\n(A) విషయావగాహన\n(B) సమాచార నైపుణ్యాలు\n(C) సమకాలీన అంశాలపై ప్రతిస్పందన\n(D) పట నైపుణ్యం"],o:[["A, B only","A, B మాత్రమే"],["B, D only","B, D మాత్రమే"],["A, B, C only","A, B, C మాత్రమే"],["A, B, C, D","A, B, C, D"]],a:3,
e:["The AP social studies academic standards include conceptual understanding, reading and reflecting on texts, information skills, reflection on contemporary issues, mapping skills, and appreciation and sensitivity. All four given are standards.","ఆంధ్రప్రదేశ్ సాంఘిక శాస్త్ర విద్యా ప్రమాణాలలో విషయావగాహన, పాఠ్యాంశాన్ని చదివి ప్రతిస్పందించడం, సమాచార నైపుణ్యాలు, సమకాలీన అంశాలపై ప్రతిస్పందన, పట నైపుణ్యాలు, ప్రశంస–సున్నితత్వం ఉన్నాయి. ఇచ్చిన నాలుగూ ప్రమాణాలే."]},
{q:["The concept of team teaching first originated in this country","జట్టు బోధన అనే భావన మొదట ఈ దేశంలో ఆవిర్భవించింది"],o:[["Germany","జర్మనీ"],["America","అమెరికా"],["India","భారతదేశం"],["England","ఇంగ్లాండ్"]],a:1,
e:["Team teaching began in the USA in the 1950s; Harvard University introduced it in 1955.","జట్టు బోధన 1950లలో అమెరికాలో మొదలైంది; 1955లో హార్వర్డ్ విశ్వవిద్యాలయం దీనిని ప్రవేశపెట్టింది."]},
{q:["These guide the overall purpose of education","విద్యకు మొత్తం మీద దిశానిర్దేశం చేసేవి"],o:[["Aims","ఆశయాలు"],["Objectives","లక్ష్యాలు"],["Goals","గమ్యాలు"],["Specifications","స్పష్టీకరణలు"]],a:0,
e:["Aims are broad, long-term statements that give direction to the whole of education. Objectives and specifications are narrower and classroom-level.","ఆశయాలు విస్తృతమైన, దీర్ఘకాలిక ప్రకటనలు; మొత్తం విద్యకు దిశానిర్దేశం చేస్తాయి. లక్ష్యాలు, స్పష్టీకరణలు తరగతి గది స్థాయిలోనివి."]},
{q:["Knowledge of how a person thinks and understands things is","ఒక వ్యక్తి ఎలా ఆలోచిస్తాడు, ఎలా అర్థం చేసుకుంటాడు అనే విషయాలకు సంబంధించిన జ్ఞానం"],o:[["Metacognitive knowledge","మెటా కాగ్నిటివ్ జ్ఞానం"],["Factual knowledge","వాస్తవాలకు సంబంధించిన జ్ఞానం"],["Conceptual knowledge","భావనా సంబంధిత జ్ఞానం"],["Procedural knowledge","విధానాత్మక జ్ఞానం"]],a:0,
e:["Metacognitive knowledge is 'thinking about thinking' — awareness of one's own learning and thinking.","మెటా కాగ్నిటివ్ జ్ఞానం అంటే 'ఆలోచన గురించి ఆలోచన' — తన స్వంత అభ్యసనం, ఆలోచనపై అవగాహన."]},
{q:["\"Study, travel and observation are the gateways to knowledge\" — stated by","\"అధ్యయనం, ప్రయాణం, పరిశీలన జ్ఞానానికి ద్వారాలు\" అని పేర్కొన్నవారు"],o:[["Dr. Samuel Johnson","డా. శామ్యూల్ జాన్సన్"],["Kilpatrick","కిల్‌పాట్రిక్"],["John Locke","జాన్ లాక్"],["John Dewey","జాన్ డ్యూయీ"]],a:0,
e:["As per the answer key, this statement is attributed to Dr Samuel Johnson.","జవాబు కీ ప్రకారం ఈ వాక్యం డా. శామ్యూల్ జాన్సన్‌ది."]},
{q:["These values develop in students by teaching social sciences:\n(A) Cultural values\n(B) Creative values\n(C) Aesthetic values","సాంఘిక శాస్త్ర బోధన వల్ల విద్యార్థులలో ఈ విలువలు అభివృద్ధి చెందుతాయి:\n(A) సాంస్కృతిక విలువలు\n(B) సృజనాత్మక విలువలు\n(C) సౌందర్యాత్మక విలువలు"],o:[["A, B, C","A, B, C"],["A, B only","A, B మాత్రమే"],["B, C only","B, C మాత్రమే"],["A, C only","A, C మాత్రమే"]],a:0,
e:["Social studies develops cultural, creative and aesthetic values — for example, appreciating monuments, art and the beauty of nature.","సాంఘిక శాస్త్రం సాంస్కృతిక, సృజనాత్మక, సౌందర్యాత్మక విలువలను పెంపొందిస్తుంది — ఉదాహరణకు కట్టడాలు, కళలు, ప్రకృతి సౌందర్యాన్ని ఆస్వాదించడం."]},
{q:["This approach is based on the idea that no subject can be taught comprehensively at the primary stage","ఏ శాస్త్రాన్నీ ప్రాథమిక స్థాయిలోనే సమగ్రంగా బోధించలేము అనే సూత్రంపై ఆధారపడిన ఉపగమం"],o:[["Concentric approach","ఏకకేంద్ర ఉపగమం"],["Spiral approach","సర్పిలాకార ఉపగమం"],["Correlation approach","సహసంబంధ ఉపగమం"],["Logical approach","తార్కిక ఉపగమం"]],a:1,
e:["As per the answer key: spiral approach. A topic is introduced simply at the primary stage and taken up again in higher classes with more depth, like a spiral.","జవాబు కీ ప్రకారం సర్పిలాకార ఉపగమం. ఒక అంశాన్ని ప్రాథమిక స్థాయిలో సరళంగా పరిచయం చేసి, పై తరగతుల్లో మరింత లోతుగా మళ్ళీ బోధిస్తారు — సర్పిలం (స్ప్రింగ్) లాగా."]},
{q:["The book 'A Revision of Bloom's Taxonomy' was written by","'ఎ రివిజన్ ఆఫ్ బ్లూమ్స్ టాక్సానమీ' పుస్తకాన్ని రచించినవారు"],o:[["Stevenson","స్టీవెన్‌సన్"],["Krathwohl","క్రాత్‌వోల్"],["W.H. Wesley","డబ్ల్యు.హెచ్. వెస్లీ"],["Godard","గొడార్డ్"]],a:1,
e:["David Krathwohl (with Lorin Anderson) revised Bloom's taxonomy (2001–2002).","డేవిడ్ క్రాత్‌వోల్ (లోరిన్ ఆండర్సన్‌తో) బ్లూమ్ వర్గీకరణను సవరించారు (2001–2002)."]},
{q:["He worked on the cognitive domain","జ్ఞానాత్మక రంగంపై కృషి చేసినవారు"],o:[["R.H. Dave","ఆర్.హెచ్. దవే"],["Benjamin Bloom","బెంజమిన్ బ్లూమ్"],["David R. Krathwohl","డేవిడ్ ఆర్. క్రాత్‌వోల్"],["Simpson","సింప్సన్"]],a:1,
e:["Benjamin Bloom (1956) classified the cognitive domain: knowledge, comprehension, application, analysis, synthesis, evaluation.","బెంజమిన్ బ్లూమ్ (1956) జ్ఞానాత్మక రంగాన్ని వర్గీకరించారు: జ్ఞానం, అవగాహన, అనువర్తనం, విశ్లేషణ, సంశ్లేషణ, మూల్యాంకనం."]},
{q:["Find the one related to the affective domain","భావావేశ రంగానికి చెందినదాన్ని కనుగొనండి"],o:[["Valuing","విలువ కట్టడం"],["Knowledge","జ్ఞానం"],["Analysis","విశ్లేషణ"],["Evaluation","మూల్యాంకనం"]],a:0,
e:["Krathwohl's affective domain: receiving, responding, valuing, organisation, characterisation. Knowledge, analysis and evaluation are cognitive.","క్రాత్‌వోల్ భావావేశ రంగం: గ్రహించడం, ప్రతిస్పందించడం, విలువ కట్టడం, వ్యవస్థీకరణ, శీలస్థాపన. జ్ఞానం, విశ్లేషణ, మూల్యాంకనం జ్ఞానాత్మక రంగానికి చెందినవి."]},
{q:["The word 'Civics' is derived from the Latin word 'Civitas'. 'Civitas' means","'సివిక్స్' అనే పదం 'సివిటాస్' అనే లాటిన్ పదం నుండి వచ్చింది. 'సివిటాస్' అంటే"],o:[["Citizen","పౌరుడు"],["City","నగరం"],["Door","తలుపు"],["Office","కార్యాలయం"]],a:1,
e:["'Civitas' means city (city-state); 'civis' means citizen. Civics is the study of citizens and their city/state.","'సివిటాస్' అంటే నగరం (నగర రాజ్యం); 'సివిస్' అంటే పౌరుడు. పౌరులు, వారి రాజ్యం గురించిన అధ్యయనమే పౌరశాస్త్రం."]},

{q:["This type of knowledge helps students actively think about the relationships between concepts","భావనల మధ్య అంతర సంబంధాల గురించి విద్యార్థులు చురుకుగా ఆలోచించడానికి ఉపయోగపడే జ్ఞానం"],o:[["Factual knowledge","వాస్తవాలకు సంబంధించిన జ్ఞానం"],["Procedural knowledge","విధానాత్మక జ్ఞానం"],["Conceptual knowledge","భావనా సంబంధిత జ్ఞానం"],["Metacognitive knowledge","మెటా కాగ్నిటివ్ జ్ఞానం"]],a:2,

e:["The project method (Kilpatrick, based on Dewey's ideas) follows learning by doing and learning by living, through real-life tasks.","ప్రాజెక్టు పద్ధతి (డ్యూయీ ఆలోచనల ఆధారంగా కిల్‌పాట్రిక్) నిజ జీవిత కార్యాల ద్వారా చేస్తూ నేర్చుకోవడం, జీవిస్తూ నేర్చుకోవడం అనే సూత్రాలను పాటిస్తుంది."]},
{q:["These methods are used to teach current affairs in social science:\n(A) Socialised recitation method\n(B) Topical method\n(C) Lecture method","సాంఘిక శాస్త్రంలో వర్తమాన వ్యవహారాలను బోధించడానికి ఉపయోగపడే పద్ధతులు:\n(A) సాంఘిక ఉద్గార పద్ధతి\n(B) శీర్షికా పద్ధతి\n(C) ఉపన్యాస పద్ధతి"],o:[["A, B only","A, B మాత్రమే"],["B, C only","B, C మాత్రమే"],["A, C only","A, C మాత్రమే"],["A, B and C","A, B మరియు C"]],a:3,

{q:["These maps are useful to know about climate, rainfall and natural vegetation","శీతోష్ణస్థితి, వర్షపాతం, సహజ వృక్షసంపద మొదలైన వాటి గురించి తెలుసుకోవడానికి ఉపయోగపడే పటాలు"],o:[["Political maps","రాజకీయ పటాలు"],["Flat maps","చదును పటాలు"],["Special purpose maps","ప్రత్యేక ప్రయోజన పటాలు"],["Physical maps","భౌతిక పటాలు"]],a:2,
e:["Special purpose (thematic) maps show one theme, such as rainfall, climate, vegetation, crops or population.","ప్రత్యేక ప్రయోజన (విషయ నిర్దేశిత) పటాలు వర్షపాతం, శీతోష్ణస్థితి, వృక్షసంపద, పంటలు, జనాభా వంటి ఒకే అంశాన్ని చూపుతాయి."]},
{q:["Identify the characteristics of models:\n(A) They are three-dimensional\n(B) They can be detached and attached\n(C) Students can prepare them themselves","నమూనాల లక్షణాలను గుర్తించండి:\n(A) ఇవి త్రిమితీయాలు\n(B) వీటిని విడదీసి తిరిగి కూర్చవచ్చు\n(C) విద్యార్థులు స్వయంగా తయారు చేసుకోవచ్చు"],o:[["A, B only","A, B మాత్రమే"],["B, C only","B, C మాత్రమే"],["A, C only","A, C మాత్రమే"],["A, B and C","A, B మరియు C"]],a:3,
e:["Models are three-dimensional, can often be taken apart and put together, and can be made by students. All three are correct.","నమూనాలు త్రిమితీయాలు, తరచుగా విడదీసి కూర్చవచ్చు, విద్యార్థులు స్వయంగా తయారుచేయవచ్చు. మూడూ సరైనవే."]},
{q:["The word 'Curriculum' is derived from the Latin word 'Currere'. 'Currere' means","'కరిక్యులం' అనే పదం లాటిన్ భాషలోని 'క్యూరేర్' నుండి వచ్చింది. 'క్యూరేర్' అంటే"],o:[["Book","పుస్తకం"],["Run","పరుగు"],["Student","విద్యార్థి"],["Remembering","గుర్తుపెట్టుకోవడం"]],a:1,
e:["'Currere' means 'to run' — the curriculum is the course (race track) a learner runs to reach the goals of education.","'క్యూరేర్' అంటే 'పరుగెత్తడం' — విద్యా లక్ష్యాలను చేరుకోవడానికి విద్యార్థి పయనించే మార్గమే పాఠ్యప్రణాళిక."]},
{q:["These charts are useful to explain the events of any one movement","ఏదైనా ఒక ఉద్యమ కాలంలో జరిగిన సంఘటనలను వివరించడానికి ఉపయోగపడే చార్టు"],o:[["Tabular chart","పట్టిక చార్టు"],["Chronological chart","కాలక్రమ చార్టు"],["Diagrammatic chart","రేఖాచిత్ర చార్టు"],["Pictorial chart","సచిత్ర చార్టు"]],a:1,
e:["A chronological (time-line) chart shows events in the order they happened, e.g. the stages of the freedom movement.","కాలక్రమ (కాలరేఖ) చార్టు సంఘటనలను జరిగిన క్రమంలో చూపుతుంది — ఉదా: స్వాతంత్ర్యోద్యమ దశలు."]},
{q:["\"Audio-visual aids help in completing the learning triangle — motivation, classification, stimulation\" — stated by","\"ప్రేరణ, వర్గీకరణ, ఉద్దీపన అనే అభ్యసన త్రికోణాన్ని పూర్తి చేయడానికి దృశ్య-శ్రవణ ఉపకరణాలు సహాయపడతాయి\" అని పేర్కొన్నవారు"],o:[["Edgar Dale","ఎడ్గార్ డేల్"],["C.V. Good","సి.వి. గుడ్"],["J.B. Shaw","జె.బి. షా"],["M.C. Moffat","ఎం.సి. మోఫాట్"]],a:1,
e:["As per the answer key, this statement is by C.V. Good. (Edgar Dale is known for the 'Cone of Experience'.)","జవాబు కీ ప్రకారం ఈ వాక్యం సి.వి. గుడ్‌ది. (ఎడ్గార్ డేల్ 'అనుభవ శంఖువు'కు ప్రసిద్ధి.)"]},
{q:["Pictures and charts are related to this teaching aid","చిత్రాలు, చార్టులు ఈ బోధనోపకరణానికి చెందినవి"],o:[["Graphic aids","రేఖీయ ఉపకరణాలు"],["Three-dimensional aids","త్రిమితీయ ఉపకరణాలు"],["Projected aids","ప్రక్షేపణ ఉపకరణాలు"],["Audio aids","శ్రవణ ఉపకరణాలు"]],a:0,
e:["Pictures, charts, graphs, diagrams and posters are graphic aids.","చిత్రాలు, చార్టులు, గ్రాఫ్‌లు, రేఖాచిత్రాలు, పోస్టర్లు రేఖీయ (గ్రాఫిక్) ఉపకరణాలు."]},
{q:["\"Evaluation is the process of determining the extent to which educational objectives have been achieved\" — stated by","\"విద్యా లక్ష్యాలు ఎంతవరకు సాధించబడ్డాయో తెలుసుకునే విధానమే మూల్యాంకనం\" అని పేర్కొన్నవారు"],o:[["NCERT","NCERT"],["SCERT of Gujarat","గుజరాత్ SCERT"],["Ralph Tyler","రాల్ఫ్ టైలర్"],["Gronlund","గ్రాన్‌లండ్"]],a:2,
e:["Ralph Tyler, the 'father of educational evaluation', defined evaluation in terms of how far objectives are achieved.","'విద్యా మూల్యాంకన పితామహుడు' రాల్ఫ్ టైలర్ లక్ష్యాలు ఎంతవరకు సాధించబడ్డాయనే దృష్టితో మూల్యాంకనాన్ని నిర్వచించారు."]},
{q:["In this method, the learner forms a generalisation by moving from specific examples to a general rule","ఈ పద్ధతిలో అభ్యాసకుడు ప్రత్యేక ఉదాహరణల నుండి సాధారణ సూత్రానికి చేరుకుంటాడు"],o:[["Inductive","ఆగమన"],["Deductive","నిగమన"],["Analysis","విశ్లేషణ"],["Synthesis","సంశ్లేషణ"]],a:0,
e:["Inductive method: examples → rule (specific to general). Deductive method: rule → examples (general to specific).","ఆగమన పద్ధతి: ఉదాహరణలు → సూత్రం (ప్రత్యేకం నుండి సాధారణం). నిగమన పద్ధతి: సూత్రం → ఉదాహరణలు (సాధారణం నుండి ప్రత్యేకం)."]},
{q:["Find the correct answer regarding a 'Test':\n(A) Test at a low level\n(B) Very short span\n(C) Conducted on a very small syllabus","'పరీక్ష (టెస్ట్)'కు సంబంధించి సరైన సమాధానం కనుగొనండి:\n(A) చిన్న స్థాయి పరీక్ష\n(B) చాలా తక్కువ నిడివి\n(C) చాలా తక్కువ సిలబస్‌పై నిర్వహిస్తారు"],o:[["A, B, C","A, B, C"],["A, B only","A, B మాత్రమే"],["B, C only","B, C మాత్రమే"],["A, C only","A, C మాత్రమే"]],a:0,
e:["A test is smaller than an examination — low level, short duration and on a small portion of the syllabus. All three apply.","టెస్ట్ పరీక్ష కంటే చిన్నది — చిన్న స్థాయి, తక్కువ సమయం, తక్కువ సిలబస్. మూడూ వర్తిస్తాయి."]},
{q:["It is also called initial evaluation","దీనిని ప్రారంభ మూల్యాంకనం అని కూడా పిలుస్తారు"],o:[["Diagnostic evaluation","లోపనిర్ధారణ మూల్యాంకనం"],["Formative evaluation","నిర్మాణాత్మక మూల్యాంకనం"],["Summative evaluation","సంగ్రహణాత్మక మూల్యాంకనం"],["Placement evaluation","స్థానీకరణ మూల్యాంకనం"]],a:3,
e:["Placement evaluation is done at the start of instruction to find the student's entry level, so it is called initial evaluation.","విద్యార్థి ప్రారంభ స్థాయిని తెలుసుకోవడానికి బోధన మొదట్లో చేసేది స్థానీకరణ మూల్యాంకనం; అందుకే దీనిని ప్రారంభ మూల్యాంకనం అంటారు."]},
{q:["This is not a feature of evaluation","మూల్యాంకన లక్షణం కానిది"],o:[["It is meant only for promoting students to the next class","ఇది విద్యార్థులను తర్వాతి తరగతికి పంపడానికి మాత్రమే ఉద్దేశించినది"],["It is scientific","ఇది శాస్త్రీయమైనది"],["It measures teaching objectives","ఇది బోధనా లక్ష్యాలను మాపనం చేస్తుంది"],["It is a part of teaching","ఇది బోధనలో ఒక భాగం"]],a:0,
e:["Evaluation is not only for promotion; it helps improve learning and teaching, diagnose weaknesses and guide students.","మూల్యాంకనం కేవలం తరగతి మార్పిడి కోసం కాదు; అభ్యసన, బోధనను మెరుగుపరచడానికి, లోపాలను గుర్తించడానికి, మార్గదర్శనానికి ఉపయోగపడుతుంది."]},
{q:["Children's participation and reflection tools are used in this type of assessment","పిల్లల భాగస్వామ్యం – ప్రతిస్పందనలు అనే సాధనాన్ని ఈ మదింపులో ఉపయోగిస్తారు"],o:[["Quantitative assessment","పరిమాణాత్మక మూల్యాంకనం"],["Linear assessment","రేఖీయ మూల్యాంకనం"],["Formative assessment","నిర్మాణాత్మక మూల్యాంకనం"],["Summative assessment","సంగ్రహణాత్మక మూల్యాంకనం"]],a:2,
e:["In AP's formative assessment, the tools are: children's participation and reflections, written works, project works and slip tests.","ఆంధ్రప్రదేశ్ నిర్మాణాత్మక మూల్యాంకన సాధనాలు: పిల్లల భాగస్వామ్యం–ప్రతిస్పందనలు, రాత అంశాలు, ప్రాజెక్టు పనులు, లఘు పరీక్ష."]},
{q:["Continuous Comprehensive Evaluation was proposed by","నిరంతర సమగ్ర మూల్యాంకనాన్ని ప్రతిపాదించినది"],o:[["Kothari Commission","కొఠారి కమిషన్"],["Secondary Education Commission","మాధ్యమిక విద్యా కమిషన్"],["Radhakrishnan Commission","రాధాకృష్ణన్ కమిషన్"],["Sri Prakash Commission","శ్రీ ప్రకాష్ కమిషన్"]],a:0,
e:["As per the answer key, the Kothari Commission (1964–66) first recommended continuous and comprehensive evaluation; later NPE 1986 and the RTE Act 2009 adopted it.","జవాబు కీ ప్రకారం కొఠారి కమిషన్ (1964–66) మొదట నిరంతర సమగ్ర మూల్యాంకనాన్ని సిఫార్సు చేసింది; తర్వాత జాతీయ విద్యా విధానం 1986, విద్యా హక్కు చట్టం 2009 దీనిని స్వీకరించాయి."]},
{q:["The characteristics of evaluation:\n(A) It is a continuous process\n(B) It is integrated\n(C) It is student-centric","మూల్యాంకన లక్షణాలు:\n(A) ఇది నిరంతర ప్రక్రియ\n(B) ఇది సమగ్రమైనది\n(C) ఇది విద్యార్థి కేంద్రీకృతమైనది"],o:[["A, C only","A, C మాత్రమే"],["A, B only","A, B మాత్రమే"],["B, C only","B, C మాత్రమే"],["A, B and C","A, B మరియు C"]],a:3,
e:["Evaluation is continuous, comprehensive (integrated) and centred on the student. All three are correct.","మూల్యాంకనం నిరంతరం, సమగ్రం, విద్యార్థి కేంద్రీకృతం. మూడూ సరైనవే."]},
{q:["Choose the correct answer regarding a 'short test':\n(A) No need to prepare a special question paper and time table\n(B) The teacher can conduct it whenever needed\n(C) Questions need not be only from the textbook","'లఘు పరీక్ష'కు సంబంధించి సరైన సమాధానం కనుగొనండి:\n(A) ప్రత్యేక ప్రశ్నపత్రం, టైమ్ టేబుల్ అవసరం లేదు\n(B) ఉపాధ్యాయుడు అవసరమైనప్పుడు నిర్వహించవచ్చు\n(C) ప్రశ్నలు పాఠ్యపుస్తకం నుండే ఇవ్వాల్సిన అవసరం లేదు"],o:[["A, B only","A, B మాత్రమే"],["B, C only","B, C మాత్రమే"],["A, C only","A, C మాత్రమే"],["A, B and C","A, B మరియు C"]],a:3,
e:["A short (slip) test is informal: no special paper or timetable, held whenever the teacher wants, and questions can test thinking beyond the textbook. All three are correct.","లఘు (స్లిప్) పరీక్ష అనధికారికం: ప్రత్యేక పేపర్, టైమ్ టేబుల్ అవసరం లేదు, ఉపాధ్యాయుడు ఎప్పుడైనా నిర్వహించవచ్చు, పాఠ్యపుస్తకానికి బయటి ఆలోచనను కూడా పరీక్షించవచ్చు. మూడూ సరైనవే."]},
{q:["These questions give more importance to memory","జ్ఞాపకశక్తికి ఎక్కువ ప్రాధాన్యత ఇచ్చే ప్రశ్నలు"],o:[["Short answer","లఘు సమాధాన ప్రశ్నలు"],["Objective","లక్ష్యాత్మక ప్రశ్నలు"],["Multiple answer","బహుళ సమాధాన ప్రశ్నలు"],["Essay","వ్యాసరూప ప్రశ్నలు"]],a:3,
e:["As per the answer key: essay questions. The student must recall and reproduce a large amount of content from memory, which is a known limitation of essay-type questions.","జవాబు కీ ప్రకారం వ్యాసరూప ప్రశ్నలు. వీటిలో విద్యార్థి ఎక్కువ విషయాన్ని జ్ఞాపకం నుండి గుర్తు చేసుకుని రాయాలి; ఇది వ్యాసరూప ప్రశ్నల పరిమితి."]},
{q:["PARAKH is related to","పరఖ్ (PARAKH) దేనికి సంబంధించినది"],o:[["Lesson plan","పాఠ్య ప్రణాళిక"],["Curriculum","పాఠ్యప్రణాళిక (కరిక్యులం)"],["Evaluation","మూల్యాంకనం"],["Aims and objectives","ఆశయాలు, లక్ష్యాలు"]],a:2,
e:["PARAKH (Performance Assessment, Review and Analysis of Knowledge for Holistic Development) is the national assessment centre set up under NCERT as per NEP 2020.","PARAKH (సమగ్రాభివృద్ధి కోసం జ్ఞాన పనితీరు మదింపు, సమీక్ష, విశ్లేషణ) జాతీయ విద్యా విధానం 2020 ప్రకారం NCERT కింద ఏర్పడిన జాతీయ మూల్యాంకన కేంద్రం."]},
{q:["Continuous comprehensive evaluation is essential for school education — suggested by","పాఠశాల విద్యలో నిరంతర సమగ్ర మూల్యాంకనం అవసరమని సూచించినది"],o:[["Chattopadhyaya Committee","చటోపాధ్యాయ కమిటీ"],["Kothari Commission","కొఠారి కమిషన్"],["Radhakrishnan Commission","రాధాకృష్ణన్ కమిషన్"],["Sri Prakash Commission","శ్రీ ప్రకాష్ కమిషన్"]],a:1,

{q:["A quantitative evaluation tool","పరిమాణాత్మక మూల్యాంకన సాధనం"],o:[["Interview","ఇంటర్వ్యూ"],["Practical-based exam","ప్రాక్టికల్ ఆధారిత పరీక్ష"],["Check list","చెక్ లిస్ట్"],["Observation","పరిశీలన"]],a:1,
e:["Tests and exams (written, oral, practical) give marks — they are quantitative tools. Interviews, check lists and observation are qualitative tools.","రాత, మౌఖిక, ప్రాక్టికల్ పరీక్షలు మార్కులు ఇస్తాయి — ఇవి పరిమాణాత్మక సాధనాలు. ఇంటర్వ్యూ, చెక్ లిస్ట్, పరిశీలన గుణాత్మక సాధనాలు."]},
{q:["Number of tools used in formative evaluation","నిర్మాణాత్మక మూల్యాంకనంలో ఉపయోగించే సాధనాల సంఖ్య"],o:[["5","5"],["4","4"],["3","3"],["2","2"]],a:1,
e:["Four tools: (1) children's participation and reflections, (2) written works, (3) project works, (4) slip test.","నాలుగు సాధనాలు: (1) పిల్లల భాగస్వామ్యం–ప్రతిస్పందనలు, (2) రాత అంశాలు, (3) ప్రాజెక్టు పనులు, (4) లఘు పరీక్ష."]},
{q:["This is an example of an essay-type question","ఇది వ్యాసరూప ప్రశ్నకు ఒక ఉదాహరణ"],o:[["Identify the capital city of India from the given below","కింది వాటిలో భారత రాజధానిని గుర్తించండి"],["The birth place of river Godavari ______","గోదావరి నది జన్మస్థానం ______"],["Kanchenjunga is the world's highest peak — Yes / No","ప్రపంచంలో ఎత్తైన శిఖరం కాంచనగంగ — అవును / కాదు"],["Explain the differences between plateaus and plains","పీఠభూములకు, మైదానాలకు మధ్య గల భేదాలను వివరించండి"]],a:3,
e:["'Explain the differences…' needs a long, organised answer — an essay question. The others are multiple choice, fill in the blank and true/false (objective).","'భేదాలను వివరించండి' అనే ప్రశ్నకు దీర్ఘమైన, క్రమబద్ధమైన జవాబు కావాలి — ఇది వ్యాసరూప ప్రశ్న. మిగతావి బహుళైచ్ఛిక, ఖాళీలు పూరించడం, అవును/కాదు (లక్ష్యాత్మక) ప్రశ్నలు."]},
{q:["Identify the aim of continuous comprehensive evaluation","నిరంతర సమగ్ర మూల్యాంకనం ముఖ్య ఉద్దేశాన్ని గుర్తించండి"],o:[["Make evaluation a part of learning","మూల్యాంకనాన్ని అభ్యసనలో భాగం చేయడం"],["Make the whole teaching-learning process teacher-centric","బోధనాభ్యసన ప్రక్రియను ఉపాధ్యాయ కేంద్రితం చేయడం"],["Increase rote learning culture","బట్టీ సంస్కృతిని పెంచడం"],["Give more homework","ఇంటి పనిని ఎక్కువగా ఇవ్వడం"]],a:0,
e:["CCE makes assessment a part of everyday learning, reduces rote learning and exam stress, and keeps the process child-centred.","నిరంతర సమగ్ర మూల్యాంకనం మదింపును రోజువారీ అభ్యసనలో భాగం చేస్తుంది, బట్టీ విధానాన్ని, పరీక్షల ఒత్తిడిని తగ్గిస్తుంది, ప్రక్రియను శిశు కేంద్రితం చేస్తుంది."]},
{q:["It is also called problem-identification evaluation","దీనిని సమస్యా నిర్ధారణ మూల్యాంకనం అని కూడా పిలుస్తారు"],o:[["Diagnostic evaluation","లోపనిర్ధారణ మూల్యాంకనం"],["Placement evaluation","స్థానీకరణ మూల్యాంకనం"],["Formative evaluation","నిర్మాణాత్మక మూల్యాంకనం"],["Summative evaluation","సంగ్రహణాత్మక మూల్యాంకనం"]],a:0,
e:["Diagnostic evaluation finds the specific learning difficulties of students and their causes, so that remedial teaching can follow.","లోపనిర్ధారణ మూల్యాంకనం విద్యార్థుల నిర్దిష్ట అభ్యసన లోపాలను, వాటి కారణాలను గుర్తిస్తుంది; దాని తర్వాత పరిహార బోధన చేస్తారు."]},
{q:["Identify the characteristics of summative evaluation:\na. It is the outcome of learning\nb. Final in nature\nc. It occurs after instruction","సంగ్రహణాత్మక మూల్యాంకన లక్షణాలను గుర్తించండి:\na. ఇది అభ్యసన ఫలితం\nb. అంత్య స్వభావం కలిగి ఉంటుంది\nc. బోధనానంతరం జరుగుతుంది"],o:[["a, b","a, b"],["b, c","b, c"],["a, c","a, c"],["a, b, c","a, b, c"]],a:3,
e:["Summative evaluation is done at the end of a term or course, after teaching, to judge the final learning outcome. All three are correct.","సంగ్రహణాత్మక మూల్యాంకనాన్ని బోధన తర్వాత, సెమిస్టర్ లేదా కోర్సు చివర తుది అభ్యసన ఫలితాన్ని నిర్ణయించడానికి చేస్తారు. మూడూ సరైనవే."]}
];
const BASE=300;

const UI={
 en:{q:"Question",of:"of",score:"Score",prev:"◀ Previous",next:"Next ▶",finish:"See result",right:"Correct!",wrong:"Wrong. Correct answer:",map:"Question map",lr:"Correct",lw:"Wrong",lu:"Not answered",done:"Quiz complete",again:"Start again",att:"Answered"},
 te:{q:"ప్రశ్న",of:"/",score:"స్కోరు",prev:"◀ వెనుకకు",next:"తర్వాత ▶",finish:"ఫలితం చూడండి",right:"సరైన సమాధానం!",wrong:"తప్పు. సరైన సమాధానం:",map:"ప్రశ్నల పటం",lr:"సరైనవి",lw:"తప్పులు",lu:"జవాబు ఇవ్వనివి",done:"క్విజ్ పూర్తయింది",again:"మళ్ళీ ప్రారంభించండి",att:"జవాబిచ్చినవి"}
};
let lang="both",cur=0,ans=Array(Q.length).fill(null),showResult=false;
try{const s=JSON.parse(localStorage.getItem("tet2a-soc7")||"null");if(s){lang=s.lang||lang;cur=s.cur||0;if(Array.isArray(s.ans)&&s.ans.length===Q.length)ans=s.ans;}}catch(e){}
const save=()=>{try{localStorage.setItem("tet2a-soc7",JSON.stringify({lang,cur,ans}))}catch(e){}};
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function bi(p){ // p=[en,te]
  if(lang==="en")return `<span class="en">${esc(p[0])}</span>`;
  if(lang==="te")return `<span class="te">${esc(p[1])}</span>`;
  return p[0]===p[1]?`<span class="en">${esc(p[0])}</span>`:`<span class="en">${esc(p[0])}</span><span class="te">${esc(p[1])}</span>`;
}
function lbl(k){ if(lang==="en")return UI.en[k]; if(lang==="te")return UI.te[k]; return UI.te[k]+" / "+UI.en[k]; }
const K=["A","B","C","D"];
function render(){
  document.querySelectorAll(".langs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===lang));
  const done=ans.filter(x=>x!==null).length, right=ans.filter((x,i)=>x===Q[i].a).length;
  document.getElementById("s-pos").innerHTML=`${lbl("att")}: <b>${done}/${Q.length}</b>`;
  document.getElementById("s-score").innerHTML=`${lbl("score")}: <b>${right}</b>`;
  document.getElementById("s-bar").style.width=(done/Q.length*100)+"%";
  const card=document.getElementById("card");
  if(showResult){
    const wrong=done-right;
    card.className="card result";
    card.innerHTML=`<div class="qno">${lbl("done")}</div><div class="big">${right} / ${Q.length}</div>
      <div>${lbl("lr")}: <b>${right}</b> · ${lbl("lw")}: <b>${wrong}</b> · ${lbl("lu")}: <b>${Q.length-done}</b></div>
      <div class="nav" style="justify-content:center"><button id="again">${lbl("again")}</button></div>`;
    document.getElementById("again").onclick=()=>{ans=Array(Q.length).fill(null);cur=0;showResult=false;save();render();};
  } else {
    card.className="card";
    const q=Q[cur],picked=ans[cur];
    let h=`<div class="qno">${lbl("q")} ${BASE+cur+1} / ${BASE+Q.length}</div><div class="qtext">${bi(q.q)}</div>`;
    if(q.m){
      const mh=q.mh||[["Colour","రంగు"],["Feature","స్వరూపం"]];const hd=k=>lang==="en"?mh[k][0]:lang==="te"?mh[k][1]:mh[k][0]+" / "+mh[k][1];
      const cell=p=>lang==="en"?esc(p[0]):lang==="te"?`<span style="font-family:var(--f-te)">${esc(p[1])}</span>`:`${esc(p[0])}<small>${esc(p[1])}</small>`;
      h+=`<div class="mtab"><table><thead><tr><th>${hd(0)}</th><th>${hd(1)}</th></tr></thead><tbody>`+
         q.m.map(r=>`<tr><td>${cell(r[0])}</td><td>${cell(r[1])}</td></tr>`).join("")+`</tbody></table></div>`;
    }
    h+=`<div class="opts">`+q.o.map((o,i)=>{
      let c="";if(picked!==null){if(i===q.a)c="right";else if(i===picked)c="wrong";}
      return `<button class="opt ${c}" id="opt${i}" data-i="${i}" ${picked!==null?"disabled":""}><span class="k">${K[i]}</span><span class="t">${bi(o)}</span></button>`;
    }).join("")+`</div>`;
    if(picked!==null){
      const ok=picked===q.a;
      const v=ok?`<span class="verdict ok">✔ ${lbl("right")}</span>`:`<span class="verdict no">✘ ${lbl("wrong")} ${K[q.a]}</span>`;
      h+=`<div class="exp">${v}${bi(q.e)}</div>`;
    }
    const last=cur===Q.length-1;
    h+=`<div class="nav"><button class="ghost" id="prev" ${cur===0?"disabled":""}>${lbl("prev")}</button><button id="next">${last?lbl("finish"):lbl("next")}</button></div>`;
    card.innerHTML=h;
    card.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ans[cur]=+b.dataset.i;save();render();});
    document.getElementById("prev").onclick=()=>{cur--;save();render();};
    document.getElementById("next").onclick=()=>{if(last){showResult=true;}else cur++;save();render();window.scrollTo({top:0,behavior:"smooth"});};
  }
  document.getElementById("map-h").textContent=lbl("map");
  document.getElementById("legend").innerHTML=`<span style="--c:var(--ok)">${lbl("lr")}</span><span style="--c:var(--bad)">${lbl("lw")}</span><span style="--c:var(--line)">${lbl("lu")}</span>`;
  const g=document.getElementById("grid");
  g.innerHTML=Q.map((q,i)=>{let c=ans[i]===null?"":ans[i]===q.a?"r":"w";if(i===cur&&!showResult)c+=" cur";return `<button class="${c}" data-i="${i}" aria-label="Q ${BASE+i+1}">${BASE+i+1}</button>`}).join("");
  g.querySelectorAll("button").forEach(b=>b.onclick=()=>{cur=+b.dataset.i;showResult=false;save();render();document.getElementById("card").scrollIntoView({behavior:"smooth",block:"start"});});
}
document.querySelectorAll(".langs button").forEach(b=>b.onclick=()=>{lang=b.dataset.l;save();render();});
render();
</script>
