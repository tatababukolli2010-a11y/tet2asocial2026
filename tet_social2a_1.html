<!doctype html>
<html lang="te">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TET 2A Social Quiz 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&family=Noto+Sans:wght@400;600&family=Noto+Sans+Telugu:wght@400;600;700&family=Ramabhadra&display=swap">
<style>
/* Layout: a single atlas-sheet column — teacher header, quiz card, question map grid, credit footer */
:root{
  --paper:#f4f6f1; --sheet:#ffffff; --ink:#1d3442; --muted:#5b6d72; --line:#d7dfd8;
  --accent:#b8742a; --accent-soft:#f6ead9; --sea:#2c6e7f; --sea-soft:#e2eff1;
  --ok:#2f7d4a; --ok-soft:#e3f2e7; --bad:#b23b33; --bad-soft:#f8e3e1;
  --c1:#f26b00; --c2:#00897b; --c3:#7b3fe4; --c4:#e0245e; --on-hero:#ffffff;
  --hero:linear-gradient(120deg,#ff8a1f 0%,#e8405f 50%,#8a3ee0 100%);
  --f-display:"Bitter","Ramabhadra",Georgia,serif;
  --f-te:"Noto Sans Telugu","Noto Sans",system-ui,sans-serif;
  --f-body:"Noto Sans","Noto Sans Telugu",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#111a1f; --sheet:#18242b; --ink:#e5ece8; --muted:#9db0b2; --line:#2c3b42;
  --accent:#e0a35a; --accent-soft:#3a2c1b; --sea:#7fc0cf; --sea-soft:#1c3239;
  --ok:#6fcf8e; --ok-soft:#173326; --bad:#f08b80; --bad-soft:#3b1e1c; --c1:#ffa04d; --c2:#4fd3c3; --c3:#b590ff; --c4:#ff6f9a; --hero:linear-gradient(120deg,#c25a0c 0%,#a82a4a 50%,#5b2aa3 100%); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111a1f; --sheet:#18242b; --ink:#e5ece8; --muted:#9db0b2; --line:#2c3b42;
  --accent:#e0a35a; --accent-soft:#3a2c1b; --sea:#7fc0cf; --sea-soft:#1c3239;
  --ok:#6fcf8e; --ok-soft:#173326; --bad:#f08b80; --bad-soft:#3b1e1c; --c1:#ffa04d; --c2:#4fd3c3; --c3:#b590ff; --c4:#ff6f9a; --hero:linear-gradient(120deg,#c25a0c 0%,#a82a4a 50%,#5b2aa3 100%); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:18px 28px;display:flex;flex-direction:column;gap:16px}
header.top{display:flex;align-items:center;gap:16px;background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
header.top img{width:84px;height:88px;object-fit:cover;border-radius:12px;border:3px solid var(--accent);flex:none}
.ht{min-width:0;display:flex;flex-direction:column;gap:2px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}
h1{font-family:var(--f-display);font-size:clamp(20px,4.6vw,26px);line-height:1.2;margin:0;text-wrap:balance}
.sub{font-family:var(--f-te);color:var(--muted);font-size:14px}
.langs{display:flex;flex-wrap:wrap;gap:8px}
.langs button{font:600 14px var(--f-te);padding:8px 14px;border-radius:999px;border:1.5px solid var(--sea);background:transparent;color:var(--sea);cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--sea);color:var(--sheet)}
.status{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.status b{color:var(--ink)}
.bar{flex:1 1 160px;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:18px 16px;display:flex;flex-direction:column;gap:14px}
.qno{font-family:var(--f-display);color:var(--accent);font-size:15px}
.qtext{display:flex;flex-direction:column;gap:4px;white-space:pre-line}
.qtext .en{font-size:17px;font-weight:600}
.qtext .te{font-family:var(--f-te);font-size:17px;font-weight:600}
.qtext .en+.te{font-weight:400;color:var(--muted);font-size:16px}
.mtab{overflow-x:auto}
.mtab table{border-collapse:collapse;width:100%;font-size:15px}
.mtab th,.mtab td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.mtab th{background:var(--sea-soft);color:var(--sea);font-weight:600}
.mtab small{display:block;font-family:var(--f-te);color:var(--muted)}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--sheet);color:var(--ink);font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--sea);background:var(--sea-soft)}
.opt:focus-visible,.langs button:focus-visible,.nav button:focus-visible,.grid button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--sea-soft);color:var(--sea);font-weight:700;font-size:14px}
.opt .t{min-width:0;display:flex;flex-direction:column}
.opt .t .te{font-family:var(--f-te)}
.opt .t .en+.te{color:var(--muted);font-size:15px}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);color:var(--sheet)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:var(--sheet)}
.exp{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.exp .verdict{font-weight:700}
.exp .verdict.ok{color:var(--ok)} .exp .verdict.no{color:var(--bad)}
.exp .te{font-family:var(--f-te)}
.nav{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.nav button{font:600 15px var(--f-te);padding:10px 18px;border-radius:10px;border:none;background:var(--ink);color:var(--sheet);cursor:pointer}
.nav button.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.nav button:disabled{opacity:.4;cursor:default}
.mapcard{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.mapcard h2{font-family:var(--f-display);font-size:16px;margin:0}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.grid button{aspect-ratio:1;max-width:100%;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:600 13px var(--f-body);cursor:pointer;font-variant-numeric:tabular-nums;padding:0}
.grid button.r{background:var(--ok);color:var(--sheet);border-color:var(--ok)}
.grid button.w{background:var(--bad);color:var(--sheet);border-color:var(--bad)}
.grid button.cur{outline:2px solid var(--accent);outline-offset:1px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.result{text-align:center;align-items:center}
.result .big{font-family:var(--f-display);font-size:44px;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1}

/* ---- colourful layer ---- */
body{background:
  radial-gradient(600px 400px at 0% 0%,color-mix(in srgb,var(--c1) 16%,transparent),transparent 70%),
  radial-gradient(600px 420px at 100% 30%,color-mix(in srgb,var(--c3) 14%,transparent),transparent 70%),
  radial-gradient(700px 500px at 20% 100%,color-mix(in srgb,var(--c2) 14%,transparent),transparent 70%),
  var(--paper);background-attachment:fixed}
header.top{background:var(--hero);border:none;color:var(--on-hero);box-shadow:0 10px 26px -12px color-mix(in srgb,var(--c4) 60%,transparent)}
header.top img{border:3px solid var(--on-hero);box-shadow:0 0 0 4px color-mix(in srgb,var(--on-hero) 35%,transparent)}
header.top .eyebrow{color:var(--on-hero);opacity:.9}
header.top .sub{color:var(--on-hero);opacity:.92}
.langs button:nth-child(1){--lc:var(--c1)} .langs button:nth-child(2){--lc:var(--c4)} .langs button:nth-child(3){--lc:var(--c2)}
.langs button{border-color:var(--lc);color:var(--lc);background:color-mix(in srgb,var(--lc) 8%,var(--sheet))}
.langs button[aria-pressed="true"]{background:var(--lc);color:var(--sheet)}
.bar{height:10px}
.bar i{background:linear-gradient(90deg,var(--c1),var(--c4),var(--c3))}
.status b{color:var(--c3)}
.card{border:none;border-top:6px solid transparent;background:linear-gradient(var(--sheet),var(--sheet)) padding-box,linear-gradient(90deg,var(--c1),var(--c4),var(--c3),var(--c2)) border-box;box-shadow:0 8px 24px -14px color-mix(in srgb,var(--c3) 50%,transparent)}
.qno{display:inline-block;align-self:flex-start;background:color-mix(in srgb,var(--c1) 14%,var(--sheet));color:var(--c1);padding:3px 12px;border-radius:999px}
.opts .opt:nth-child(1){--oc:var(--c1)} .opts .opt:nth-child(2){--oc:var(--c2)} .opts .opt:nth-child(3){--oc:var(--c3)} .opts .opt:nth-child(4){--oc:var(--c4)}
.opt{border-color:color-mix(in srgb,var(--oc) 35%,var(--line));background:color-mix(in srgb,var(--oc) 5%,var(--sheet))}
.opt .k{background:var(--oc);color:var(--sheet)}
.opt:hover:not(:disabled){border-color:var(--oc);background:color-mix(in srgb,var(--oc) 13%,var(--sheet))}
.opt.right{border-color:var(--ok);background:var(--ok-soft)} .opt.right .k{background:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)} .opt.wrong .k{background:var(--bad)}
.exp{border-left-color:var(--c3);background:color-mix(in srgb,var(--c3) 10%,var(--sheet))}
.mtab th{background:color-mix(in srgb,var(--c2) 16%,var(--sheet));color:var(--c2)}
.nav button{background:linear-gradient(120deg,var(--c4),var(--c3));color:var(--on-hero)}
.nav button.ghost{background:color-mix(in srgb,var(--c2) 8%,var(--sheet));color:var(--c2);border-color:var(--c2)}
.mapcard{border:none;box-shadow:0 8px 24px -16px color-mix(in srgb,var(--c2) 60%,transparent)}
.mapcard h2{color:var(--c2)}
.grid button:nth-child(4n+1){--gc:var(--c1)} .grid button:nth-child(4n+2){--gc:var(--c2)} .grid button:nth-child(4n+3){--gc:var(--c3)} .grid button:nth-child(4n){--gc:var(--c4)}
.grid button{border-color:color-mix(in srgb,var(--gc) 45%,var(--line));background:color-mix(in srgb,var(--gc) 9%,var(--sheet));color:var(--gc)}
.grid button.r{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.grid button.w{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.grid button.cur{outline:3px solid var(--c4)}
.result .big{background:linear-gradient(90deg,var(--c1),var(--c4),var(--c3));-webkit-background-clip:text;background-clip:text;color:transparent}
footer{border-top:none;background:var(--hero);color:var(--on-hero);border-radius:14px;padding:14px 16px}
footer b{color:var(--on-hero)}
footer{text-align:center;font-family:var(--f-te);font-size:15px;color:var(--muted);border-top:1px dashed var(--line);padding-top:14px}
footer b{color:var(--ink)}
footer{color:var(--on-hero);border-top:none;background:var(--hero);border-radius:14px;padding:14px 16px} footer b{color:var(--on-hero)}
@media (max-width:480px){.grid{grid-template-columns:repeat(8,1fr)} header.top img{width:70px;height:74px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---- larger text ---- */
body{font-size:18px;line-height:1.6}
.wrap{max-width:820px;gap:18px}
.eyebrow{font-size:13.5px}
h1{font-size:clamp(23px,5.4vw,30px)}
.sub{font-size:16.5px}
header.top img{width:96px;height:100px}
.langs button{font-size:16.5px;padding:10px 18px}
.status{font-size:16.5px}
.qno{font-size:17px}
.qtext .en,.qtext .te{font-size:21px;line-height:1.55}
.qtext .en+.te{font-size:20px}
.opt{padding:14px 16px;gap:14px;font-size:19px}
.opt .k{width:36px;height:36px;font-size:17px}
.opt .t .en+.te{font-size:18px}
.mtab table{font-size:18px}
.exp{font-size:18.5px;padding:14px 16px}
.nav button{font-size:17.5px;padding:12px 22px}
.mapcard h2{font-size:19px}
.grid button{font-size:15.5px}
.legend{font-size:15px}
footer{font-size:18px!important}
footer span{font-size:15px!important}
.result .big{font-size:56px}
@media (max-width:480px){.qtext .en,.qtext .te{font-size:20px}.opt{font-size:18px}.grid{grid-template-columns:repeat(7,1fr)}header.top img{width:80px;height:84px}}
</style>

<script>
const Q=[
{q:["Smallest planet in the solar system","సౌర కుటుంబంలో అతి చిన్న గ్రహం"],o:[["Earth","భూమి"],["Mars","అంగారకుడు"],["Mercury","బుధుడు"],["Saturn","శని"]],a:2,
e:["Mercury is the smallest planet (diameter about 4,879 km) and the one closest to the Sun.","బుధుడు సౌర కుటుంబంలో అతి చిన్న గ్రహం (వ్యాసం సుమారు 4,879 కి.మీ.). ఇది సూర్యునికి అతి దగ్గరగా ఉండే గ్రహం కూడా."]},
{q:["This is not an inner planet","ఇది అంతర గ్రహం కాదు"],o:[["Mercury","బుధుడు"],["Venus","శుక్రుడు"],["Saturn","శని"],["Earth","భూమి"]],a:2,
e:["The inner (rocky) planets are Mercury, Venus, Earth and Mars. Saturn is an outer planet (gas giant) beyond the asteroid belt.","అంతర గ్రహాలు: బుధుడు, శుక్రుడు, భూమి, అంగారకుడు. శని గ్రహశకలాల పట్టీకి అవతల ఉండే బాహ్య గ్రహం (వాయు గ్రహం)."]},
{q:["He was the first man to step on the surface of the Moon","చంద్రుని ఉపరితలంపై అడుగు పెట్టిన మొదటి వ్యక్తి"],o:[["Rakesh Sharma","రాకేష్ శర్మ"],["Neil Armstrong","నీల్ ఆర్మ్‌స్ట్రాంగ్"],["Yuri Gagarin","యూరి గగారిన్"],["Kalpana Chawla","కల్పనా చావ్లా"]],a:1,
e:["Neil Armstrong landed on the Moon with Apollo 11 in July 1969. Yuri Gagarin was the first man in space (1961); Rakesh Sharma was the first Indian in space (1984).","1969 జూలైలో అపోలో-11 ద్వారా నీల్ ఆర్మ్‌స్ట్రాంగ్ చంద్రునిపై అడుగుపెట్టాడు. యూరి గగారిన్ అంతరిక్షంలోకి వెళ్ళిన మొదటి వ్యక్తి (1961); రాకేష్ శర్మ అంతరిక్షంలోకి వెళ్ళిన మొదటి భారతీయుడు (1984)."]},
{q:["This planet does not have satellites","ఉపగ్రహాలు లేని గ్రహం"],o:[["Venus","శుక్రుడు"],["Earth","భూమి"],["Saturn","శని"],["Uranus","యురేనస్"]],a:0,
e:["Mercury and Venus have no natural satellites. Earth has one (the Moon); Saturn and Uranus have many.","బుధుడు, శుక్రుడు గ్రహాలకు సహజ ఉపగ్రహాలు లేవు. భూమికి ఒకటి (చంద్రుడు); శని, యురేనస్‌లకు చాలా ఉపగ్రహాలు ఉన్నాయి."]},
{q:["This planet is considered as Earth's twin","'భూమికి కవల గ్రహం'గా పరిగణించబడేది"],o:[["Jupiter","బృహస్పతి"],["Mars","అంగారకుడు"],["Venus","శుక్రుడు"],["Saturn","శని"]],a:2,
e:["Venus is almost the same size and mass as Earth, so it is called Earth's twin.","శుక్రుడు పరిమాణం, ద్రవ్యరాశిలో భూమికి దాదాపు సమానంగా ఉంటుంది. అందుకే దీనిని భూమికి కవల గ్రహం అంటారు."]},
{q:["Heliocentric theory was proposed by","సూర్యకేంద్రక సిద్ధాంతాన్ని ప్రతిపాదించినది"],o:[["Georges Lemaître","జార్జెస్ లెమైటర్"],["Ptolemy","టాలెమీ"],["Immanuel Kant","ఇమ్మాన్యుయేల్ కాంట్"],["Nicolaus Copernicus","నికోలస్ కోపర్నికస్"]],a:3,
e:["Copernicus (1543) said the Sun is at the centre and the planets revolve around it. Ptolemy gave the Earth-centred (geocentric) theory; Lemaître proposed the Big Bang idea.","కోపర్నికస్ (1543) సూర్యుడు కేంద్రంలో ఉండి గ్రహాలు దాని చుట్టూ తిరుగుతాయని చెప్పాడు. టాలెమీ భూకేంద్రక సిద్ధాంతం ఇచ్చాడు; లెమైటర్ మహావిస్ఫోట (బిగ్ బ్యాంగ్) భావనను ప్రతిపాదించాడు."]},
{q:["The world's first seamless celestial globe was built by","ప్రపంచంలో మొట్టమొదటి అతుకులు లేని ఖగోళ గోళాన్ని రూపొందించినవారు"],o:[["Guptas","గుప్తులు"],["Chalukyas","చాళుక్యులు"],["Mauryas","మౌర్యులు"],["Mughals","మొఘలులు"]],a:3,
e:["It was made in Kashmir in Akbar's time (1589) by Ali Kashmiri ibn Luqman, cast as a single piece of metal with no joints.","అక్బర్ కాలంలో (1589) కాశ్మీర్‌లో అలీ కాశ్మీరీ ఇబ్న్ లుక్మాన్ దీనిని ఒకే లోహపు ముక్కగా, అతుకులు లేకుండా తయారుచేశాడు."]},
{q:["Identify the 0° latitude","0° అక్షాంశాన్ని గుర్తించండి"],o:[["Tropic of Cancer","కర్కట రేఖ"],["Arctic Circle","ఆర్కిటిక్ వలయం"],["Tropic of Capricorn","మకర రేఖ"],["Equator","భూమధ్య రేఖ"]],a:3,
e:["The Equator is the 0° latitude. It divides the Earth into the Northern and Southern Hemispheres.","భూమధ్య రేఖ 0° అక్షాంశం. ఇది భూమిని ఉత్తర, దక్షిణ అర్ధగోళాలుగా విభజిస్తుంది."]},
{q:["The 23½° Northern latitude is called","23½° ఉత్తర అక్షాంశాన్ని ఇలా పిలుస్తారు"],o:[["Tropic of Cancer","కర్కట రేఖ"],["Equator","భూమధ్య రేఖ"],["Tropic of Capricorn","మకర రేఖ"],["Antarctic Circle","అంటార్కిటిక్ వలయం"]],a:0,
e:["23½° N is the Tropic of Cancer; 23½° S is the Tropic of Capricorn. The Tropic of Cancer passes through the middle of India.","23½° ఉ. కర్కట రేఖ; 23½° ద. మకర రేఖ. కర్కట రేఖ భారతదేశం మధ్య గుండా వెళుతుంది."]},
{q:["The word \"Globe\" came from the ____ word \"globus\"","\"గ్లోబ్\" అనే పదం \"గ్లోబస్\" అనే ____ పదం నుండి వచ్చింది"],o:[["Greek","గ్రీకు"],["Latin","లాటిన్"],["Spanish","స్పానిష్"],["French","ఫ్రెంచ్"]],a:1,
e:["'Globus' is a Latin word meaning a round mass or sphere.","'గ్లోబస్' లాటిన్ పదం. దీని అర్థం గుండ్రని ముద్ద లేదా గోళం."]},
{q:["The imaginary line running horizontally through the middle of the globe is","గ్లోబు మధ్యలో అడ్డంగా గీసిన ఊహారేఖ"],o:[["South Pole","దక్షిణ ధ్రువం"],["Equator","భూమధ్య రేఖ"],["North Pole","ఉత్తర ధ్రువం"],["International Date Line","అంతర్జాతీయ దినరేఖ"]],a:1,
e:["The Equator runs east–west around the middle of the globe, at equal distance from both poles.","భూమధ్య రేఖ రెండు ధ్రువాలకూ సమాన దూరంలో, గ్లోబు మధ్యలో తూర్పు–పడమరగా ఉంటుంది."]},
{q:["The imaginary circular lines parallel to the Equator are","భూమధ్య రేఖకు సమాంతరంగా ఉన్న ఊహా వృత్తాకార రేఖలు"],o:[["International Date Line","అంతర్జాతీయ దినరేఖ"],["Longitudes","రేఖాంశాలు"],["Latitudes","అక్షాంశాలు"],["Greenwich","గ్రీనిచ్"]],a:2,
e:["Latitudes (parallels) run parallel to the Equator. Longitudes (meridians) run from pole to pole.","అక్షాంశాలు భూమధ్య రేఖకు సమాంతరంగా ఉంటాయి. రేఖాంశాలు ఒక ధ్రువం నుండి మరొక ధ్రువం వరకు ఉంటాయి."]},
{q:["Sun's rays fall directly on the Tropic of Cancer on","సూర్యకిరణాలు కర్కట రేఖపై నిట్టనిలువుగా పడే రోజు"],o:[["21st March","మార్చి 21"],["21st June","జూన్ 21"],["22nd December","డిసెంబర్ 22"],["23rd September","సెప్టెంబర్ 23"]],a:1,
e:["On 21 June (summer solstice) the Sun is overhead at the Tropic of Cancer. On 22 December it is over the Tropic of Capricorn; on 21 March and 23 September it is over the Equator.","జూన్ 21న (వేసవి అయనాంతం) సూర్యుడు కర్కట రేఖపై నిట్టనిలువుగా ఉంటాడు. డిసెంబర్ 22న మకర రేఖపై; మార్చి 21, సెప్టెంబర్ 23 తేదీల్లో భూమధ్య రేఖపై ఉంటాడు."]},
{q:["World Earth Day","ప్రపంచ ధరిత్రీ దినోత్సవం"],o:[["April 22","ఏప్రిల్ 22"],["September 16","సెప్టెంబర్ 16"],["March 22","మార్చి 22"],["June 5","జూన్ 5"]],a:0,
e:["Earth Day is on 22 April (since 1970). September 16 is Ozone Day, March 22 is World Water Day and June 5 is World Environment Day.","ధరిత్రీ దినోత్సవం ఏప్రిల్ 22 (1970 నుండి). సెప్టెంబర్ 16 ఓజోన్ దినోత్సవం, మార్చి 22 ప్రపంచ జల దినోత్సవం, జూన్ 5 ప్రపంచ పర్యావరణ దినోత్సవం."]},
{q:["World Environment Day","ప్రపంచ పర్యావరణ దినోత్సవం"],o:[["April 22","ఏప్రిల్ 22"],["September 16","సెప్టెంబర్ 16"],["March 22","మార్చి 22"],["June 5","జూన్ 5"]],a:3,
e:["World Environment Day is observed on 5 June, a date set by the United Nations after the 1972 Stockholm Conference.","1972 స్టాక్‌హోమ్ సదస్సు తర్వాత ఐక్యరాజ్యసమితి జూన్ 5ను ప్రపంచ పర్యావరణ దినోత్సవంగా ప్రకటించింది."]},
{q:["The fixed and regular path along which the Earth revolves around the Sun is called","భూమి సూర్యుని చుట్టూ తిరిగే నిర్ణీత మార్గాన్ని ఇలా అంటారు"],o:[["Axis","అక్షం"],["Equinox","విషువత్తు"],["Orbit","కక్ష్య"],["Compass","దిక్సూచి"]],a:2,
e:["The path of revolution is the orbit. The axis is the imaginary line on which the Earth rotates.","భూమి పరిభ్రమించే మార్గం కక్ష్య. భూమి తన చుట్టూ తాను తిరిగే ఊహారేఖ అక్షం."]},
{q:["It indicates the Arctic Circle","ఆర్కిటిక్ వలయాన్ని సూచించేది"],o:[["0°","0°"],["23½° N","23½° ఉ."],["23½° S","23½° ద."],["66½° N","66½° ఉ."]],a:3,
e:["The Arctic Circle is at 66½° N and the Antarctic Circle at 66½° S. 23½° N/S are the Tropics.","ఆర్కిటిక్ వలయం 66½° ఉ., అంటార్కిటిక్ వలయం 66½° ద. అక్షాంశాల వద్ద ఉంటాయి. 23½° ఉ./ద. కర్కట, మకర రేఖలు."]},
{q:["Day and night are caused due to this movement of the Earth","భూమి యొక్క ఈ చలనం వల్ల రాత్రి, పగలు ఏర్పడతాయి"],o:[["Gravitation","గురుత్వాకర్షణ"],["Rotation","భూభ్రమణం"],["Revolution","భూపరిభ్రమణం"],["Orbit","కక్ష్య"]],a:1,
e:["Rotation (Earth spinning on its axis in about 24 hours) causes day and night. Revolution around the Sun causes seasons.","భూభ్రమణం (సుమారు 24 గంటల్లో భూమి తన అక్షంపై తిరగడం) వల్ల రాత్రి, పగలు ఏర్పడతాయి. సూర్యుని చుట్టూ పరిభ్రమణం వల్ల రుతువులు ఏర్పడతాయి."]},
{q:["Identify the mismatched pair of capital and state","సరికాని రాజధాని – రాష్ట్రం జతను గుర్తించండి"],o:[["Jaipur – Rajasthan","జైపూర్ – రాజస్థాన్"],["Chennai – Tamil Nadu","చెన్నై – తమిళనాడు"],["Bhopal – Madhya Pradesh","భోపాల్ – మధ్యప్రదేశ్"],["Thiruvananthapuram – Karnataka","తిరువనంతపురం – కర్ణాటక"]],a:3,
e:["Thiruvananthapuram is the capital of Kerala. The capital of Karnataka is Bengaluru.","తిరువనంతపురం కేరళ రాజధాని. కర్ణాటక రాజధాని బెంగళూరు."]},
{q:["Match the map colours with the features","పటంలోని రంగులను భౌగోళిక స్వరూపాలతో జతపరచండి"],
m:[[["i. Dark green","i. ముదురు ఆకుపచ్చ"],["a) Plateaus","a) పీఠభూములు"]],[["ii. Yellow","ii. పసుపు"],["b) Seas and Oceans","b) సముద్రాలు, మహాసముద్రాలు"]],[["iii. Dark blue","iii. ముదురు నీలం"],["c) Forest","c) అడవులు"]]],
o:[["i-a, ii-b, iii-c","i-a, ii-b, iii-c"],["i-c, ii-a, iii-b","i-c, ii-a, iii-b"],["i-c, ii-b, iii-a","i-c, ii-b, iii-a"],["i-b, ii-c, iii-a","i-b, ii-c, iii-a"]],a:1,
e:["On maps, dark green shows forests, yellow shows plateaus and dark blue shows seas and oceans.","పటాలలో ముదురు ఆకుపచ్చ అడవులను, పసుపు పీఠభూములను, ముదురు నీలం సముద్రాలు, మహాసముద్రాలను సూచిస్తాయి."]},
{q:["Find the correct sentence from the following","కింది వాటిలో సరైన వాక్యాన్ని కనుగొనండి"],o:[["River Ganga originates in the Himalayas","గంగా నది హిమాలయాలలో జన్మిస్తుంది"],["River Cauvery flows in West Bengal","కావేరి నది పశ్చిమ బెంగాల్‌లో ప్రవహిస్తుంది"],["River Krishna drains into the Arabian Sea","కృష్ణా నది అరేబియా సముద్రంలో కలుస్తుంది"],["River Penna flows in Maharashtra","పెన్నా నది మహారాష్ట్రలో ప్రవహిస్తుంది"]],a:0,
e:["The Ganga rises from the Gangotri glacier in the Himalayas. The Cauvery flows through Karnataka and Tamil Nadu; the Krishna and Penna flow into the Bay of Bengal, and the Penna flows through Karnataka and Andhra Pradesh.","గంగా నది హిమాలయాల్లోని గంగోత్రి హిమానీనదంలో జన్మిస్తుంది. కావేరి కర్ణాటక, తమిళనాడులలో ప్రవహిస్తుంది; కృష్ణా, పెన్నా బంగాళాఖాతంలో కలుస్తాయి. పెన్నా కర్ణాటక, ఆంధ్రప్రదేశ్‌లలో ప్రవహిస్తుంది."]},
{q:["This country does not share a land boundary with India","భారతదేశంతో భూ సరిహద్దును పంచుకోని దేశం"],o:[["Pakistan","పాకిస్తాన్"],["Nepal","నేపాల్"],["Myanmar","మయన్మార్"],["Malaysia","మలేషియా"]],a:3,
e:["India's land neighbours are Pakistan, Afghanistan, China, Nepal, Bhutan, Bangladesh and Myanmar. Malaysia is in Southeast Asia with no land border with India.","భారత్‌కు భూ సరిహద్దు ఉన్న దేశాలు: పాకిస్తాన్, అఫ్గానిస్తాన్, చైనా, నేపాల్, భూటాన్, బంగ్లాదేశ్, మయన్మార్. మలేషియాతో భూ సరిహద్దు లేదు."]},
{q:["These maps show the physical features","భౌగోళిక స్వరూపాలను చూపే పటాలు"],o:[["Political maps","రాజకీయ పటాలు"],["Physical maps","భౌతిక పటాలు"],["Thematic maps","విషయ నిర్దేశిత పటాలు"],["Historical maps","చారిత్రక పటాలు"]],a:1,
e:["Physical maps show natural features such as mountains, plateaus, plains, rivers and oceans.","భౌతిక పటాలు పర్వతాలు, పీఠభూములు, మైదానాలు, నదులు, సముద్రాలు వంటి సహజ స్వరూపాలను చూపుతాయి."]},
{q:["These maps show historical events","చారిత్రక సంఘటనలను తెలుసుకోవడానికి ఉపయోగించే పటాలు"],o:[["Historical maps","చారిత్రక పటాలు"],["Political maps","రాజకీయ పటాలు"],["Physical maps","భౌతిక పటాలు"],["Thematic maps","విషయ నిర్దేశిత పటాలు"]],a:0,
e:["Historical maps show past empires, battles, trade routes and other events of history.","చారిత్రక పటాలు గత సామ్రాజ్యాలు, యుద్ధాలు, వాణిజ్య మార్గాలు వంటి చరిత్ర సంఘటనలను చూపుతాయి."]},
{q:["This is the largest forest cover state in our country","మన దేశంలో అత్యధిక అటవీ విస్తీర్ణం ఉన్న రాష్ట్రం"],o:[["Bihar","బీహార్"],["Madhya Pradesh","మధ్యప్రదేశ్"],["Odisha","ఒడిశా"],["Karnataka","కర్ణాటక"]],a:1,
e:["Madhya Pradesh has the largest forest cover by area in India, followed by Arunachal Pradesh and Chhattisgarh (India State of Forest Report).","విస్తీర్ణం పరంగా మధ్యప్రదేశ్‌లో అత్యధిక అటవీ ప్రాంతం ఉంది. తర్వాతి స్థానాల్లో అరుణాచల్ ప్రదేశ్, ఛత్తీస్‌గఢ్ ఉన్నాయి (భారత అటవీ నివేదిక)."]},
{q:["Which of the following is not a slogan for conservation of forests?","కింది వాటిలో అటవీ సంరక్షణ నినాదం కానిది ఏది?"],o:[["Save the trees, save the earth","చెట్లను రక్షించండి – భూమిని రక్షించండి"],["Save nature, save future","ప్రకృతిని రక్షిద్దాం – భవిష్యత్తును కాపాడుదాం"],["Greenery for better environment","మెరుగైన పర్యావరణం కోసం పచ్చదనం"],["Good food, good life","ఆరోగ్యకరమైన ఆహారం – ఆరోగ్యకరమైన జీవితం"]],a:3,
e:["'Good food, good life' is about health and nutrition, not about forests. The other three speak about trees and nature.","'మంచి ఆహారం – మంచి జీవితం' ఆరోగ్యం, పోషణకు సంబంధించిన నినాదం. మిగతా మూడూ చెట్లు, ప్రకృతి గురించి చెబుతాయి."]},
{q:["Acacia, Brahmajemudu, Nagajemudu and Thumma trees are found in these forests","తుమ్మ, బ్రహ్మజెముడు, నాగజెముడు వంటి మొక్కలు ఈ అడవుల్లో కనిపిస్తాయి"],o:[["Evergreen forests","సతత హరిత అడవులు"],["Deciduous forests","ఆకురాల్చే అడవులు"],["Thorny forests","ముళ్ళ అడవులు"],["Mangrove forests","మడ అడవులు"]],a:2,
e:["Thorny forests grow in dry, low-rainfall areas. Plants like acacia (thumma) and cacti (jemudu) have thorns and thick stems to save water.","ముళ్ళ అడవులు తక్కువ వర్షపాతం ఉండే పొడి ప్రాంతాల్లో పెరుగుతాయి. తుమ్మ, జెముడు వంటి మొక్కలకు నీటిని ఆదా చేసేందుకు ముళ్ళు, దళసరి కాండాలు ఉంటాయి."]},
{q:["These forests are green throughout the year","సంవత్సరం పొడవునా పచ్చగా కనిపించే అడవులు"],o:[["Deciduous forests","ఆకురాల్చే అడవులు"],["Evergreen forests","సతత హరిత అడవులు"],["Tidal forests","తీరప్రాంత అడవులు"],["Mangrove forests","మడ అడవులు"]],a:1,
e:["Evergreen forests grow where rainfall is very high (over 200 cm). Trees do not shed all their leaves at one time, so they stay green all year.","సతత హరిత అడవులు అధిక వర్షపాతం (200 సెం.మీ. పైగా) ఉండే చోట పెరుగుతాయి. చెట్లు ఒకేసారి ఆకులు రాల్చవు, అందుకే ఏడాదంతా పచ్చగా ఉంటాయి."]},
{q:["This is not a reason for deforestation","అటవీ నిర్మూలనకు కారణం కానిది"],o:[["Urbanization","పట్టణీకరణ"],["Home furniture","గృహోపకరణాలు (ఫర్నిచర్)"],["Firewood","వంట చెరకు"],["Afforestation","మొక్కలు నాటడం"]],a:3,
e:["Afforestation means planting trees, which increases forest cover. The others lead to cutting of trees.","మొక్కలు నాటడం (అడవుల పెంపకం) అటవీ విస్తీర్ణాన్ని పెంచుతుంది. మిగతావి చెట్ల నరికివేతకు దారితీస్తాయి."]},
{q:["The plants of a particular region are called","ఒక ప్రత్యేక ప్రాంతంలో పెరిగే మొక్కలను ఇలా అంటారు"],o:[["Climate","శీతోష్ణస్థితి"],["Fauna","జంతుజాలం"],["Flora","వృక్షజాలం"],["Transpiration","బాష్పోత్సేకం"]],a:2,
e:["Flora means the plant life of a region; fauna means its animal life.","ఒక ప్రాంతంలోని మొక్కల సమూహం వృక్షజాలం (ఫ్లోరా); జంతువుల సమూహం జంతుజాలం (ఫౌనా)."]},
{q:["Plateaus are rich in","పీఠభూములు వీటితో సమృద్ధిగా ఉంటాయి"],o:[["Vegetables","కూరగాయలు"],["Fruits","పండ్లు"],["Minerals","ఖనిజాలు"],["Crops","పంటలు"]],a:2,
e:["Plateaus are storehouses of minerals. The Chota Nagpur plateau, for example, is rich in iron, coal and manganese.","పీఠభూములు ఖనిజాల నిల్వలు. ఉదాహరణకు ఛోటా నాగ్‌పూర్ పీఠభూమిలో ఇనుము, బొగ్గు, మాంగనీస్ సమృద్ధిగా ఉన్నాయి."]},
{q:["Ananthagiri hills are located in this district","అనంతగిరి కొండలు ఈ జిల్లాలో ఉన్నాయి"],o:[["Palnadu","పల్నాడు"],["Ananthapuram","అనంతపురం"],["Visakhapatnam","విశాఖపట్నం"],["Guntur","గుంటూరు"]],a:2,
e:["The Ananthagiri hills are part of the Eastern Ghats near Araku, in the old Visakhapatnam district (now in Alluri Sitharama Raju district after the 2022 reorganisation).","అనంతగిరి కొండలు అరకు సమీపంలో తూర్పు కనుమలలో భాగం. ఇవి పాత విశాఖపట్నం జిల్లాలో ఉండేవి (2022 పునర్వ్యవస్థీకరణ తర్వాత అల్లూరి సీతారామరాజు జిల్లాలో)."]},
{q:["The Integrated Tribal Development Agency (ITDA) headquarters was set up in 1989 at","సమీకృత గిరిజన అభివృద్ధి సంస్థ (ITDA) ప్రధాన కార్యాలయాన్ని 1989లో ఇక్కడ ఏర్పాటు చేశారు"],o:[["Lambasingi","లంబసింగి"],["Araku Valley","అరకు లోయ"],["Ooty","ఊటీ"],["Srisailam","శ్రీశైలం"]],a:3,
e:["As per the answer key, the ITDA headquarters is at Srisailam. ITDA Srisailam works for the development of the Chenchu tribes of the Nallamala forests.","జవాబు కీ ప్రకారం ITDA ప్రధాన కార్యాలయం శ్రీశైలంలో ఉంది. ఇది నల్లమల అడవుల్లోని చెంచు గిరిజనుల అభివృద్ధికి పనిచేస్తుంది."]},
{q:["This is the highest plateau in the world","ప్రపంచంలో ఎత్తైన పీఠభూమి"],o:[["Malwa Plateau","మాల్వా పీఠభూమి"],["Colorado Plateau","కొలరాడో పీఠభూమి"],["Tibet Plateau","టిబెట్ పీఠభూమి"],["Deccan Plateau","దక్కన్ పీఠభూమి"]],a:2,
e:["The Tibetan Plateau has an average height of about 4,500 m and is called the 'Roof of the World'.","టిబెట్ పీఠభూమి సగటు ఎత్తు సుమారు 4,500 మీ. దీనిని 'ప్రపంచపు పైకప్పు' అంటారు."]},
{q:["Black soils are fertile and good for this cultivation","నల్లరేగడి నేలలు సారవంతమైనవి, ఈ పంటకు అనుకూలం"],o:[["Cotton","పత్తి"],["Millets","చిరుధాన్యాలు"],["Vegetables","కూరగాయలు"],["Wheat","గోధుమ"]],a:0,
e:["Black soil (regur) holds moisture well, which suits cotton. That is why it is also called black cotton soil.","నల్లరేగడి నేల తేమను బాగా నిలుపుకుంటుంది, ఇది పత్తికి అనుకూలం. అందుకే దీనిని నల్ల పత్తి నేల అని కూడా అంటారు."]},
{q:["Identify the mismatched pair","సరికాని జతను గుర్తించండి"],o:[["Vamsadhara – Srikakulam","వంశధార – శ్రీకాకుళం"],["Penna – Nellore","పెన్నా – నెల్లూరు"],["Kolleru – West Godavari","కొల్లేరు – పశ్చిమ గోదావరి"],["Pulicat – Krishna","పులికాట్ – కృష్ణా"]],a:3,
e:["Pulicat lake lies on the Andhra Pradesh–Tamil Nadu border, in the old Nellore district (now Tirupati district), not in Krishna district.","పులికాట్ సరస్సు ఆంధ్రప్రదేశ్–తమిళనాడు సరిహద్దులో, పాత నెల్లూరు జిల్లాలో (ప్రస్తుతం తిరుపతి జిల్లా) ఉంది; కృష్ణా జిల్లాలో కాదు."]},
{q:["In this country the Earth Summit was held in 1992","1992లో ధరిత్రీ శిఖరాగ్ర సమావేశం జరిగిన దేశం"],o:[["Brazil","బ్రెజిల్"],["Belgium","బెల్జియం"],["U.S.A.","అమెరికా"],["Australia","ఆస్ట్రేలియా"]],a:0,
e:["The Earth Summit was held at Rio de Janeiro, Brazil, in June 1992. It adopted Agenda 21 for sustainable development.","ధరిత్రీ సదస్సు 1992 జూన్‌లో బ్రెజిల్‌లోని రియో డి జనీరోలో జరిగింది. సుస్థిర అభివృద్ధి కోసం 'అజెండా 21'ను ఆమోదించింది."]},
{q:["Which one of the following is a human made resource?","కింది వాటిలో మానవ నిర్మిత వనరు ఏది?"],o:[["Spring water","ఊట నీరు"],["Medicine to treat cancer","క్యాన్సర్ చికిత్సకు మందు"],["Tropical forests","ఉష్ణమండల అడవులు"],["Natural gas","సహజ వాయువు"]],a:1,
e:["A medicine is made by people using knowledge and technology, so it is a human made resource. The others occur in nature.","మందును మానవులు జ్ఞానం, సాంకేతికతతో తయారుచేస్తారు; కనుక ఇది మానవ నిర్మిత వనరు. మిగతావి ప్రకృతిలో సహజంగా లభిస్తాయి."]},
{q:["The percentage of plateau region in our country is","మన దేశ విస్తీర్ణంలో పీఠభూముల శాతం"],o:[["27%","27%"],["47%","47%"],["59%","59%"],["39%","39%"]],a:0,
e:["India's land: plains about 43%, mountains about 30% and plateaus about 27%.","భారత భూభాగంలో మైదానాలు సుమారు 43%, పర్వతాలు సుమారు 30%, పీఠభూములు సుమారు 27%."]},
{q:["Air and water come under this type of resource","గాలి, నీరు ఈ రకం వనరుల కిందకు వస్తాయి"],o:[["Human resource","మానవ వనరు"],["Natural resource","సహజ వనరు"],["Non-renewable resource","పునరుద్ధరించలేని వనరు"],["Human made resource","మానవ నిర్మిత వనరు"]],a:1,
e:["Air and water are given by nature without human effort, so they are natural resources.","గాలి, నీరు మానవ ప్రయత్నం లేకుండా ప్రకృతి నుండి లభిస్తాయి; కనుక ఇవి సహజ వనరులు."]},
{q:["It is the amount of resources available for use","ఉపయోగించుకోవడానికి అందుబాటులో ఉన్న మొత్తం వనరులు"],o:[["Resource development","వనరుల అభివృద్ధి"],["Resource conservation","వనరుల పరిరక్షణ"],["Sustainable development","సుస్థిర అభివృద్ధి"],["Stock of resource","వనరుల నిల్వ"]],a:3,
e:["The stock of a resource is the total amount available for use.","ఉపయోగానికి అందుబాటులో ఉన్న మొత్తం వనరుల పరిమాణాన్ని వనరుల నిల్వ అంటారు."]},
{q:["Technology is also a ______ resource","సాంకేతికత కూడా ఒక ______ వనరు"],o:[["Natural resource","సహజ వనరు"],["Human made resource","మానవ నిర్మిత వనరు"],["Human resource","మానవ వనరు"],["Non-renewable resource","పునరుద్ధరించలేని వనరు"]],a:1,
e:["Technology is created by people using their knowledge, so it is a human made resource.","సాంకేతికతను మానవులు తమ జ్ఞానంతో సృష్టిస్తారు; కనుక అది మానవ నిర్మిత వనరు."]},
{q:["In which of the following states are black soils predominantly found?","నల్లరేగడి నేలలు ఎక్కువగా ఉన్న రాష్ట్రం ఏది?"],o:[["Uttar Pradesh","ఉత్తరప్రదేశ్"],["Rajasthan","రాజస్థాన్"],["Maharashtra","మహారాష్ట్ర"],["Jharkhand","జార్ఖండ్"]],a:2,
e:["Black soils formed from the basalt rocks of the Deccan Trap, which cover large parts of Maharashtra.","నల్లరేగడి నేలలు దక్కన్ ట్రాప్ బసాల్ట్ శిలల నుండి ఏర్పడ్డాయి. ఇవి మహారాష్ట్రలో విస్తారంగా ఉన్నాయి."]},
{q:["This factor determines the thickness of soil","నేల మందాన్ని నిర్ణయించే మృత్తిక కారకం"],o:[["Climate","శీతోష్ణస్థితి"],["Parent rock","మాతృశిల"],["Relief","భూస్వరూపం"],["Time","కాలం"]],a:3,
e:["Soil forms very slowly. The longer the time, the thicker and more mature the soil becomes.","నేల చాలా నెమ్మదిగా ఏర్పడుతుంది. ఎక్కువ కాలం గడిచేకొద్దీ నేల మందంగా, పరిపక్వంగా మారుతుంది."]},
{q:["The Kaziranga National Park is located in this state","కజిరంగా జాతీయ పార్కు ఈ రాష్ట్రంలో ఉంది"],o:[["Assam","అస్సాం"],["Bihar","బీహార్"],["Gujarat","గుజరాత్"],["West Bengal","పశ్చిమ బెంగాల్"]],a:0,
e:["Kaziranga in Assam is famous for the one-horned rhinoceros and is a UNESCO World Heritage Site.","అస్సాంలోని కజిరంగా ఒంటికొమ్ము ఖడ్గమృగానికి ప్రసిద్ధి. ఇది యునెస్కో ప్రపంచ వారసత్వ ప్రదేశం."]},

];
const BASE=0;

const UI={
 en:{q:"Question",of:"of",score:"Score",prev:"◀ Previous",next:"Next ▶",finish:"See result",right:"Correct!",wrong:"Wrong. Correct answer:",map:"Question map",lr:"Correct",lw:"Wrong",lu:"Not answered",done:"Quiz complete",again:"Start again",att:"Answered"},
 te:{q:"ప్రశ్న",of:"/",score:"స్కోరు",prev:"◀ వెనుకకు",next:"తర్వాత ▶",finish:"ఫలితం చూడండి",right:"సరైన సమాధానం!",wrong:"తప్పు. సరైన సమాధానం:",map:"ప్రశ్నల పటం",lr:"సరైనవి",lw:"తప్పులు",lu:"జవాబు ఇవ్వనివి",done:"క్విజ్ పూర్తయింది",again:"మళ్ళీ ప్రారంభించండి",att:"జవాబిచ్చినవి"}
};
let lang="both",cur=0,ans=Array(Q.length).fill(null),showResult=false;
try{const s=JSON.parse(localStorage.getItem("tet2a-soc1")||"null");if(s){lang=s.lang||lang;cur=s.cur||0;if(Array.isArray(s.ans)&&s.ans.length===Q.length)ans=s.ans;}}catch(e){}
const save=()=>{try{localStorage.setItem("tet2a-soc1",JSON.stringify({lang,cur,ans}))}catch(e){}};
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function bi(p){ // p=[en,te]
  if(lang==="en")return `<span class="en">${esc(p[0])}</span>`;
  if(lang==="te")return `<span class="te">${esc(p[1])}</span>`;
  return p[0]===p[1]?`<span class="en">${esc(p[0])}</span>`:`<span class="en">${esc(p[0])}</span><span class="te">${esc(p[1])}</span>`;
}
function lbl(k){ if(lang==="en")return UI.en[k]; if(lang==="te")return UI.te[k]; return UI.te[k]+" / "+UI.en[k]; }
const K=["A","B","C","D"];
function render(){
  document.querySelectorAll(".langs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===lang));
  const done=ans.filter(x=>x!==null).length, right=ans.filter((x,i)=>x===Q[i].a).length;
  document.getElementById("s-pos").innerHTML=`${lbl("att")}: <b>${done}/${Q.length}</b>`;
  document.getElementById("s-score").innerHTML=`${lbl("score")}: <b>${right}</b>`;
  document.getElementById("s-bar").style.width=(done/Q.length*100)+"%";
  const card=document.getElementById("card");
  if(showResult){
    const wrong=done-right;
    card.className="card result";
    card.innerHTML=`<div class="qno">${lbl("done")}</div><div class="big">${right} / ${Q.length}</div>
      <div>${lbl("lr")}: <b>${right}</b> · ${lbl("lw")}: <b>${wrong}</b> · ${lbl("lu")}: <b>${Q.length-done}</b></div>
      <div class="nav" style="justify-content:center"><button id="again">${lbl("again")}</button></div>`;
    document.getElementById("again").onclick=()=>{ans=Array(Q.length).fill(null);cur=0;showResult=false;save();render();};
  } else {
    card.className="card";
    const q=Q[cur],picked=ans[cur];
    let h=`<div class="qno">${lbl("q")} ${BASE+cur+1} / ${BASE+Q.length}</div><div class="qtext">${bi(q.q)}</div>`;
    if(q.m){
      const mh=q.mh||[["Colour","రంగు"],["Feature","స్వరూపం"]];const hd=k=>lang==="en"?mh[k][0]:lang==="te"?mh[k][1]:mh[k][0]+" / "+mh[k][1];
      const cell=p=>lang==="en"?esc(p[0]):lang==="te"?`<span style="font-family:var(--f-te)">${esc(p[1])}</span>`:`${esc(p[0])}<small>${esc(p[1])}</small>`;
      h+=`<div class="mtab"><table><thead><tr><th>${hd(0)}</th><th>${hd(1)}</th></tr></thead><tbody>`+
         q.m.map(r=>`<tr><td>${cell(r[0])}</td><td>${cell(r[1])}</td></tr>`).join("")+`</tbody></table></div>`;
    }
    h+=`<div class="opts">`+q.o.map((o,i)=>{
      let c="";if(picked!==null){if(i===q.a)c="right";else if(i===picked)c="wrong";}
      return `<button class="opt ${c}" id="opt${i}" data-i="${i}" ${picked!==null?"disabled":""}><span class="k">${K[i]}</span><span class="t">${bi(o)}</span></button>`;
    }).join("")+`</div>`;
    if(picked!==null){
      const ok=picked===q.a;
      const v=ok?`<span class="verdict ok">✔ ${lbl("right")}</span>`:`<span class="verdict no">✘ ${lbl("wrong")} ${K[q.a]}</span>`;
      h+=`<div class="exp">${v}${bi(q.e)}</div>`;
    }
    const last=cur===Q.length-1;
    h+=`<div class="nav"><button class="ghost" id="prev" ${cur===0?"disabled":""}>${lbl("prev")}</button><button id="next">${last?lbl("finish"):lbl("next")}</button></div>`;
    card.innerHTML=h;
    card.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ans[cur]=+b.dataset.i;save();render();});
    document.getElementById("prev").onclick=()=>{cur--;save();render();};
    document.getElementById("next").onclick=()=>{if(last){showResult=true;}else cur++;save();render();window.scrollTo({top:0,behavior:"smooth"});};
  }
  document.getElementById("map-h").textContent=lbl("map");
  document.getElementById("legend").innerHTML=`<span style="--c:var(--ok)">${lbl("lr")}</span><span style="--c:var(--bad)">${lbl("lw")}</span><span style="--c:var(--line)">${lbl("lu")}</span>`;
  const g=document.getElementById("grid");
  g.innerHTML=Q.map((q,i)=>{let c=ans[i]===null?"":ans[i]===q.a?"r":"w";if(i===cur&&!showResult)c+=" cur";return `<button class="${c}" data-i="${i}" aria-label="Q ${BASE+i+1}">${BASE+i+1}</button>`}).join("");
  g.querySelectorAll("button").forEach(b=>b.onclick=()=>{cur=+b.dataset.i;showResult=false;save();render();document.getElementById("card").scrollIntoView({behavior:"smooth",block:"start"});});
}
document.querySelectorAll(".langs button").forEach(b=>b.onclick=()=>{lang=b.dataset.l;save();render();});
render();
</script>
