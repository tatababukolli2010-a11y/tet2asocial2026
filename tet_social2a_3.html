<!doctype html>
<html lang="te">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TET 2A Social Quiz 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&family=Noto+Sans:wght@400;600&family=Noto+Sans+Telugu:wght@400;600;700&family=Ramabhadra&display=swap">
<style>
/* Layout: a single atlas-sheet column — teacher header, quiz card, question map grid, credit footer */
:root{
  --paper:#f4f6f1; --sheet:#ffffff; --ink:#1d3442; --muted:#5b6d72; --line:#d7dfd8;
  --accent:#b8742a; --accent-soft:#f6ead9; --sea:#2c6e7f; --sea-soft:#e2eff1;
  --ok:#2f7d4a; --ok-soft:#e3f2e7; --bad:#b23b33; --bad-soft:#f8e3e1;
  --c1:#f26b00; --c2:#00897b; --c3:#7b3fe4; --c4:#e0245e; --on-hero:#ffffff;
  --hero:linear-gradient(120deg,#ff8a1f 0%,#e8405f 50%,#8a3ee0 100%);
  --f-display:"Bitter","Ramabhadra",Georgia,serif;
  --f-te:"Noto Sans Telugu","Noto Sans",system-ui,sans-serif;
  --f-body:"Noto Sans","Noto Sans Telugu",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#111a1f; --sheet:#18242b; --ink:#e5ece8; --muted:#9db0b2; --line:#2c3b42;
  --accent:#e0a35a; --accent-soft:#3a2c1b; --sea:#7fc0cf; --sea-soft:#1c3239;
  --ok:#6fcf8e; --ok-soft:#173326; --bad:#f08b80; --bad-soft:#3b1e1c; --c1:#ffa04d; --c2:#4fd3c3; --c3:#b590ff; --c4:#ff6f9a; --hero:linear-gradient(120deg,#c25a0c 0%,#a82a4a 50%,#5b2aa3 100%); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111a1f; --sheet:#18242b; --ink:#e5ece8; --muted:#9db0b2; --line:#2c3b42;
  --accent:#e0a35a; --accent-soft:#3a2c1b; --sea:#7fc0cf; --sea-soft:#1c3239;
  --ok:#6fcf8e; --ok-soft:#173326; --bad:#f08b80; --bad-soft:#3b1e1c; --c1:#ffa04d; --c2:#4fd3c3; --c3:#b590ff; --c4:#ff6f9a; --hero:linear-gradient(120deg,#c25a0c 0%,#a82a4a 50%,#5b2aa3 100%); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:18px 28px;display:flex;flex-direction:column;gap:16px}
header.top{display:flex;align-items:center;gap:16px;background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
header.top img{width:84px;height:88px;object-fit:cover;border-radius:12px;border:3px solid var(--accent);flex:none}
.ht{min-width:0;display:flex;flex-direction:column;gap:2px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}
h1{font-family:var(--f-display);font-size:clamp(20px,4.6vw,26px);line-height:1.2;margin:0;text-wrap:balance}
.sub{font-family:var(--f-te);color:var(--muted);font-size:14px}
.langs{display:flex;flex-wrap:wrap;gap:8px}
.langs button{font:600 14px var(--f-te);padding:8px 14px;border-radius:999px;border:1.5px solid var(--sea);background:transparent;color:var(--sea);cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--sea);color:var(--sheet)}
.status{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.status b{color:var(--ink)}
.bar{flex:1 1 160px;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:18px 16px;display:flex;flex-direction:column;gap:14px}
.qno{font-family:var(--f-display);color:var(--accent);font-size:15px}
.qtext{display:flex;flex-direction:column;gap:4px;white-space:pre-line}
.qtext .en{font-size:17px;font-weight:600}
.qtext .te{font-family:var(--f-te);font-size:17px;font-weight:600}
.qtext .en+.te{font-weight:400;color:var(--muted);font-size:16px}
.mtab{overflow-x:auto}
.mtab table{border-collapse:collapse;width:100%;font-size:15px}
.mtab th,.mtab td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.mtab th{background:var(--sea-soft);color:var(--sea);font-weight:600}
.mtab small{display:block;font-family:var(--f-te);color:var(--muted)}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--sheet);color:var(--ink);font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--sea);background:var(--sea-soft)}
.opt:focus-visible,.langs button:focus-visible,.nav button:focus-visible,.grid button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--sea-soft);color:var(--sea);font-weight:700;font-size:14px}
.opt .t{min-width:0;display:flex;flex-direction:column}
.opt .t .te{font-family:var(--f-te)}
.opt .t .en+.te{color:var(--muted);font-size:15px}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);color:var(--sheet)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:var(--sheet)}
.exp{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.exp .verdict{font-weight:700}
.exp .verdict.ok{color:var(--ok)} .exp .verdict.no{color:var(--bad)}
.exp .te{font-family:var(--f-te)}
.nav{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.nav button{font:600 15px var(--f-te);padding:10px 18px;border-radius:10px;border:none;background:var(--ink);color:var(--sheet);cursor:pointer}
.nav button.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.nav button:disabled{opacity:.4;cursor:default}
.mapcard{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.mapcard h2{font-family:var(--f-display);font-size:16px;margin:0}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.grid button{aspect-ratio:1;max-width:100%;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:600 13px var(--f-body);cursor:pointer;font-variant-numeric:tabular-nums;padding:0}
.grid button.r{background:var(--ok);color:var(--sheet);border-color:var(--ok)}
.grid button.w{background:var(--bad);color:var(--sheet);border-color:var(--bad)}
.grid button.cur{outline:2px solid var(--accent);outline-offset:1px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.result{text-align:center;align-items:center}
.result .big{font-family:var(--f-display);font-size:44px;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1}

/* ---- colourful layer ---- */
body{background:
  radial-gradient(600px 400px at 0% 0%,color-mix(in srgb,var(--c1) 16%,transparent),transparent 70%),
  radial-gradient(600px 420px at 100% 30%,color-mix(in srgb,var(--c3) 14%,transparent),transparent 70%),
  radial-gradient(700px 500px at 20% 100%,color-mix(in srgb,var(--c2) 14%,transparent),transparent 70%),
  var(--paper);background-attachment:fixed}
header.top{background:var(--hero);border:none;color:var(--on-hero);box-shadow:0 10px 26px -12px color-mix(in srgb,var(--c4) 60%,transparent)}
header.top img{border:3px solid var(--on-hero);box-shadow:0 0 0 4px color-mix(in srgb,var(--on-hero) 35%,transparent)}
header.top .eyebrow{color:var(--on-hero);opacity:.9}
header.top .sub{color:var(--on-hero);opacity:.92}
.langs button:nth-child(1){--lc:var(--c1)} .langs button:nth-child(2){--lc:var(--c4)} .langs button:nth-child(3){--lc:var(--c2)}
.langs button{border-color:var(--lc);color:var(--lc);background:color-mix(in srgb,var(--lc) 8%,var(--sheet))}
.langs button[aria-pressed="true"]{background:var(--lc);color:var(--sheet)}
.bar{height:10px}
.bar i{background:linear-gradient(90deg,var(--c1),var(--c4),var(--c3))}
.status b{color:var(--c3)}
.card{border:none;border-top:6px solid transparent;background:linear-gradient(var(--sheet),var(--sheet)) padding-box,linear-gradient(90deg,var(--c1),var(--c4),var(--c3),var(--c2)) border-box;box-shadow:0 8px 24px -14px color-mix(in srgb,var(--c3) 50%,transparent)}
.qno{display:inline-block;align-self:flex-start;background:color-mix(in srgb,var(--c1) 14%,var(--sheet));color:var(--c1);padding:3px 12px;border-radius:999px}
.opts .opt:nth-child(1){--oc:var(--c1)} .opts .opt:nth-child(2){--oc:var(--c2)} .opts .opt:nth-child(3){--oc:var(--c3)} .opts .opt:nth-child(4){--oc:var(--c4)}
.opt{border-color:color-mix(in srgb,var(--oc) 35%,var(--line));background:color-mix(in srgb,var(--oc) 5%,var(--sheet))}
.opt .k{background:var(--oc);color:var(--sheet)}
.opt:hover:not(:disabled){border-color:var(--oc);background:color-mix(in srgb,var(--oc) 13%,var(--sheet))}
.opt.right{border-color:var(--ok);background:var(--ok-soft)} .opt.right .k{background:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)} .opt.wrong .k{background:var(--bad)}
.exp{border-left-color:var(--c3);background:color-mix(in srgb,var(--c3) 10%,var(--sheet))}
.mtab th{background:color-mix(in srgb,var(--c2) 16%,var(--sheet));color:var(--c2)}
.nav button{background:linear-gradient(120deg,var(--c4),var(--c3));color:var(--on-hero)}
.nav button.ghost{background:color-mix(in srgb,var(--c2) 8%,var(--sheet));color:var(--c2);border-color:var(--c2)}
.mapcard{border:none;box-shadow:0 8px 24px -16px color-mix(in srgb,var(--c2) 60%,transparent)}
.mapcard h2{color:var(--c2)}
.grid button:nth-child(4n+1){--gc:var(--c1)} .grid button:nth-child(4n+2){--gc:var(--c2)} .grid button:nth-child(4n+3){--gc:var(--c3)} .grid button:nth-child(4n){--gc:var(--c4)}
.grid button{border-color:color-mix(in srgb,var(--gc) 45%,var(--line));background:color-mix(in srgb,var(--gc) 9%,var(--sheet));color:var(--gc)}
.grid button.r{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.grid button.w{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.grid button.cur{outline:3px solid var(--c4)}
.result .big{background:linear-gradient(90deg,var(--c1),var(--c4),var(--c3));-webkit-background-clip:text;background-clip:text;color:transparent}
footer{border-top:none;background:var(--hero);color:var(--on-hero);border-radius:14px;padding:14px 16px}
footer b{color:var(--on-hero)}
footer{text-align:center;font-family:var(--f-te);font-size:15px;color:var(--muted);border-top:1px dashed var(--line);padding-top:14px}
footer b{color:var(--ink)}
footer{color:var(--on-hero);border-top:none;background:var(--hero);border-radius:14px;padding:14px 16px} footer b{color:var(--on-hero)}
@media (max-width:480px){.grid{grid-template-columns:repeat(8,1fr)} header.top img{width:70px;height:74px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---- larger text ---- */
body{font-size:18px;line-height:1.6}
.wrap{max-width:820px;gap:18px}
.eyebrow{font-size:13.5px}
h1{font-size:clamp(23px,5.4vw,30px)}
.sub{font-size:16.5px}
header.top img{width:96px;height:100px}
.langs button{font-size:16.5px;padding:10px 18px}
.status{font-size:16.5px}
.qno{font-size:17px}
.qtext .en,.qtext .te{font-size:21px;line-height:1.55}
.qtext .en+.te{font-size:20px}
.opt{padding:14px 16px;gap:14px;font-size:19px}
.opt .k{width:36px;height:36px;font-size:17px}
.opt .t .en+.te{font-size:18px}
.mtab table{font-size:18px}
.exp{font-size:18.5px;padding:14px 16px}
.nav button{font-size:17.5px;padding:12px 22px}
.mapcard h2{font-size:19px}
.grid button{font-size:15.5px}
.legend{font-size:15px}
footer{font-size:18px!important}
footer span{font-size:15px!important}
.result .big{font-size:56px}
@media (max-width:480px){.qtext .en,.qtext .te{font-size:20px}.opt{font-size:18px}.grid{grid-template-columns:repeat(7,1fr)}header.top img{width:80px;height:84px}}
</style>

const Q=[
{q:["Alai Darwaza was built by","అలై దర్వాజాను నిర్మించినవారు"],o:[["Alauddin Khilji","అలాఉద్దీన్ ఖిల్జీ"],["Ibrahim Lodi","ఇబ్రహీం లోడీ"],["Iltutmish","ఇల్‌టుట్‌మిష్"],["Balban","బాల్బన్"]],a:0,
e:["Alauddin Khilji built the Alai Darwaza (1311), the southern gateway of the Qutb complex in Delhi.","అలాఉద్దీన్ ఖిల్జీ 1311లో ఢిల్లీలోని కుతుబ్ సముదాయానికి దక్షిణ ద్వారమైన అలై దర్వాజాను నిర్మించాడు."]},
{q:["He was the last powerful ruler among the Mughals","మొఘల్ పాలకులలో చివరి శక్తివంతమైన పాలకుడు"],o:[["Humayun","హుమాయూన్"],["Babur","బాబర్"],["Akbar","అక్బర్"],["Aurangzeb","ఔరంగజేబు"]],a:3,
e:["Aurangzeb (1658–1707) was the last of the great Mughals. After his death the empire weakened quickly.","ఔరంగజేబు (1658–1707) గొప్ప మొఘల్ చక్రవర్తులలో చివరివాడు. అతని మరణం తర్వాత సామ్రాజ్యం వేగంగా బలహీనపడింది."]},
{q:["In this year the 'English Education Act' was introduced","ఈ సంవత్సరంలో ఆంగ్ల విద్యా చట్టాన్ని ప్రవేశపెట్టారు"],o:[["1835","1835"],["1935","1935"],["1735","1735"],["1635","1635"]],a:0,
e:["The English Education Act of 1835, under William Bentinck and based on Macaulay's Minute, made English the medium of higher education.","మెకాలే మినిట్ ఆధారంగా విలియం బెంటింక్ కాలంలో 1835 ఆంగ్ల విద్యా చట్టం ఉన్నత విద్యలో ఆంగ్లాన్ని బోధనా మాధ్యమంగా చేసింది."]},
{q:["The Permanent Settlement Act (1793) was introduced by","శాశ్వత శిస్తు నిర్ణయ చట్టాన్ని (1793) ప్రవేశపెట్టినవారు"],o:[["Cornwallis","కారన్ వాలిస్"],["Warren Hastings","వారెన్ హేస్టింగ్స్"],["Dalhousie","డల్హౌసీ"],["Canning","కానింగ్"]],a:0,
e:["Lord Cornwallis introduced the Permanent Settlement in Bengal in 1793. Zamindars collected land revenue, and the amount payable to the Company was fixed forever.","లార్డ్ కారన్ వాలిస్ 1793లో బెంగాల్‌లో శాశ్వత శిస్తు నిర్ణయాన్ని ప్రవేశపెట్టాడు. జమీందారులు శిస్తు వసూలు చేసేవారు; కంపెనీకి చెల్లించే మొత్తం శాశ్వతంగా నిర్ణయించబడింది."]},
{q:["The Champaran Movement happened in this state","చంపారన్ ఉద్యమం ఈ రాష్ట్రంలో జరిగింది"],o:[["Gujarat","గుజరాత్"],["Uttar Pradesh","ఉత్తరప్రదేశ్"],["Kerala","కేరళ"],["Bihar","బీహార్"]],a:3,
e:["In 1917 Gandhiji led the Champaran Satyagraha in Bihar for indigo farmers. It was his first satyagraha in India.","1917లో గాంధీజీ బీహార్‌లోని చంపారన్‌లో నీలిమందు రైతుల కోసం సత్యాగ్రహం చేశారు. ఇది భారతదేశంలో ఆయన మొదటి సత్యాగ్రహం."]},
{q:["The 'Mahalwari' system was introduced by","'మహల్వారీ' విధానాన్ని ప్రవేశపెట్టినవారు"],o:[["Alexander Reed","అలెగ్జాండర్ రీడ్"],["Thomas Munro","థామస్ మన్రో"],["Holt Mackenzie","హోల్ట్ మెకంజీ"],["Cornwallis","కారన్ వాలిస్"]],a:2,
e:["Holt Mackenzie introduced the Mahalwari system (1822) in North-West Provinces; revenue was fixed for a whole village (mahal). Munro and Reed introduced the Ryotwari system.","హోల్ట్ మెకంజీ 1822లో వాయవ్య ప్రావిన్సులలో మహల్వారీ విధానం ప్రవేశపెట్టాడు; శిస్తు మొత్తం గ్రామానికి (మహల్) నిర్ణయించేవారు. మన్రో, రీడ్ రైత్వారీ విధానం ప్రవేశపెట్టారు."]},
{q:["Cultivation by planters on their own land is called","తోట యజమానులు తమ సొంత భూమిలో సాగు చేయడాన్ని ఇలా అంటారు"],o:[["Nij","నిజ్"],["Ryoti","రైతి"],["Mahal","మహల్"],["Shikhar","శిఖర్"]],a:0,
e:["In indigo cultivation, 'nij' meant planters growing indigo on land they directly controlled. Under 'ryoti', ryots grew indigo on their own land under contract.","నీలిమందు సాగులో 'నిజ్' అంటే తోట యజమానులు నేరుగా తమ ఆధీనంలోని భూమిలో సాగు చేయడం. 'రైతి' విధానంలో రైతులు ఒప్పందం మేరకు తమ భూముల్లో సాగు చేసేవారు."]},
{q:["This is associated with Cornwallis","కారన్ వాలిస్‌తో సంబంధం ఉన్నది"],o:[["Doctrine of Lapse","రాజ్య సంక్రమణ సిద్ధాంతం"],["Mahalwari system","మహల్వారీ పద్ధతి"],["Permanent Settlement system","శాశ్వత శిస్తు నిర్ణయ పద్ధతి"],["Ryotwari system","రైత్వారీ పద్ధతి"]],a:2,
e:["Cornwallis is linked with the Permanent Settlement (1793). The Doctrine of Lapse belongs to Dalhousie.","కారన్ వాలిస్ శాశ్వత శిస్తు నిర్ణయంతో (1793) సంబంధం కలిగి ఉన్నాడు. రాజ్య సంక్రమణ సిద్ధాంతం డల్హౌసీది."]},
{q:["Tribals follow this type of cultivation","గిరిజనులు ఈ రకమైన వ్యవసాయం చేస్తారు"],o:[["Jhum","ఝుమ్ (పోడు)"],["Intensive","సాంద్ర"],["Commercial","వాణిజ్య"],["Intensive and commercial","సాంద్ర మరియు వాణిజ్య"]],a:0,
e:["Jhum is shifting (slash-and-burn) cultivation done by tribal people, especially in the North-East. In Andhra it is called 'podu'.","ఝుమ్ అనేది గిరిజనులు చేసే విస్థాపన (నరికి కాల్చే) వ్యవసాయం, ముఖ్యంగా ఈశాన్య భారతంలో. ఆంధ్రలో దీనిని 'పోడు' అంటారు."]},
{q:["The 'Gaddi' shepherds belong to this state","'గద్దీ' గొర్రెల కాపరులు ఈ రాష్ట్రానికి చెందినవారు"],o:[["Karnataka","కర్ణాటక"],["Himachal Pradesh","హిమాచల్ ప్రదేశ్"],["Maharashtra","మహారాష్ట్ర"],["Andhra Pradesh","ఆంధ్రప్రదేశ్"]],a:1,
e:["Gaddis are shepherds of Himachal Pradesh who move to the Shivalik hills in winter and to high meadows in summer.","గద్దీలు హిమాచల్ ప్రదేశ్ గొర్రెల కాపరులు. వీరు శీతాకాలంలో శివాలిక్ కొండలకు, వేసవిలో ఎత్తైన పచ్చిక బయళ్ళకు వెళతారు."]},
{q:["The Munda tribals were living in this region","ముండా గిరిజన తెగ ప్రజలు ఈ ప్రాంతంలో నివసించేవారు"],o:[["Malwa Plateau","మాల్వా పీఠభూమి"],["Chota Nagpur Plateau","ఛోటా నాగ్‌పూర్ పీఠభూమి"],["Deccan Plateau","దక్కన్ పీఠభూమి"],["Nilgiri Hills","నీలగిరి కొండలు"]],a:1,
e:["The Mundas live in the Chota Nagpur plateau (present Jharkhand).","ముండాలు ఛోటా నాగ్‌పూర్ పీఠభూమిలో (ప్రస్తుత జార్ఖండ్) నివసిస్తారు."]},
{q:["Shifting cultivation named 'Bewar' is practised in this state","'బేవర్' అనే విస్థాపన వ్యవసాయం ఈ రాష్ట్రంలో చేస్తారు"],o:[["Sikkim","సిక్కిం"],["Odisha","ఒడిశా"],["Gujarat","గుజరాత్"],["Madhya Pradesh","మధ్యప్రదేశ్"]],a:3,
e:["Shifting cultivation has different local names: 'bewar' or 'dahiya' in Madhya Pradesh, 'podu' in Andhra Pradesh, 'jhum' in the North-East.","విస్థాపన వ్యవసాయానికి ప్రాంతాల వారీగా పేర్లు: మధ్యప్రదేశ్‌లో 'బేవర్' లేదా 'దహియా', ఆంధ్రప్రదేశ్‌లో 'పోడు', ఈశాన్య భారతంలో 'ఝుమ్'."]},
{q:["'Birsa' belonged to this tribal group","'బిర్సా' ఈ గిరిజన తెగకు చెందినవాడు"],o:[["Santhali","సంథాలీ"],["Munda","ముండా"],["Dogri","డోగ్రీ"],["Maithili","మైథిలీ"]],a:1,
e:["Birsa Munda led the Munda uprising (Ulgulan) in 1899–1900 in the Chota Nagpur region.","బిర్సా ముండా 1899–1900లో ఛోటా నాగ్‌పూర్ ప్రాంతంలో ముండా తిరుగుబాటుకు (ఉల్గులాన్) నాయకత్వం వహించాడు."]},
{q:["The 'Munda' tribal group is related to this region of India","'ముండా' తెగ భారతదేశంలోని ఈ ప్రాంతానికి చెందినది"],o:[["Chota Nagpur","ఛోటా నాగ్‌పూర్"],["Malwa","మాల్వా"],["Deccan","దక్కన్"],["Shillong","షిల్లాంగ్"]],a:0,
e:["The Mundas belong to the Chota Nagpur region of Jharkhand.","ముండాలు జార్ఖండ్‌లోని ఛోటా నాగ్‌పూర్ ప్రాంతానికి చెందినవారు."]},
{q:["The Khurda uprising (1817) took place in this state","ఖుర్దా తిరుగుబాటు (1817) జరిగిన రాష్ట్రం"],o:[["Bengal","బెంగాల్"],["Central Provinces","సెంట్రల్ ప్రావిన్సెస్"],["Bombay","బొంబాయి"],["Odisha","ఒడిశా"]],a:3,
e:["The Khurda uprising, also called the Paika rebellion, broke out in Odisha in 1817 against British rule.","పాయిక్ తిరుగుబాటుగా కూడా పిలిచే ఖుర్దా తిరుగుబాటు 1817లో ఒడిశాలో బ్రిటిష్ పాలనకు వ్యతిరేకంగా జరిగింది."]},
{q:["The last Mughal emperor","చివరి మొఘల్ చక్రవర్తి"],o:[["Sikandar Shah","సికిందర్ షా"],["Bahadur Shah Zafar","బహదూర్ షా జఫర్"],["Shah Alam","షా ఆలం"],["Mir Jafar","మీర్ జాఫర్"]],a:1,
e:["Bahadur Shah Zafar was the last Mughal emperor. After the 1857 revolt he was exiled to Rangoon, where he died in 1862.","బహదూర్ షా జఫర్ చివరి మొఘల్ చక్రవర్తి. 1857 తిరుగుబాటు తర్వాత అతన్ని రంగూన్‌కు బహిష్కరించారు, అక్కడే 1862లో మరణించాడు."]},
{q:["The Governor-General of India at the time of the Sepoy Mutiny","సిపాయిల తిరుగుబాటు సమయంలో భారత గవర్నర్ జనరల్"],o:[["William Bentinck","విలియం బెంటింక్"],["Robert Clive","రాబర్ట్ క్లైవ్"],["Lord Canning","లార్డ్ కానింగ్"],["Warren Hastings","వారెన్ హేస్టింగ్స్"]],a:2,
e:["Lord Canning was Governor-General during the 1857 revolt. In 1858 he became the first Viceroy of India.","1857 తిరుగుబాటు సమయంలో లార్డ్ కానింగ్ గవర్నర్ జనరల్. 1858లో అతను భారతదేశపు మొదటి వైస్రాయ్ అయ్యాడు."]},
{q:["She took active part in the 1857 uprising from Lucknow","ఈమె లక్నో నుండి 1857 తిరుగుబాటులో చురుకుగా పాల్గొన్నారు"],o:[["Begum Hazrat Mahal","బేగం హజ్రత్ మహల్"],["Lakshmi Bai","లక్ష్మీబాయి"],["Kannamma","కన్నమ్మ"],["Leelavathi","లీలావతి"]],a:0,
e:["Begum Hazrat Mahal led the revolt in Lucknow (Awadh). Rani Lakshmi Bai led it in Jhansi.","బేగం హజ్రత్ మహల్ లక్నో (అవధ్)లో తిరుగుబాటుకు నాయకత్వం వహించారు. రాణి లక్ష్మీబాయి ఝాన్సీలో నాయకత్వం వహించారు."]},
{q:["Governor-General Canning decided that he would be the last Mughal king","గవర్నర్ జనరల్ కానింగ్ ఇతనే చివరి మొఘల్ రాజు అని నిర్ణయించాడు"],o:[["Shah Jahan","షాజహాన్"],["Aurangzeb","ఔరంగజేబు"],["Bahadur Shah Zafar","బహదూర్ షా జఫర్"],["Jahangir","జహంగీర్"]],a:2,
e:["Canning decided that after Bahadur Shah Zafar's death no one would be recognised as Mughal king, so he would be the last.","బహదూర్ షా జఫర్ తర్వాత ఎవరినీ మొఘల్ రాజుగా గుర్తించకూడదని కానింగ్ నిర్ణయించాడు; అందువల్ల అతనే చివరివాడు."]},
{q:["He represented the sepoy revolt in Kanpur","కాన్పూర్‌లో సిపాయిల తిరుగుబాటుకు ప్రాతినిధ్యం వహించినవారు"],o:[["Rani Avanti Bai","రాణి అవంతీబాయి"],["Nana Saheb","నానా సాహెబ్"],["Bakht Khan","భక్త్ ఖాన్"],["Kunwar Singh","కున్వర్ సింగ్"]],a:1,
e:["Nana Saheb, adopted son of Peshwa Baji Rao II, led the revolt in Kanpur. Bakht Khan led it in Delhi and Kunwar Singh in Arrah (Bihar).","పీష్వా రెండవ బాజీరావు దత్తపుత్రుడు నానా సాహెబ్ కాన్పూర్‌లో నాయకత్వం వహించాడు. భక్త్ ఖాన్ ఢిల్లీలో, కున్వర్ సింగ్ ఆరా (బీహార్)లో నాయకత్వం వహించారు."]},
{q:["Founder of the 'Indian National Army'","'భారత జాతీయ సైన్యం' (INA) స్థాపకుడు"],o:[["Bhagat Singh","భగత్ సింగ్"],["Subhash Chandra Bose","సుభాష్ చంద్రబోస్"],["Mahatma Gandhi","మహాత్మా గాంధీ"],["Bal Gangadhar Tilak","బాల గంగాధర తిలక్"]],a:1,
e:["Subhash Chandra Bose organised and led the INA (Azad Hind Fauj) from 1943 with the call 'Delhi Chalo'. It was first formed by Mohan Singh in 1942.","సుభాష్ చంద్రబోస్ 1943 నుండి 'ఢిల్లీ చలో' నినాదంతో INA (ఆజాద్ హింద్ ఫౌజ్)ను నడిపించారు. దీనిని మొదట 1942లో మోహన్ సింగ్ ఏర్పాటు చేశారు."]},
{q:["The slogan 'Do or Die' was given by","'సాధించు లేదా మరణించు' అనే నినాదం ఇచ్చినవారు"],o:[["Mahatma Gandhi","మహాత్మా గాంధీ"],["Bal Gangadhar Tilak","బాల గంగాధర తిలక్"],["Gopal Krishna Gokhale","గోపాలకృష్ణ గోఖలే"],["Bhagat Singh","భగత్ సింగ్"]],a:0,
e:["Gandhiji gave the call 'Do or Die' at the start of the Quit India Movement in August 1942.","1942 ఆగస్టులో క్విట్ ఇండియా ఉద్యమం ప్రారంభంలో గాంధీజీ 'సాధించు లేదా మరణించు' అని పిలుపునిచ్చారు."]},
{q:["This dynasty ruled France","ఫ్రాన్స్‌ను పాలించిన రాజవంశం"],o:[["Bourbon","బూర్బన్"],["Hohenzollern","హోహెన్‌జోలర్న్"],["Romanov","రోమనోవ్"],["Tudor","ట్యూడర్"]],a:0,
e:["The Bourbons ruled France (Louis XVI at the time of the French Revolution). Hohenzollerns ruled Prussia/Germany, Romanovs Russia, Tudors England.","బూర్బన్ వంశం ఫ్రాన్స్‌ను పాలించింది (ఫ్రెంచ్ విప్లవ సమయంలో పదహారవ లూయీ). హోహెన్‌జోలర్న్‌లు ప్రష్యా/జర్మనీని, రోమనోవ్‌లు రష్యాను, ట్యూడర్‌లు ఇంగ్లాండ్‌ను పాలించారు."]},
{q:["In this year the 'Rowlatt Act' was passed","ఈ సంవత్సరంలో రౌలట్ చట్టం ఆమోదించబడింది"],o:[["1919","1919"],["1910","1910"],["1911","1911"],["1905","1905"]],a:0,
e:["The Rowlatt Act (1919) allowed arrest and detention without trial. Protests against it led to the Jallianwala Bagh massacre (13 April 1919).","రౌలట్ చట్టం (1919) విచారణ లేకుండా అరెస్టు, నిర్బంధానికి అనుమతించింది. దీనికి వ్యతిరేక నిరసనలు జలియన్‌వాలాబాగ్ దురంతానికి (1919 ఏప్రిల్ 13) దారితీశాయి."]},
{q:["This freedom fighter arrived in India from South Africa in 1915","1915లో దక్షిణాఫ్రికా నుండి భారతదేశానికి వచ్చిన స్వాతంత్ర్య సమరయోధుడు"],o:[["Tilak","తిలక్"],["Patel","పటేల్"],["Nehru","నెహ్రూ"],["Gandhi","గాంధీ"]],a:3,
e:["Gandhiji returned to India from South Africa on 9 January 1915. This day is now observed as Pravasi Bharatiya Divas.","గాంధీజీ 1915 జనవరి 9న దక్షిణాఫ్రికా నుండి భారతదేశానికి తిరిగి వచ్చారు. ఈ రోజును ఇప్పుడు ప్రవాసీ భారతీయ దివస్‌గా జరుపుకుంటారు."]},
{q:["Identify the mismatched pair","సరికాని జతను గుర్తించండి"],o:[["1905 – Vandemataram Movement","1905 – వందేమాతరం ఉద్యమం"],["1919 – Rowlatt Act","1919 – రౌలట్ చట్టం"],["1920 – Quit India Movement","1920 – క్విట్ ఇండియా ఉద్యమం"],["1935 – Government of India Act","1935 – భారత ప్రభుత్వ చట్టం"]],a:2,
e:["The Quit India Movement began in 1942. The movement of 1920 was the Non-Cooperation Movement.","క్విట్ ఇండియా ఉద్యమం 1942లో ప్రారంభమైంది. 1920లో జరిగింది సహాయ నిరాకరణ ఉద్యమం."]},
{q:["The king of Russia during the Russian Revolution","రష్యా విప్లవ కాలంలో రష్యా రాజు"],o:[["Tsar Nicholas II","జార్ రెండవ నికోలస్"],["Tsar Nicholas III","జార్ మూడవ నికోలస్"],["Tsar Nicholas IV","జార్ నాల్గవ నికోలస్"],["Tsar Nicholas I","జార్ మొదటి నికోలస్"]],a:0,
e:["Tsar Nicholas II, the last Romanov ruler, gave up the throne in March 1917. There was no Nicholas III or IV.","చివరి రోమనోవ్ పాలకుడు జార్ రెండవ నికోలస్ 1917 మార్చిలో సింహాసనం వదులుకున్నాడు. మూడవ, నాల్గవ నికోలస్ అనేవారు లేరు."]},
{q:["The book 'The Spirit of Laws' was written by","'ది స్పిరిట్ ఆఫ్ లాస్' గ్రంథాన్ని రచించినవారు"],o:[["Rousseau","రూసో"],["John Locke","జాన్ లాక్"],["Mirabeau","మిరాబు"],["Montesquieu","మాంటెస్క్యూ"]],a:3,
e:["Montesquieu wrote 'The Spirit of Laws' (1748), proposing separation of powers among the legislature, executive and judiciary. Rousseau wrote 'The Social Contract'.","మాంటెస్క్యూ 'ది స్పిరిట్ ఆఫ్ లాస్' (1748) రాశాడు. శాసన, కార్యనిర్వాహక, న్యాయ శాఖల మధ్య అధికార విభజనను ప్రతిపాదించాడు. రూసో 'సోషల్ కాంట్రాక్ట్' రాశాడు."]},
{q:["Name of the Russian Parliament","రష్యా పార్లమెంటు పేరు"],o:[["Diet","డైట్"],["Reichstag","రైక్‌స్టాగ్"],["Bundestag","బుండెస్టాగ్"],["Duma","డ్యూమా"]],a:3,
e:["The Russian parliament is the Duma. The Diet is Japan's, and Reichstag/Bundestag are German parliaments.","రష్యా పార్లమెంటు డ్యూమా. డైట్ జపాన్‌ది; రైక్‌స్టాగ్/బుండెస్టాగ్ జర్మనీ పార్లమెంటులు."]},
{q:["'Dhangar' pastoralists live in this state","'ధంగర్' పశుపోషకులు ఈ రాష్ట్రంలో నివసిస్తారు"],o:[["Bihar","బీహార్"],["Maharashtra","మహారాష్ట్ర"],["Odisha","ఒడిశా"],["Tamil Nadu","తమిళనాడు"]],a:1,
e:["Dhangars are a pastoral community of Maharashtra who move between the central plateau and the Konkan with their flocks.","ధంగర్‌లు మహారాష్ట్రకు చెందిన పశుపోషక సమూహం. వీరు తమ మందలతో మధ్య పీఠభూమి, కొంకణ్ మధ్య సంచరిస్తారు."]},
{q:["Unit of currency in France","ఫ్రాన్స్‌లో ద్రవ్య కొలమానం"],o:[["Mark","మార్క్"],["Tithe","టైద్"],["Taille","టైల్"],["Livre","లివర్"]],a:3,
e:["The livre was the currency of France until 1794. Tithe was a tax paid to the Church and taille was a direct tax paid to the state.","1794 వరకు ఫ్రాన్స్ ద్రవ్యం లివర్. టైద్ చర్చికి చెల్లించే పన్ను; టైల్ ప్రభుత్వానికి చెల్లించే ప్రత్యక్ష పన్ను."]},
{q:["The Vienna peace settlement was held in this year","ఈ సంవత్సరంలో వియన్నా శాంతి ఒడంబడిక జరిగింది"],o:[["1814","1814"],["1816","1816"],["1815","1815"],["1819","1819"]],a:2,
e:["After Napoleon's defeat, European powers met at the Congress of Vienna and signed the Treaty of Vienna in 1815, hosted by Austrian chancellor Metternich.","నెపోలియన్ ఓటమి తర్వాత ఆస్ట్రియా ఛాన్సలర్ మెటర్నిక్ ఆధ్వర్యంలో యూరప్ దేశాలు వియన్నాలో సమావేశమై 1815లో వియన్నా ఒప్పందం చేసుకున్నాయి."]},
{q:["The 'Corn Laws' came into existence in this country","'మొక్కజొన్న చట్టాలు' (కార్న్ లాస్) ఈ దేశంలో అమల్లోకి వచ్చాయి"],o:[["Britain","బ్రిటన్"],["America","అమెరికా"],["Germany","జర్మనీ"],["Spain","స్పెయిన్"]],a:0,
e:["Britain's Corn Laws restricted the import of grain to protect landlords. They were abolished in 1846.","బ్రిటన్ భూస్వాములను కాపాడేందుకు కార్న్ లాస్ ధాన్యం దిగుమతిని నియంత్రించాయి. వీటిని 1846లో రద్దు చేశారు."]},
{q:["Transvaal gold fields are located in","ట్రాన్స్‌వాల్ బంగారు గనులు ఇక్కడ ఉన్నాయి"],o:[["South Africa","దక్షిణాఫ్రికా"],["Italy","ఇటలీ"],["Japan","జపాన్"],["France","ఫ్రాన్స్"]],a:0,
e:["Gold was found in the Transvaal (Witwatersrand, near Johannesburg) in South Africa in 1886.","1886లో దక్షిణాఫ్రికాలోని ట్రాన్స్‌వాల్ (జోహన్నెస్‌బర్గ్ సమీపంలోని విట్‌వాటర్స్‌రాండ్)లో బంగారం కనుగొనబడింది."]},
{q:["The period of the First World War","మొదటి ప్రపంచ యుద్ధ కాలం"],o:[["1914–1918","1914–1918"],["1918–1924","1918–1924"],["1939–1945","1939–1945"],["1935–1939","1935–1939"]],a:0,
e:["The First World War was fought from 1914 to 1918. The Second World War was from 1939 to 1945.","మొదటి ప్రపంచ యుద్ధం 1914 నుండి 1918 వరకు జరిగింది. రెండవ ప్రపంచ యుద్ధం 1939 నుండి 1945 వరకు."]},
{q:["The Silk Route connected these regions","సిల్క్ మార్గం (పట్టు మార్గం) ఈ ప్రాంతాలను కలిపింది"],o:[["North America – Europe","ఉత్తర అమెరికా – యూరప్"],["Europe – South America","యూరప్ – దక్షిణ అమెరికా"],["Asia – Australia","ఆసియా – ఆస్ట్రేలియా"],["Asia – Europe","ఆసియా – యూరప్"]],a:3,
e:["The Silk Route was a network of land and sea routes linking China and Asia with Europe and North Africa. Chinese silk was the main trade item.","సిల్క్ మార్గం చైనా, ఆసియాలను యూరప్, ఉత్తర ఆఫ్రికాలతో కలిపిన భూ, సముద్ర మార్గాల సమూహం. చైనా పట్టు ప్రధాన వ్యాపార వస్తువు."]},
{q:["The First World War (1914–18) was mainly fought in this continent","మొదటి ప్రపంచ యుద్ధం (1914–18) ప్రధానంగా ఈ ఖండంలో జరిగింది"],o:[["Europe","యూరప్"],["Africa","ఆఫ్రికా"],["South America","దక్షిణ అమెరికా"],["Asia","ఆసియా"]],a:0,
e:["The First World War was fought mainly in Europe, between the Allies (Britain, France, Russia) and the Central Powers (Germany, Austria-Hungary, Ottoman Turkey).","మొదటి ప్రపంచ యుద్ధం ప్రధానంగా యూరప్‌లో మిత్రరాజ్యాలు (బ్రిటన్, ఫ్రాన్స్, రష్యా), కేంద్ర రాజ్యాలు (జర్మనీ, ఆస్ట్రియా-హంగరీ, ఒట్టోమన్ టర్కీ) మధ్య జరిగింది."]},
{q:["The Great Depression occurred in this year","మహా ఆర్థిక మాంద్యం ఈ సంవత్సరంలో సంభవించింది"],o:[["1815","1815"],["1929","1929"],["1942","1942"],["1930","1930"]],a:1,
e:["The Great Depression began in 1929 with the Wall Street (US) stock market crash and lasted until the mid-1930s.","మహా మాంద్యం 1929లో అమెరికాలో వాల్ స్ట్రీట్ స్టాక్ మార్కెట్ పతనంతో మొదలై 1930ల మధ్య వరకు కొనసాగింది."]},
{q:["This is called the first symbol of the new era","కొత్త శకానికి మొదటి చిహ్నంగా పిలువబడేది"],o:[["Steam engine","ఆవిరి యంత్రం"],["Spinning jenny","నూలు వడికే యంత్రం (స్పిన్నింగ్ జెన్నీ)"],["Cotton","పత్తి"],["Jute","జనుము"]],a:2,
e:["In the Industrial Revolution, cotton was the leading industry. Historians call cotton the first symbol of the new era.","పారిశ్రామిక విప్లవంలో పత్తి పరిశ్రమ అగ్రగామి. చరిత్రకారులు పత్తిని కొత్త శకపు మొదటి చిహ్నంగా పేర్కొన్నారు."]},
{q:["Marco Polo belonged to this country","మార్కోపోలో ఈ దేశానికి చెందినవాడు"],o:[["Italy","ఇటలీ"],["China","చైనా"],["Africa","ఆఫ్రికా"],["India","ఇండియా"]],a:0,
e:["Marco Polo was a traveller from Venice, Italy. He travelled to China in the 13th century and visited South India, including the Kakatiya kingdom.","మార్కోపోలో ఇటలీలోని వెనిస్‌కు చెందిన యాత్రికుడు. 13వ శతాబ్దంలో చైనాకు ప్రయాణించి, కాకతీయ రాజ్యంతో సహా దక్షిణ భారతదేశాన్ని సందర్శించాడు."]},
{q:["The first Indian jute mill was established in 1917 at","1917లో మొట్టమొదటి భారతీయ జనపనార మిల్లును ఇక్కడ స్థాపించారు"],o:[["Calcutta","కలకత్తా"],["Madras","మద్రాసు"],["Meerut","మీరట్"],["Delhi","ఢిల్లీ"]],a:0,
e:["The first Indian-owned jute mill was set up in Calcutta in 1917 by Seth Hukumchand. Jute mills are concentrated along the Hooghly in West Bengal.","మొదటి భారతీయ యాజమాన్య జనపనార మిల్లును 1917లో సేఠ్ హుకుంచంద్ కలకత్తాలో స్థాపించారు. జనపనార మిల్లులు పశ్చిమ బెంగాల్‌లోని హుగ్లీ నది వెంట కేంద్రీకృతమయ్యాయి."]},
{q:["Raja Ravi Varma was a","రాజా రవివర్మ ఒక"],o:[["Scientist","శాస్త్రవేత్త"],["Painter","చిత్రకారుడు"],["Economist","ఆర్థికవేత్త"],["Politician","రాజకీయ నాయకుడు"]],a:1,
e:["Raja Ravi Varma of Kerala was a famous painter known for pictures of scenes from the epics. His prints were mass-produced.","కేరళకు చెందిన రాజా రవివర్మ ఇతిహాస దృశ్యాల చిత్రాలకు ప్రసిద్ధి చెందిన చిత్రకారుడు. ఆయన చిత్రాల ప్రతులు పెద్ద సంఖ్యలో ముద్రించబడ్డాయి."]},
{q:["The Bengal Gazette, edited by James Augustus Hickey, was a","జేమ్స్ అగస్టస్ హికీ సంపాదకత్వంలో వెలువడిన బెంగాల్ గెజిట్ ఒక"],o:[["Fortnightly magazine","పక్ష పత్రిక"],["Weekly magazine","వార పత్రిక"],["Monthly magazine","మాస పత్రిక"],["Daily magazine","దిన పత్రిక"]],a:1,
e:["Hickey started the Bengal Gazette in 1780 as a weekly. It was the first newspaper in India.","హికీ 1780లో బెంగాల్ గెజిట్‌ను వార పత్రికగా ప్రారంభించాడు. ఇది భారతదేశంలో మొదటి వార్తాపత్రిక."]},
{q:["The Industrial Revolution started first in this country","పారిశ్రామిక విప్లవం మొదట ఈ దేశంలో ప్రారంభమైంది"],o:[["Britain","బ్రిటన్"],["America","అమెరికా"],["Japan","జపాన్"],["Russia","రష్యా"]],a:0,
e:["The Industrial Revolution began in Britain in the late 18th century, helped by coal, iron, capital and colonial markets.","బొగ్గు, ఇనుము, పెట్టుబడి, వలస మార్కెట్ల సహాయంతో 18వ శతాబ్దం చివరలో బ్రిటన్‌లో పారిశ్రామిక విప్లవం ప్రారంభమైంది."]},
{q:["The first Indian female doctor","భారతదేశపు మొదటి మహిళా వైద్యురాలు"],o:[["Sarojini Naidu","సరోజినీ నాయుడు"],["Kadambini Ganguly","కాదంబినీ గంగూలీ"],["Anandi Bai Joshi","ఆనందీబాయి జోషి"],["Savitribai Phule","సావిత్రిబాయి ఫూలే"]],a:2,
e:["As per the answer key, Anandi Bai Joshi. She earned a medical degree in the USA in 1886. Kadambini Ganguly qualified in the same year and practised in India, so some books name her.","జవాబు కీ ప్రకారం ఆనందీబాయి జోషి. ఆమె 1886లో అమెరికాలో వైద్య పట్టా పొందారు. కాదంబినీ గంగూలీ కూడా అదే సంవత్సరం అర్హత సాధించి భారత్‌లో వైద్యం చేశారు, కాబట్టి కొన్ని పుస్తకాలు ఆమె పేరు చెబుతాయి."]},

e:["Mandela fought apartheid and became South Africa's first Black president (1994). For his struggle he is called the 'Gandhi of South Africa'; he received the Bharat Ratna in 1990.","మండేలా వర్ణవివక్షపై పోరాడి 1994లో దక్షిణాఫ్రికా మొదటి నల్లజాతి అధ్యక్షుడయ్యారు. ఆయనను 'దక్షిణాఫ్రికా గాంధీ' అంటారు; 1990లో భారతరత్న పొందారు."]},

{q:["She is regarded as the first female teacher in India","భారతదేశపు మొదటి మహిళా ఉపాధ్యాయురాలిగా పరిగణించబడేవారు"],o:[["Savitribai Phule","సావిత్రిబాయి ఫూలే"],["Anandi Bai Joshi","ఆనందీబాయి జోషి"],["Sindhutai","సింధుతాయి"],["Kadambini Ganguly","కాదంబినీ గంగూలీ"]],a:0,
e:["Savitribai Phule, with Jyotirao Phule, started a school for girls in Pune in 1848 and taught there.","సావిత్రిబాయి ఫూలే, జ్యోతిరావు ఫూలేతో కలిసి 1848లో పుణేలో బాలికల పాఠశాల ప్రారంభించి అక్కడ బోధించారు."]},

e:["Education is a tool that reduces inequality. Traditions, unequal wealth and power create inequalities.","విద్య అసమానతలను తగ్గించే సాధనం. సాంప్రదాయాలు, అసమాన సంపద, అధికారం అసమానతలను సృష్టిస్తాయి."]},

e:["Savitribai Phule was born in Naigaon, Satara district, Maharashtra (1831) and worked in Pune.","సావిత్రిబాయి ఫూలే మహారాష్ట్ర సతారా జిల్లాలోని నైగావ్‌లో (1831) జన్మించి పుణేలో సేవ చేశారు."]}
];
const BASE=100;

const UI={
 en:{q:"Question",of:"of",score:"Score",prev:"◀ Previous",next:"Next ▶",finish:"See result",right:"Correct!",wrong:"Wrong. Correct answer:",map:"Question map",lr:"Correct",lw:"Wrong",lu:"Not answered",done:"Quiz complete",again:"Start again",att:"Answered"},
 te:{q:"ప్రశ్న",of:"/",score:"స్కోరు",prev:"◀ వెనుకకు",next:"తర్వాత ▶",finish:"ఫలితం చూడండి",right:"సరైన సమాధానం!",wrong:"తప్పు. సరైన సమాధానం:",map:"ప్రశ్నల పటం",lr:"సరైనవి",lw:"తప్పులు",lu:"జవాబు ఇవ్వనివి",done:"క్విజ్ పూర్తయింది",again:"మళ్ళీ ప్రారంభించండి",att:"జవాబిచ్చినవి"}
};
let lang="both",cur=0,ans=Array(Q.length).fill(null),showResult=false;
try{const s=JSON.parse(localStorage.getItem("tet2a-soc3")||"null");if(s){lang=s.lang||lang;cur=s.cur||0;if(Array.isArray(s.ans)&&s.ans.length===Q.length)ans=s.ans;}}catch(e){}
const save=()=>{try{localStorage.setItem("tet2a-soc3",JSON.stringify({lang,cur,ans}))}catch(e){}};
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function bi(p){ // p=[en,te]
  if(lang==="en")return `<span class="en">${esc(p[0])}</span>`;
  if(lang==="te")return `<span class="te">${esc(p[1])}</span>`;
  return p[0]===p[1]?`<span class="en">${esc(p[0])}</span>`:`<span class="en">${esc(p[0])}</span><span class="te">${esc(p[1])}</span>`;
}
function lbl(k){ if(lang==="en")return UI.en[k]; if(lang==="te")return UI.te[k]; return UI.te[k]+" / "+UI.en[k]; }
const K=["A","B","C","D"];
function render(){
  document.querySelectorAll(".langs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===lang));
  const done=ans.filter(x=>x!==null).length, right=ans.filter((x,i)=>x===Q[i].a).length;
  document.getElementById("s-pos").innerHTML=`${lbl("att")}: <b>${done}/${Q.length}</b>`;
  document.getElementById("s-score").innerHTML=`${lbl("score")}: <b>${right}</b>`;
  document.getElementById("s-bar").style.width=(done/Q.length*100)+"%";
  const card=document.getElementById("card");
  if(showResult){
    const wrong=done-right;
    card.className="card result";
    card.innerHTML=`<div class="qno">${lbl("done")}</div><div class="big">${right} / ${Q.length}</div>
      <div>${lbl("lr")}: <b>${right}</b> · ${lbl("lw")}: <b>${wrong}</b> · ${lbl("lu")}: <b>${Q.length-done}</b></div>
      <div class="nav" style="justify-content:center"><button id="again">${lbl("again")}</button></div>`;
    document.getElementById("again").onclick=()=>{ans=Array(Q.length).fill(null);cur=0;showResult=false;save();render();};
  } else {
    card.className="card";
    const q=Q[cur],picked=ans[cur];
    let h=`<div class="qno">${lbl("q")} ${BASE+cur+1} / ${BASE+Q.length}</div><div class="qtext">${bi(q.q)}</div>`;
    if(q.m){
      const mh=q.mh||[["Colour","రంగు"],["Feature","స్వరూపం"]];const hd=k=>lang==="en"?mh[k][0]:lang==="te"?mh[k][1]:mh[k][0]+" / "+mh[k][1];
      const cell=p=>lang==="en"?esc(p[0]):lang==="te"?`<span style="font-family:var(--f-te)">${esc(p[1])}</span>`:`${esc(p[0])}<small>${esc(p[1])}</small>`;
      h+=`<div class="mtab"><table><thead><tr><th>${hd(0)}</th><th>${hd(1)}</th></tr></thead><tbody>`+
         q.m.map(r=>`<tr><td>${cell(r[0])}</td><td>${cell(r[1])}</td></tr>`).join("")+`</tbody></table></div>`;
    }
    h+=`<div class="opts">`+q.o.map((o,i)=>{
      let c="";if(picked!==null){if(i===q.a)c="right";else if(i===picked)c="wrong";}
      return `<button class="opt ${c}" id="opt${i}" data-i="${i}" ${picked!==null?"disabled":""}><span class="k">${K[i]}</span><span class="t">${bi(o)}</span></button>`;
    }).join("")+`</div>`;
    if(picked!==null){
      const ok=picked===q.a;
      const v=ok?`<span class="verdict ok">✔ ${lbl("right")}</span>`:`<span class="verdict no">✘ ${lbl("wrong")} ${K[q.a]}</span>`;
      h+=`<div class="exp">${v}${bi(q.e)}</div>`;
    }
    const last=cur===Q.length-1;
    h+=`<div class="nav"><button class="ghost" id="prev" ${cur===0?"disabled":""}>${lbl("prev")}</button><button id="next">${last?lbl("finish"):lbl("next")}</button></div>`;
    card.innerHTML=h;
    card.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ans[cur]=+b.dataset.i;save();render();});
    document.getElementById("prev").onclick=()=>{cur--;save();render();};
    document.getElementById("next").onclick=()=>{if(last){showResult=true;}else cur++;save();render();window.scrollTo({top:0,behavior:"smooth"});};
  }
  document.getElementById("map-h").textContent=lbl("map");
  document.getElementById("legend").innerHTML=`<span style="--c:var(--ok)">${lbl("lr")}</span><span style="--c:var(--bad)">${lbl("lw")}</span><span style="--c:var(--line)">${lbl("lu")}</span>`;
  const g=document.getElementById("grid");
  g.innerHTML=Q.map((q,i)=>{let c=ans[i]===null?"":ans[i]===q.a?"r":"w";if(i===cur&&!showResult)c+=" cur";return `<button class="${c}" data-i="${i}" aria-label="Q ${BASE+i+1}">${BASE+i+1}</button>`}).join("");
  g.querySelectorAll("button").forEach(b=>b.onclick=()=>{cur=+b.dataset.i;showResult=false;save();render();document.getElementById("card").scrollIntoView({behavior:"smooth",block:"start"});});
}
document.querySelectorAll(".langs button").forEach(b=>b.onclick=()=>{lang=b.dataset.l;save();render();});
render();
</script>
